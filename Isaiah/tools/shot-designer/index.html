<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Isaiah</title>
<!--
  SCENE DIRECTOR NOTES — Isaiah (Isaiah 1–12, 36–40, 53, 65–66)
  9 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. A City in Need
     The Lord indicts a city full of sacrifices but no justice; the hands are full of blood. Stage: a temple courtyard with a heap of offerings, a city behind its wall, a widow and an orphan in the street; a bright altar, a dark street; the same sun on both.

  2. The Holy Throne
     In the year King Uzziah died, Isaiah sees the Lord on a throne, high and lifted up, with seraphim crying holy, holy, holy. Stage: a temple in a vision, the throne filling the hall, a train of fire, six-winged seraphim, an altar coal touching the prophet's lips; blinding, trembling light.

  3. The Vineyard Song
     The Lord sings of a vineyard planted on a fertile hill that yielded wild grapes instead of justice. Stage: a terraced vineyard at harvest, a stone watchtower, a winepress; grapes rotting on the vine; a golden hillside with a sad song over it.

  4. Immanuel Sign
     To faithless Ahaz the prophet gives a sign: the young woman is with child and shall call his name Immanuel — God with us. Stage: a king on a throne at the end of a conduit, a prophet refusing a sign, a child on the road beyond; winter light, the first promise of a birth.

  5. The Assyrian Shadow
     The Assyrian advances like a river, and the surviving stump of Jesse stands as a banner for the peoples. Stage: a great army crossing a plain, a felled tree with a living shoot, a banner raised on a hill; a dark flood of bronze and a single green branch.

  6. Hezekiah's Crisis
     Sennacherib's letters threaten Jerusalem; Hezekiah spreads the letter before the Lord, and the angel strikes the camp. Stage: a royal chamber at night, a letter on a table, the king in prayer; dawn light through the windows, a camp of silent tents beyond the walls.

  7. Comfort My People
     A voice cries: prepare the way of the Lord in the wilderness, every valley shall be exalted. Stage: a desert road being built at dawn, a voice in the waste land, the glory of the Lord to be revealed; a smooth highway rising over the sand.

  8. The Servant
     The servant is despised and pierced for our transgressions, and by his wounds we are healed. Stage: a figure on a lonely road at dusk, shadowed by a crowd, wounds in his hands; a lantern carried in the dark; the quietest, darkest scene of the book.

  9. New Creation
     The Lord promises new heavens and a new earth, where the wolf and lamb feed together and the city needs no sun. Stage: a rebuilt city on a hill, a lion and a lamb at its gate, children in the streets; warm, golden, endless light.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
