<!--
  SCENE DIRECTOR NOTES — Isaiah (Isaiah 1–12, 36–40, 53, 65–66)
  9 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. A City in Need
     The Lord indicts a city full of sacrifices but no justice; the hands are full of blood. Stage: a temple courtyard with a heap of offerings, a city behind its wall, a widow and an orphan in the street; a bright altar, a dark street; the same sun on both.

  2. The Holy Throne
     In the year King Uzziah died, Isaiah sees the Lord on a throne, high and lifted up, with seraphim crying holy, holy, holy. Stage: a temple in a vision, the throne filling the hall, a train of fire, six-winged seraphim, an altar coal touching the prophet's lips; blinding, trembling light.

  3. The Vineyard Song
     The Lord sings of a vineyard planted on a fertile hill that yielded wild grapes instead of justice. Stage: a terraced vineyard at harvest, a stone watchtower, a winepress; grapes rotting on the vine; a golden hillside with a sad song over it.

  4. Immanuel Sign
     To faithless Ahaz the prophet gives a sign: the young woman is with child and shall call his name Immanuel — God with us. Stage: a king on a throne at the end of a conduit, a prophet refusing a sign, a child on the road beyond; winter light, the first promise of a birth.

  5. The Assyrian Shadow
     The Assyrian advances like a river, and the surviving stump of Jesse stands as a banner for the peoples. Stage: a great army crossing a plain, a felled tree with a living shoot, a banner raised on a hill; a dark flood of bronze and a single green branch.

  6. Hezekiah’s Crisis
     Sennacherib's letters threaten Jerusalem; Hezekiah spreads the letter before the Lord, and the angel strikes the camp. Stage: a royal chamber at night, a letter on a table, the king in prayer; dawn light through the windows, a camp of silent tents beyond the walls.

  7. Comfort My People
     A voice cries: prepare the way of the Lord in the wilderness, every valley shall be exalted. Stage: a desert road being built at dawn, a voice in the waste land, the glory of the Lord to be revealed; a smooth highway rising over the sand.

  8. The Servant
     The servant is despised and pierced for our transgressions, and by his wounds we are healed. Stage: a figure on a lonely road at dusk, shadowed by a crowd, wounds in his hands; a lantern carried in the dark; the quietest, darkest scene of the book.

  9. New Creation
     The Lord promises new heavens and a new earth, where the wolf and lamb feed together and the city needs no sun. Stage: a rebuilt city on a hill, a lion and a lamb at its gate, children in the streets; warm, golden, endless light.
  -->
