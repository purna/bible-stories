<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Joshua</title>
<!--
  SCENE DIRECTOR NOTES — Joshua (Joshua 1–24)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. Be Strong
     The Lord commissions Joshua: be strong and courageous, for the Lord your God is with you wherever you go. Stage: the plains of Moab at dawn, Moses gone, Joshua standing at the edge of the river, the people behind him; a new leader, a long road, the light coming up.

  2. Rahab and the Spies
     Two spies are hidden by Rahab the prostitute on the wall of Jericho, and she marks the scarlet cord in the window. Stage: a city wall at night, a rooftop with flax, two men in the dark, a scarlet cord at the window; the sound of a closing gate, a bargain of faith.

  3. Crossing Jordan
     The priests carry the ark into the Jordan, the waters stop, and the people cross on dry ground; twelve stones are taken from the riverbed. Stage: the river in flood, the ark in the water, the people crossing, the waters piled up; morning light, the first stones of a memorial.

  4. Jericho
     The people march around the city once a day for six days, and seven times on the seventh, and the walls fall. Stage: a walled city at dawn, a silent people marching, priests with rams' horns, the walls crumbling; dust, a shout, a city laid open.

  5. Achan's Hidden Goods
     Achan hides a Babylonian garment and silver from the spoil, and the loss at Ai is traced to him. Stage: a camp at dusk, a tent with a hidden seam, a man and his family among the stones; a search in the dark, a fire rising, a community's grief.

  6. Ai
     Joshua sets an ambush and takes Ai, and the people of Ai are taken captive. Stage: a ruined hill at dawn, a retreating force, an ambush in the fields, the city burning; smoke over a valley, a battle learned the hard way.

  7. The Gibeonites
     The Gibeonites come in worn clothes and dry bread, pretending to be from afar, and a covenant is made. Stage: a camp at noon, dusty travellers with patched sandals and dry bread, a treaty sealed; a leader's oath, a lesson in haste.

  8. The Long Campaign
     Five kings of the Amorites are defeated at Gibeon, and Joshua asks the sun to stand still over Gibeon. Stage: a plain at high noon, a battle in the open, the sun hanging in the sky, a hailstorm on the fleeing kings; the longest day of the year.

  9. Allot the Land
     The land is divided among the tribes at Shiloh, with Caleb's Hebron and the cities of refuge marked out. Stage: a great assembly at Shiloh, a map of boundaries, families lifting their inheritance; a tent of meeting, the land measured and given.

  10. Choose This Day
     Joshua gathers the people at Shechem and says: choose this day whom you will serve, but as for me and my house, we will serve the Lord. Stage: a great stone under the oaks of Shechem, an old man speaking, the people answering; a covenant renewed, the sun setting on a lifetime.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
