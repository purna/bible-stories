  SCENE DIRECTOR NOTES — Eiljah (1 Kings 17–19, 21; 2 Kings 2)
  9 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Drought
     Elijah the Tishbite proclaims a drought and is sent to the brook Cherith, where ravens bring him bread and meat. Stage: a cracked brook bed in a limestone wadi, a lone prophet in patched cloth, ravens landing with crusts; dust, heat shimmer, a dry riverbed.

  2. The Widow’s Jar
     At Zarephath a widow shares her last flour and oil, and Elijah keeps her jar and bowl from emptying through the drought. Stage: a tiny Phoenician kitchen, a handful of flour, a cruse of oil, a boy gathering sticks; a miracle of measure in a windowless room, one lamp.

  3. The Child Restored
     The widow's son falls ill and dies; Elijah carries him upstairs, stretches himself on the boy three times, and prays until life returns. Stage: a rooftop chamber at night, the prophet on the bed, the boy still, then stirring; a single oil lamp, deep shadow, held breath.

  4. Mount Carmel
     Elijah repairs the altar with twelve stones, drenches it with water, and calls down fire while the prophets of Baal cry out in vain. Stage: a ruined altar on a bare mountain headland, twelve stones, water running, a pillar of fire at dusk; the sea below, a crowd of prophets in panic.

  5. The Rain Returns
     Elijah prays seven times, a cloud no bigger than a man's hand rises over the sea, and he runs before Ahab's chariot to Jezreel. Stage: a headland at sunset, a small cloud, the sky darkening, the prophet running with his cloak flying; rain sweeping in, black clouds and gold rifts.

  6. Under the Broom Tree
     Fleeing Jezebel, Elijah collapses under a broom tree and asks to die; an angel wakes him with bread and water. Stage: a scorched wilderness, a lone broom bush, a sleeping figure, a shining messenger kneeling beside him; harsh noon light turning gentle.

  7. The Quiet Voice
     At Horeb the Lord passes in wind, earthquake and fire — and speaks in a sound of sheer silence; Elijah wraps his face in his mantle. Stage: a cave mouth on the mountain, the prophet listening in the dark, the wind outside bending the scrub; an enormous stillness in the frame.

  8. Naboth’s Vineyard
     Ahab and Jezebel seize Naboth's ancestral vineyard by false witness, and Elijah confronts the king in the field. Stage: a vineyard on a terraced slope at harvest, a dead man's land being measured, the prophet appearing at the gate; ripe purple grapes, cold shadow.

  9. Chariots of Fire
     Elijah and Elisha cross the Jordan, and a chariot of fire with horses of fire separates them as Elijah goes up in a whirlwind. Stage: the river at dawn, a flaming chariot in a vortex, the mantle falling to the younger prophet; fire reflected on the water, the storm of glory.
  -->
