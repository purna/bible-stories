<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Match It Up — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    :root{--ink:#3a2410;--card:#fffaf0;--good:#2e7d32;--bad:#c62828;--accent:#ffd84d;--bg:#fffaf0}
    html,body{width:100%;height:100%;overflow:hidden}
    body{font-family:'Comic Neue',Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{width:960px;max-width:94vw;height:540px;margin:0 auto;padding:16px;display:flex;flex-direction:column;overflow:hidden;transform:scale(var(--game-scale,1));transform-origin:center}
    h1{font-size:1.6rem;text-align:center;margin:4px 0}
    h1 svg{display:inline-block;width:32px;height:32px;vertical-align:-0.3rem}
    .sub{text-align:center;font-size:.9rem;opacity:.8;margin-bottom:12px}
    .layout{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
    .panel{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px;min-height:0;overflow:auto}
    .panel .heading{font-size:.85rem;font-weight:700;margin-bottom:8px;text-align:center;opacity:.75;text-transform:uppercase;letter-spacing:.04em}
    .slots{display:grid;gap:8px;grid-template-columns:1fr;justify-items:stretch;align-items:stretch}
    .slots.cols4{grid-template-columns:1fr}
    .slot{width:100%;padding:8px 10px;border:2px dashed #bbb;border-radius:10px;background:var(--card);display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;font-size:1.6rem;position:relative;min-height:96px}
    .slot .zone-icon{width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center}
    .slot .zone-icon svg{width:100%;height:100%}
    .slot .zone-label{font-size:.85rem;font-weight:800;color:var(--ink);opacity:.85;flex:none;min-width:60px}
    .slot .zone-items{font-size:1.4rem;line-height:1.2;flex:1;text-align:left;display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-start;align-content:center;overflow:hidden;min-height:1.2em}
    .slot .zone-items svg{width:26px;height:26px}
    .slot.correct{border-style:solid;border-color:var(--good);background:#e8f5e9}
    .count{position:absolute;top:4px;right:4px;min-width:26px;padding:2px 6px;border-radius:12px;background:#eadfca;border:2px solid var(--ink);font-size:.8rem;font-weight:800}
    .tray-items{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);justify-items:center}
    .tray-items.cols4{grid-template-columns:repeat(4,1fr)}
    .item{width:74px;height:74px;border-radius:12px;background:var(--accent);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;transition:transform .14s,filter .14s}
    .item svg{width:48px;height:48px}
    .item.picked,.item.claimed{opacity:.7;transform:scale(1.08);filter:brightness(1.08)}
    .item.placed{opacity:.22;pointer-events:none;filter:grayscale(.5)}
    .item.released,.slot.drop-pop{animation:releasePop .28s ease-out}
    .tray-sub{text-align:center;font-size:.7rem;font-weight:700;opacity:.55;margin-top:8px;letter-spacing:.04em;text-transform:uppercase}
    #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:1.2rem;font-weight:700;text-align:center;padding:24px}
    .btn{display:block;width:max-content;background:var(--good);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:12px 20px;font-size:1.1rem;cursor:pointer;margin:14px auto 0}
    @keyframes releasePop{50%{transform:scale(1.1)}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Match It Up
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <ellipse cx="9" cy="14" rx="3" ry="4" fill="#ccae81" stroke="#3a2410" stroke-width="1.5"/>
        <ellipse cx="23" cy="14" rx="3" ry="4" fill="#ccae81" stroke="#3a2410" stroke-width="1.5"/>
        <ellipse cx="16" cy="11" rx="3" ry="4" fill="#ccae81" stroke="#3a2410" stroke-width="1.5"/>
        <ellipse cx="16" cy="22" rx="6" ry="4" fill="#ccae81" stroke="#3a2410" stroke-width="1.5"/>
      </svg>
    </h1>
    <div class="sub" id="sub">Drag each animal to the place where it lives.</div>
    <div class="layout">
      <div class="panel">
        <div class="heading">Habitats</div>
        <div class="slots" id="slots"></div>
      </div>
      <div class="panel">
        <div class="heading">Drag here</div>
        <div class="tray-items" id="trayItems"></div>
        <div class="tray-sub">Tap or drag an animal to its home</div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="modal" role="dialog" aria-live="assertive">
    <div class="modal-card" id="modalCard">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-text" id="modalText"></div>
      <button type="button" class="modal-btn" id="modalBtn">Match again</button>
    </div>
  </div>
  <link rel="stylesheet" href="_shared/modal.css">
  <script src="_shared/timer.js"></script>
  <script>
    window.GAME_CONFIG = { timerSeconds: 90, timer: true };
    function fitGameToViewport(){document.documentElement.style.setProperty('--game-scale',Math.min(innerWidth/960,innerHeight/540));}
    addEventListener('resize',fitGameToViewport); fitGameToViewport();

    const items = [
      {kind:'sea',name:'fish',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 24c5-10 18-12 28-6l8-6v18l-8-2c-10 4-22 2-28-4Z" fill="#45a5df" stroke="#173b59" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="22" r="2.2" fill="#173b59"/></svg>'},
      {kind:'sea',name:'turtle',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="24" cy="30" rx="16" ry="10" fill="#4caf50" stroke="#1b5e20" stroke-width="3"/><path d="M24 18v20M14 20v18M34 20v18M8 28h32" stroke="#1b5e20" stroke-width="2.5"/><circle cx="24" cy="14" r="6" fill="#7CC36B" stroke="#1b5e20" stroke-width="3"/><circle cx="22" cy="13" r="1.2" fill="#1b5e20"/><circle cx="26" cy="13" r="1.2" fill="#1b5e20"/><path d="M6 36l-3 3M42 36l3 3" stroke="#1b5e20" stroke-width="3" stroke-linecap="round"/></svg>'},
      {kind:'sea',name:'dolphin',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 30c2-9 10-15 20-13 2-5 7-8 13-6 4 1 6 5 5 9 3 1 4 4 3 7s-4 4-7 4c0 3-3 6-7 6-2 3-6 4-10 3-9 0-15-3-17-10Z" fill="#5fb8e8" stroke="#173b59" stroke-width="3" stroke-linejoin="round"/><path d="M4 30l-3-4v8Z" fill="#5fb8e8" stroke="#173b59" stroke-width="3" stroke-linejoin="round"/><circle cx="28" cy="22" r="2" fill="#173b59"/><path d="M30 25c2 1 4 0 5-2" stroke="#173b59" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>'},
      {kind:'sea',name:'whale',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 30c4-6 12-10 20-8 3-7 11-9 18-4v10c-2 6-8 9-14 8-2 4-6 6-10 5-7-1-12-4-14-11Z" fill="#1a73e8" stroke="#0d2b5a" stroke-width="3" stroke-linejoin="round"/><circle cx="16" cy="26" r="2" fill="#0d2b5a"/><path d="M22 28c2 2 5 2 7 0" stroke="#0d2b5a" stroke-width="2.5" stroke-linecap="round"/></svg>'},
      {kind:'field',name:'ox',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 22c-2-4 0-9 4-10M34 22c2-4 0-9-4-10" stroke="#3a2410" stroke-width="3" stroke-linecap="round"/><rect x="10" y="20" width="28" height="18" rx="6" fill="#a67c52" stroke="#3a2410" stroke-width="3"/><circle cx="20" cy="28" r="2" fill="#3a2410"/><circle cx="28" cy="28" r="2" fill="#3a2410"/><path d="M20 34h8" stroke="#3a2410" stroke-width="3" stroke-linecap="round"/></svg>'},
      {kind:'field',name:'goat',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 6c-2 4-2 8 0 12M32 6c2 4 2 8 0 12" stroke="#3a2410" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M14 8c0-2 1-3 2-3M34 8c0-2-1-3-2-3" stroke="#3a2410" stroke-width="2.5" fill="none"/><ellipse cx="24" cy="26" rx="9" ry="9" fill="#e8d4ad" stroke="#3a2410" stroke-width="3"/><path d="M16 24h3M29 24h3" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="24" r="1.5" fill="#3a2410"/><circle cx="28" cy="24" r="1.5" fill="#3a2410"/><ellipse cx="24" cy="40" rx="14" ry="4" fill="#a67c52" stroke="#3a2410" stroke-width="3"/><path d="M18 35v8M30 35v8" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round"/></svg>'},
      {kind:'field',name:'rabbit',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 4v18M30 4v18" stroke="#3a2410" stroke-width="3" stroke-linejoin="round" fill="#d8c39e"/><ellipse cx="18" cy="12" rx="3" ry="8" fill="#d8c39e" stroke="#3a2410" stroke-width="3"/><ellipse cx="30" cy="12" rx="3" ry="8" fill="#d8c39e" stroke="#3a2410" stroke-width="3"/><path d="M18 6c0-1 1-2 2-2M30 6c0-1-1-2-2-2" stroke="#a67c52" stroke-width="2" fill="#e8d4ad"/><ellipse cx="24" cy="30" rx="13" ry="10" fill="#d8c39e" stroke="#3a2410" stroke-width="3"/><circle cx="20" cy="28" r="1.8" fill="#3a2410"/><circle cx="28" cy="28" r="1.8" fill="#3a2410"/><ellipse cx="24" cy="33" rx="2" ry="1.4" fill="#a67c52" stroke="#3a2410" stroke-width="2"/><path d="M24 31v3" stroke="#3a2410" stroke-width="2" stroke-linecap="round"/></svg>'},
      {kind:'field',name:'sheep',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="14" cy="18" r="5" fill="#fff" stroke="#3a2410" stroke-width="2.5"/><circle cx="22" cy="13" r="5" fill="#fff" stroke="#3a2410" stroke-width="2.5"/><circle cx="30" cy="11" r="5" fill="#fff" stroke="#3a2410" stroke-width="2.5"/><circle cx="37" cy="16" r="5" fill="#fff" stroke="#3a2410" stroke-width="2.5"/><circle cx="16" cy="26" r="5" fill="#fff" stroke="#3a2410" stroke-width="2.5"/><circle cx="26" cy="24" r="5" fill="#fff" stroke="#3a2410" stroke-width="2.5"/><circle cx="35" cy="25" r="5" fill="#fff" stroke="#3a2410" stroke-width="2.5"/><ellipse cx="25" cy="36" rx="11" ry="6" fill="#3a2410"/><circle cx="22" cy="36" r="1.4" fill="#fff"/><circle cx="28" cy="36" r="1.4" fill="#fff"/><path d="M23 38h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>'},
      {kind:'sky',name:'bird',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 28c8-10 18-12 28-8 3-5 8-6 12-3-5 1-8 4-9 9-9 7-22 7-31 2Z" fill="#9b6b43" stroke="#3a2410" stroke-width="3" stroke-linejoin="round"/><circle cx="36" cy="20" r="1.8" fill="#3a2410"/><path d="M14 28l-2 4M22 30l-1 4" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round"/></svg>'},
      {kind:'sky',name:'dove',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="22" cy="22" r="7" fill="#fff" stroke="#3a2410" stroke-width="3"/><path d="M29 22c3-4 9-5 14-2-2 1-3 3-3 6-4 0-9-1-11-4Z" fill="#fff" stroke="#3a2410" stroke-width="3" stroke-linejoin="round"/><path d="M22 22c-3-3-8-3-11 0 2 1 4 3 4 6 3 0 6-2 7-5Z" fill="#fff" stroke="#3a2410" stroke-width="3" stroke-linejoin="round"/><path d="M18 20c-1-1-1-2 0-3" stroke="#e8a200" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="22" cy="22" r="1.5" fill="#3a2410"/><path d="M20 28v8M24 28v8" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round"/></svg>'},
      {kind:'sky',name:'eagle',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 20c8-3 16-2 22 1 1-3 4-6 7-6 4 0 6 2 7 5 5 0 8 3 8 7s-3 7-8 7c-1 4-5 7-10 7-4 0-7-2-9-5-7 0-13-3-17-9Z" fill="#8B4513" stroke="#3a2410" stroke-width="3" stroke-linejoin="round"/><path d="M22 22c1-3 4-5 8-4" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="24" cy="20" r="1.8" fill="#3a2410"/><path d="M22 22c-1 1-1 2 0 3" stroke="#e8a200" stroke-width="2" fill="none"/><path d="M2 20l-1-3M46 20l1-3" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round"/></svg>'},
      {kind:'sky',name:'bat',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 16c-3 0-5 2-6 5-2-1-5-1-6 1l2 4c0 3 2 5 5 6 1 2 3 3 5 3s4-1 5-3c3-1 5-3 5-6l2-4c-1-2-4-2-6-1-1-3-3-5-6-5Z" fill="#3a2410" stroke="#1a1009" stroke-width="2.5" stroke-linejoin="round"/><path d="M9 19l-7 5 6-1 4 1-3-5M39 19l7 5-6-1-4 1 3-5" fill="#3a2410" stroke="#1a1009" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 18c1 0 2 1 2 2M34 18c-1 0-2 1-2 2" stroke="#1a1009" stroke-width="2.5" fill="none"/><circle cx="21" cy="19" r="1.5" fill="#fff"/><circle cx="27" cy="19" r="1.5" fill="#fff"/><path d="M22 23l2 3 2-3" fill="#c62828" stroke="#1a1009" stroke-width="1.5" stroke-linejoin="round"/></svg>'},
    ];

    const habitats = [
      {zone:'sea',label:'Water',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 30c5-5 11-7 17-7s11 2 13 5l8-2v8l-7-2c-2 4-7 6-14 6-7 0-13-3-17-8Z" fill="#45a5df" stroke="#173b59" stroke-width="3" stroke-linejoin="round"/><path d="M4 40c5-3 11-5 17-5s11 2 16 5" stroke="#173b59" stroke-width="3" stroke-linecap="round" fill="none"/></svg>'},
      {zone:'field',label:'Field',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 38c4-12 11-18 18-18s14 6 18 18" fill="#5b8c2f" stroke="#2f4d18" stroke-width="3" stroke-linejoin="round"/><path d="M24 38V20" stroke="#2f4d18" stroke-width="3" stroke-linecap="round"/><path d="M24 24c-3-1-5-3-5-6M24 28c3-1 5-3 5-6M24 32c-3-1-5-3-5-6" stroke="#2f4d18" stroke-width="2.5" stroke-linecap="round"/></svg>'},
      {zone:'sky',label:'Sky',svg:'<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 22c2-4 6-6 10-5 1-5 6-8 11-7 4 1 6 4 7 8 5 0 9 4 9 9s-4 9-9 9H12c-4 0-8-4-8-8 0-3 1-5 2-6Z" fill="#fff" stroke="#5b6f8a" stroke-width="3" stroke-linejoin="round"/><circle cx="34" cy="14" r="5" fill="#ffd84d" stroke="#a08000" stroke-width="2.5"/></svg>'},
    ];

    let counts = {};
    let placedNames = new Set();
    let matched = 0;
    let sortables = [];

    const slotsEl = document.getElementById('slots');
    const trayEl = document.getElementById('trayItems');
    const msg = document.getElementById('msg');

    function shuffle(a){ return a.sort(() => Math.random()-.5); }

    function build(){
      const useHabitats = shuffle([].concat(habitats));
      const gridCols = useHabitats.length === 4 ? 'cols4' : '';

      // build slots
      slotsEl.innerHTML='';
      slotsEl.className='slots '+(gridCols);
      useHabitats.forEach(h=>{
        counts[h.zone]=0;
        const need = items.filter(i=>i.kind===h.zone).length;
        const s=document.createElement('div');
        s.className='slot';
        s.dataset.zone=h.zone;
        s.innerHTML=`<div class="count">0/${need}</div><div class="zone-icon">${h.svg}</div><div class="zone-label">${h.label}</div><div class="zone-items"></div>`;
        slotsEl.appendChild(s);
      });

      // build tray
      const trayItems = shuffle([].concat(items));
      trayEl.innerHTML='';
      trayEl.className='tray-items '+(items.length===16?'cols4':'');
      trayItems.forEach((it,i)=>{
        const el=document.createElement('div');
        el.className='item';
        el.dataset.kind=it.kind;
        el.dataset.name=it.name;
        el.setAttribute('aria-label', it.name);
        el.innerHTML=it.svg;
        el.style.opacity='0';
        setTimeout(()=>{ el.style.opacity='1'; }, i*40);
        trayEl.appendChild(el);
      });

      // destroy existing sortables
      sortables.forEach(s=>s.destroy && s.destroy());
      sortables=[];

      // Sortable for tray (clone)
      const traySort = new Sortable(trayEl, {
        group:{ name:'match', pull:'clone', put:false },
        draggable:'.item',
        sort:false,
        animation:150,
        ghostClass:'sortable-ghost',
        chosenClass:'sortable-chosen',
        forceFallback:true,
        fallbackOnBody:true,
        fallbackTolerance:3
      });
      sortables.push(traySort);

      // Sortable for each slot
      document.querySelectorAll('.slot').forEach(slot=>{
        const zoneSort = new Sortable(slot, {
          group:'match',
          draggable:'.tray-items .item',
          sort:false,
          animation:150,
          ghostClass:'sortable-ghost',
          forceFallback:true,
          fallbackOnBody:true,
          fallbackTolerance:3,
          onAdd: function(evt){
            const clone=evt.item;
            handleDrop(clone, slot);
          },
          onChoose: function(evt){ evt.item.classList.add('claimed'); },
          onUnchoose: function(evt){ evt.item.classList.remove('claimed'); }
        });
        sortables.push(zoneSort);
      });
    }

    function handleDrop(clone, slot){
      const kind=clone.dataset.kind;
      const name=clone.dataset.name;
      const max = items.filter(i=>i.kind===slot.dataset.zone).length;
      if(placedNames.has(name)||counts[slot.dataset.zone]>=max){
        clone.remove();
        return;
      }
      if(kind !== slot.dataset.zone){
        slot.style.outline='3px solid var(--bad)';
        setTimeout(()=>slot.style.outline='',600);
        clone.remove();
        return;
      }
      placedNames.add(name);
      counts[slot.dataset.zone]++;
      slot.querySelector('.count').textContent=`${counts[slot.dataset.zone]}/${max}`;
      const itemsBox = slot.querySelector('.zone-items');
      const itemDef = items.find(i=>i.name===name);
      if(itemDef) itemsBox.insertAdjacentHTML('beforeend', itemDef.svg);
      if(counts[slot.dataset.zone]===max) slot.classList.add('correct');
      const source=trayEl.querySelector(`.item[data-name="${name}"]`);
      if(source) source.classList.add('placed');
      slot.classList.remove('drop-pop'); void slot.offsetWidth; slot.classList.add('drop-pop');
      matched++;
      if(matched>=items.length){
        setTimeout(finish,200);
      }
      clone.remove();
    }

    function addPressEffects(){
      document.addEventListener('pointerdown',e=>{
        const el=e.target.closest('.item,.btn');
        if(el){ if(el.classList.contains('item')) el.classList.add('picked'); }
      });
      document.addEventListener('pointerup',e=>{
        const el=e.target.closest('.item,.btn');
        if(el){
          el.classList.remove('picked');
          el.classList.remove('released');
          void el.offsetWidth;
          el.classList.add('released');
        }
      });
    }

    const modal=document.getElementById('modal'),modalCard=document.getElementById('modalCard'),modalIcon=document.getElementById('modalIcon'),modalTitle=document.getElementById('modalTitle'),modalText=document.getElementById('modalText'),modalBtn=document.getElementById('modalBtn');
    const CHECK_SVG='<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 16.5l5.5 5.5L24 11" stroke="#1b5e20" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const HOURGLASS_SVG='<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 4h14l-1 3c-1 3-4 5-6 7 2 2 5 4 6 7l1 3H9l1-3c1-3 4-5 6-7-2-2-5-4-6-7Z" fill="#fff" stroke="#1b5e20" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 4v24" stroke="#1b5e20" stroke-width="2" stroke-dasharray="2 2"/></svg>';

    function showModal(kind,title,lines,btnLabel){
      modalCard.classList.remove('success','timeout');
      if(kind==='success') modalCard.classList.add('success');
      if(kind==='timeout') modalCard.classList.add('timeout');
      modalIcon.innerHTML = kind==='success' ? CHECK_SVG : HOURGLASS_SVG;
      modalTitle.textContent = title;
      modalText.innerHTML = lines.map(l => /[“”"]/.test(l) ? `<div class="modal-verse">${l}</div>` : `<div>${l}</div>`).join('');
      modalBtn.textContent = btnLabel || 'Match again';
      modal.classList.add('active');
      modalBtn.onclick = () => location.reload();
    }

    function finish(success){
      sortables.forEach(s=>s.destroy && s.destroy());
      if (success === undefined || success === true) {
        showModal('success','All matched!',['"I praise you, for I am fearfully and wonderfully made." — Psalm 139:14'],'Match again');
        window.dispatchEvent(new CustomEvent('game-complete'));
        if (window.parent !== window) window.parent.postMessage({type:'game-complete', game:'match_it_up'}, '*');
      } else {
        showModal('timeout','Time’s up!',['"Be still before the Lord and wait patiently." — Psalm 37:7'],'Try again');
        window.dispatchEvent(new CustomEvent('game-over'));
      }
    }
    addEventListener('game-timeout',()=>{if(modal.classList.contains('active'))return;finish(false);});

    addPressEffects();
    build();
  </script>
</body>
</html>
