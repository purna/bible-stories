<head>
    <meta charset="utf-8">

    <title>Shot Designer — Jeremiah</title>
<!--
  SCENE DIRECTOR NOTES — Jeremiah (Jeremiah 1–39, 31–32)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Call
     The Lord touches the prophet's mouth and says: I have put my words in your mouth, to pluck up and to break down, to build and to plant. Stage: a young man at a village gate at dawn, a hand of light at his mouth, a branch of an almond tree nearby; a thin morning, a heavy commission.

  2. The Almond Branch
     The Lord shows a rod of an almond — the first to wake — to show that He watches over His word to perform it. Stage: a branch with pink blossoms in winter light, a hand holding it out, the prophet's eyes; the first blossom of the year against a cold sky.

  3. At the Temple Gate
     The Lord tells Jeremiah to stand at the temple gate and cry: trust not in the temple itself; do justice, hear the widow's plea. Stage: a temple gate at midday, a lone voice in a busy court, the poor and the blind at the steps; the stone of the temple and the people at its feet.

  4. The Scroll
     Baruch writes Jeremiah's words on a scroll; the king cuts it with a knife and burns it, column by column, and it is written again. Stage: a chamber by the fire, a scribe's reed and ink, a scroll being read aloud, a king's knife shearing it, the fire rising; the book being born again.

  5. The Potter
     The Lord sets the prophet by the potter's house: as clay in the potter's hand, so are you; the vessel is marred and remade. Stage: a potter's wheel turning in a courtyard, wet clay on the wheel, a vessel failing and returning to a lump; earthy colours, patient hands.

  6. The Yoke
     The Lord tells Jeremiah to make a yoke of leather and wood and wear it; Hananiah breaks the yoke and the prophet says the Lord will make yokes of iron. Stage: a market square at noon, a wooden yoke on a prophet's shoulders, a false prophet snapping it, an iron yoke in the shadow; a hot day, a cold word.

  7. The Cistern
     The officials cast Jeremiah into the cistern of Malchiah, in the court of the guard, and Ebed-melech the Cushite lifts him out with rags and ropes. Stage: a dark cistern with mud and water at the bottom, ropes and old clothes lowered from above; a rescuer's hand in the dark; the king's court in the light above.

  8. Buy the Field
     In the besieged city Jeremiah buys a field at Anathoth and seals the deed, for the Lord promises houses and fields will again be bought. Stage: a walled city under siege at dusk, a deed being sealed and buried in an earthen jar, a field beyond the walls; a candle in a siege lamp.

  9. The Fall of Jerusalem
     The city falls after a long siege; the king's sons are slain, the temple is burned, and the people are taken into exile. Stage: smoke over the city, a wall breached, a king fleeing by night, a fire on the temple hill; the last light of a long night.

  10. Lament and Hope
     The Lord promises a new covenant written on the heart, and a voice in Ramah is comforted: your work shall be rewarded. Stage: a woman weeping by a tent at dawn, the prophet pointing to a returning exodus, a green shoot in a ruined field; the first light of consolation.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
