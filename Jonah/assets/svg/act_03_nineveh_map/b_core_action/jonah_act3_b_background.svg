<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Jonah act 3 Into the Deep background"><metadata>{&quot;story&quot;:&quot;Jonah&quot;,&quot;act&quot;:3,&quot;chapter&quot;:&quot;Into the Deep&quot;,&quot;scene&quot;:&quot;B&quot;,&quot;layer&quot;:&quot;background&quot;,&quot;artDirection&quot;:&quot;The word of the Lord comes a second time: arise, go to Nineveh, the great city. Stage: a shoreline at dawn, a man walking out of the sea, a long road to the east; dry land, a new commission, the city a speck on the horizon. Jonah enters Nineveh a day&amp;#x27;s journey and cries: yet forty days, and Nineveh shall be overthrown. Stage: a vast city of walls and gardens at noon, a lone foreign voice echoing at the gate; a crowd gathering, a king on a distant throne; a single sentence over a whole empire. The people believe, from the greatest to the least, and the king rises from his throne and sits in ashes. Stage: a city covered in sackcloth, a throne turned to ashes, beasts and people fasting, a king in mourning; the whole city holding its breath.&quot;,&quot;materials&quot;:[&quot;assets/materials/water_fast-churn.svg&quot;,&quot;assets/materials/water_still-eddies.svg&quot;,&quot;assets/materials/desert_sand-dunes.svg&quot;,&quot;assets/materials/leaves-canopy.svg&quot;,&quot;assets/materials/fabric_weave-basket.svg&quot;],&quot;seed&quot;:1}</metadata><defs><linearGradient id="stageSky" x2="0" y2="1"><stop stop-color="#15263b"/><stop offset="1" stop-color="#477b91"/></linearGradient><radialGradient id="stageGlow"><stop stop-color="#e6be72" stop-opacity=".24"/><stop offset="1" stop-color="#e6be72" stop-opacity="0"/></radialGradient><pattern id="act-material" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M-8 16 Q10 7 28 16 T64 16 M-8 40 Q10 31 28 40 T64 40 M-8 64 Q10 55 28 64 T64 64" fill="none" stroke="#ded9b2" stroke-width="2" opacity=".55"/></pattern></defs><rect width="1920" height="1080" fill="url(#stageSky)"/><