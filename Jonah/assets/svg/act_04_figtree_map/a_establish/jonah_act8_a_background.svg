<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Jonah act 8 The Plant background"><metadata>{&quot;story&quot;:&quot;Jonah&quot;,&quot;act&quot;:8,&quot;chapter&quot;:&quot;The Plant&quot;,&quot;scene&quot;:&quot;A&quot;,&quot;layer&quot;:&quot;background&quot;,&quot;artDirection&quot;:&quot;God makes a plant to shade Jonah, and Jonah is glad; then a worm attacks it, and the sun beats on his head. Stage: a booth on a hill above the city, a gourd growing in a single night, a man sheltering, a worm in the morning; a hot day, a lost shade. God asks Jonah: should not I have compassion on Nineveh, that great city with more than a hundred and twenty thousand? Stage: the booth at evening, a man and a question, a city in the distance full of lamps; the last light of the day over a city that did not know its right hand from its left.&quot;,&quot;materials&quot;:[&quot;assets/materials/desert_sand-dunes.svg&quot;,&quot;assets/materials/leaves-canopy.svg&quot;],&quot;seed&quot;:1}</metadata><defs><linearGradient id="stageSky" x2="0" y2="1"><stop stop-color="#d8ae64"/><stop offset="1" stop-color="#f0d18a"/></linearGradient><radialGradient id="stageGlow"><stop stop-color="#edc46e" stop-opacity=".24"/><stop offset="1" stop-color="#edc46e" stop-opacity="0"/></radialGradient><pattern id="act-material" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M-5 20Q15 13 35 20T75 20M-5 50Q15 43 35 50T75 50" fill="none" stroke="#efc97e" stroke-width="2" opacity=".45"/><circle cx="16" cy="35" r="1.4" fill="#edc46e"/><circle cx="55" cy="8" r="1.2" fill="#edc46e"/></pattern></defs><rect width="1920" height="1080" fill="url(#stageSky)"/><circle cx="1510" cy="245" r="72" fill="#edc46e" opacity=".48"/><path d="M0 690 L124.80000000000001 494.35926679568365 L240 691.3080709089991 L364.8 407.93281430890784 L480 713.9464405504987 L604.8 371.8761622910388 L720 720.8263652934693 L844.8 508.81410239310935 L960 714.435327288229 L1084.8 345.96571800112724