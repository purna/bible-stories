<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Jonah act 9 The Question background"><metadata>{&quot;story&quot;:&quot;Jonah&quot;,&quot;act&quot;:9,&quot;chapter&quot;:&quot;The Question&quot;,&quot;scene&quot;:&quot;A&quot;,&quot;layer&quot;:&quot;background&quot;,&quot;artDirection&quot;:&quot;God makes a plant to shade Jonah, and Jonah is glad; then a worm attacks it, and the sun beats on his head. Stage: a booth on a hill above the city, a gourd growing in a single night, a man sheltering, a worm in the morning; a hot day, a lost shade. God asks Jonah: should not I have compassion on Nineveh, that great city with more than a hundred and twenty thousand? Stage: the booth at evening, a man and a question, a city in the distance full of lamps; the last light of the day over a city that did not know its right hand from its left.&quot;,&quot;materials&quot;:[&quot;assets/materials/desert_sand-dunes.svg&quot;,&quot;assets/materials/leaves-canopy.svg&quot;],&quot;seed&quot;:1}</metadata><defs><linearGradient id="stageSky" x2="0" y2="1"><stop stop-color="#392e38"/><stop offset="1" stop-color="#d58f55"/></linearGradient><radialGradient id="stageGlow"><stop stop-color="#edb969" stop-opacity=".24"/><stop offset="1" stop-color="#edb969" stop-opacity="0"/></radialGradient><pattern id="act-material" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M-5 20Q15 13 35 20T75 20M-5 50Q15 43 35 50T75 50" fill="none" stroke="#efc37b" stroke-width="2" opacity=".45"/><circle cx="16" cy="35" r="1.4" fill="#edb969"/><circle cx="55" cy="8" r="1.2" fill="#edb969"/></pattern></defs><rect width="1920" height="1080" fill="url(#stageSky)"/><circle cx="1510" cy="245" r="72" fill="#edb969" opacity=".48"/><path d="M0 690 L124.80000000000001 447.73288226500154 L240 719.6069315529894 L364.8 579.4959215987474 L480 724.9070151301567 L604.8 335.2396526634693 L720 706.1193953861948 L844.8 454.68362993141636 L960 699.889707590919 L1084.8 334.431239665