<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Jonah act 8 The Plant background"><metadata>{&quot;story&quot;:&quot;Jonah&quot;,&quot;act&quot;:8,&quot;chapter&quot;:&quot;The Plant&quot;,&quot;scene&quot;:&quot;B&quot;,&quot;layer&quot;:&quot;background&quot;,&quot;artDirection&quot;:&quot;God makes a plant to shade Jonah, and Jonah is glad; then a worm attacks it, and the sun beats on his head. Stage: a booth on a hill above the city, a gourd growing in a single night, a man sheltering, a worm in the morning; a hot day, a lost shade. God asks Jonah: should not I have compassion on Nineveh, that great city with more than a hundred and twenty thousand? Stage: the booth at evening, a man and a question, a city in the distance full of lamps; the last light of the day over a city that did not know its right hand from its left.&quot;,&quot;materials&quot;:[&quot;assets/materials/desert_sand-dunes.svg&quot;,&quot;assets/materials/leaves-canopy.svg&quot;],&quot;seed&quot;:1}</metadata><defs><linearGradient id="stageSky" x2="0" y2="1"><stop stop-color="#d8ae64"/><stop offset="1" stop-color="#f0d18a"/></linearGradient><radialGradient id="stageGlow"><stop stop-color="#edc46e" stop-opacity=".24"/><stop offset="1" stop-color="#edc46e" stop-opacity="0"/></radialGradient><pattern id="act-material" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M-5 20Q15 13 35 20T75 20M-5 50Q15 43 35 50T75 50" fill="none" stroke="#efc97e" stroke-width="2" opacity=".45"/><circle cx="16" cy="35" r="1.4" fill="#edc46e"/><circle cx="55" cy="8" r="1.2" fill="#edc46e"/></pattern></defs><rect width="1920" height="1080" fill="url(#stageSky)"/><circle cx="1510" cy="245" r="72" fill="#edc46e" opacity=".48"/><path d="M0 690 L124.80000000000001 324.7138698846102 L240 723.9018239534926 L364.8 505.52137822424993 L480 724.5936729258392 L604.8 509.8350341669284 L720 692.4704895087052 L844.8 402.4318914329633 L960 718.3542244648561 L1084.8 451.7025936841965 L