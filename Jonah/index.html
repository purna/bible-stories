<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Book of Jonah — An interactive single-panel comic book experience. Read offline with our PWA service worker!">
    <meta name="theme-color" content="#e94560">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>The Adventures of Jonah — Enhanced Single Panel Comic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&family=Bangers&family=Space+Mono:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="styles/jonah-story_10.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
  <div id="startScreen">
    <div class="comic-cover">
      <div class="issue">SPECIAL EDITION #1</div>
      <h1>JONAH!</h1>
      <div class="subtitle">&amp; the Ominous Depths</div>
      <div class="bigfish">🐋</div>
      <p>An interactive single-panel comic book experience! Interact using actions, arrows, or touch swipes.</p>
      <button id="startBtn">LAUNCH COMIC</button>
    </div>
  </div>

  <div id="app">
    <div id="bgGradient"></div>
    <canvas id="particles"></canvas>
    <div id="stormLayer">
      <div id="stormStars"></div>
      <div class="wave-container">
        <div class="air air1"></div>
        <div class="air air2"></div>
        <div class="air air3"></div>
        <div class="air air4"></div>
      </div>
    </div>
    <div id="ambientLayer">
      <div class="dune-container">
        <div class="dune dune1"></div>
        <div class="dune dune2"></div>
      </div>
      <div class="firefly-container">
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
      </div>
    </div>
    <div id="halftoneOverlay"></div>

    <div id="hud">
      <select id="chapterSelect"></select>
      <div id="dots"></div>
    </div>

    <div id="stageWrap">
      <div id="stage"></div>
    </div>

    <div id="choices"></div>
    <div id="delayNote"></div>

    <div id="navHints">
      <span><span class="arrowL">◀</span> Use Left/Right Arrow keys or drag horizontally <span
          class="arrowR">▶</span></span>
      <span>· ↓ Scroll down at line end to drop into next act ·</span>
    </div>
    <button id="nextBtn">Next Chapter ↴</button>
    <button id="nextLineBtn">Next →</button>
  </div>

  <div id="portal"></div>

  <script src="jonah-story.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js');
      });
    }
  </script>
</body>

</html>
