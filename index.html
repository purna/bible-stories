<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Stories Comics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&family=Bangers&family=Space+Mono:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: radial-gradient(circle, #5a5a5a, #1a1a1a);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* Hide scrollbars from gradient */
        }

        .comic-cover {
            background: #fff;
            color: #000;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 6px 6px rgba(0, 0, 0, 0.23);
            text-align: center;
            border: 4px solid #000;
            max-width: 500px;
            margin: 3em;
            transform: rotate(-2deg);
            transition: transform 0.3s ease-in-out;
        }

        .comic-cover:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .comic-cover h1 {
            font-family: 'Bangers', cursive;
            font-size: 5.5rem;
            color: #ffdd00;
            /* Vibrant Yellow */
            margin: 0;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #d9534f;
            animation: title-throb 3s ease-in-out infinite;
        }

        .comic-cover .subtitle {
            font-family: 'Baloo 2', cursive;
            font-size: 1.5rem;
            font-weight: 800;
            color: #222;
            margin-top: -1rem;
            margin-bottom: 1rem;
        }

        .comic-list {
            list-style-type: none;
            padding: 0;
            margin: 2rem 0;
        }

        .comic-list li {
            margin: 1rem 0;
        }

        .comic-list a {
            display: block;
            background-color: #f0ad4e;
            /* Orange */
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
        }

        .comic-list a:hover {
            background-color: #ec971f;
            transform: translateY(-4px) translateX(-4px);
            box-shadow: 8px 8px 0px #000;
        }

        @keyframes title-throb {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="comic-cover">
        <h1>Bible Stories!</h1>
        <div class="subtitle">An Interactive Comic Book Experience</div>
        <ul class="comic-list">
            <li><a href="./Daniel/">The Book of Daniel</a></li>
            <li><a href="./Eiljah/">The Book of Elijah</a></li>
            <li><a href="./Jonah/">The Book of Jonah</a></li>
            <li><a href="./Noah/">The Book of Noah</a></li>
        </ul>
    </div>
</body>

</html>
