<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Garden Warning — divine command -->
  <rect width="300" height="200" fill="#2b1d0c"/>
  <!-- Ground -->
  <rect x="0" y="150" width="300" height="50" fill="#6b3a18" stroke="#0A0812" stroke-width="2"/>
  <!-- Tree of Knowledge (left) — red fruit -->
  <rect x="40" y="80" width="20" height="75" fill="#5c4033" stroke="#0A0812" stroke-width="2"/>
  <circle cx="50" cy="70" r="28" fill="#4a7a3a" stroke="#0A0812" stroke-width="2.5"/>
  <circle cx="38" cy="65" r="5" fill="#FF6B5B"/>
  <circle cx="58" cy="68" r="5" fill="#FF6B5B"/>
  <circle cx="48" cy="85" r="5" fill="#FF6B5B"/>
  <!-- Tree of Life (right) — golden fruit -->
  <rect x="240" y="80" width="20" height="75" fill="#5c4033" stroke="#0A0812" stroke-width="2"/>
  <circle cx="250" cy="70" r="28" fill="#5a7a3a" stroke="#0A0812" stroke-width="2.5"/>
  <circle cx="238" cy="65" r="5" fill="#FFD84D"/>
  <circle cx="262" cy="68" r="5" fill="#FFD84D"/>
  <circle cx="250" cy="85" r="5" fill="#FFD84D"/>
  <!-- Divine light between trees -->
  <ellipse cx="150" cy="40" rx="35" ry="25" fill="#FFD84D" opacity=".5"/>
  <!-- Light pillars -->
  <rect x="148" y="40" width="4" height="110" fill="#FFD84D" opacity=".1"/>
   <!-- Adam and Eve approaching -->
  <rect x="140" y="125" width="20" height="30" fill="#5c4033" stroke="#0A0812" stroke-width="1.5" rx="3"/>
  <circle cx="150" cy="118" r="7" fill="#C8956C" stroke="#0A0812" stroke-width="1"/>
</svg>
