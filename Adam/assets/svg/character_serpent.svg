<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Serpent: coiled, stylized, glowing eyes -->
  <defs>
    <radialGradient id="serpentEye" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF6B5B"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
  </defs>
  <!-- Coil --><!-- movement: sinuous curves -->
  <!-- Body segments --><!-- rhythm: repeating ovals along curve -->
  <ellipse cx="64" cy="42" rx="22" ry="10" fill="#6b3a18" stroke="#0A0812" stroke-width="2" transform="rotate(-15 64 42)"/>
  <path d="M50 52 Q58 50 66 52 Q74 54 82 50" fill="none" stroke="#6b3a18" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M82 50 Q90 48 98 52 Q102 56 106 50" fill="none" stroke="#6b3a18" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head --><!-- emphasis: forward, watchful -->
  <ellipse cx="108" cy="50" rx="12" ry="8" fill="#6b3a18" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Tongue --><!-- movement: flicking, danger -->
  <path d="M108 46 Q114 42 118 46 Q114 50 108 54" fill="none" stroke="#FF6B5B" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes --><!-- emphasis: glowing, hypnotic -->
  <ellipse cx="104" cy="46" rx="5" ry="7" fill="url(#serpentEye)" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="112" cy="46" rx="5" ry="7" fill="url(#serpentEye)" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Pupils --><!-- variety: pinpoint stare -->
  <circle cx="104" cy="46" r="2" fill="#0A0812"/>
  <circle cx="112" cy="46" r="2" fill="#0A0812"/>
  <!-- Tongue detail --><!-- danger, temptation -->
  <path d="M118 46 Q116 48 114 46" fill="none" stroke="#8B0000" stroke-width="2" stroke-linecap="round"/>
  <!-- Scales --><!-- pattern: texture along body -->
  <path d="M64 52 Q70 53 76 52" fill="none" stroke="#4a2a04" stroke-width="1" opacity=".6"/>
  <path d="M76 50 Q82 51 88 49" fill="none" stroke="#4a2a04" stroke-width="1" opacity=".6"/>
  <!-- Tail curl --><!-- movement: coiling -->
  <path d="M42 38 Q34 34 30 42 Q34 50 42 48" fill="none" stroke="#6b3a18" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Forked tongue accent --><!-- variety: organic -->
  <path d="M120 46 Q124 44 126 48" fill="none" stroke="#FF6B5B" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>
