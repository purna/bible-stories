<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Eve: gentle, flowing hair, simple dress, calm -->
  <!-- Face --><!-- soft, gentle --><!-- hierarchy: central, lighter palette -->
  <circle cx="60" cy="26" r="16" fill="#dcb088" stroke="#0A0812" stroke-width="3"/>
  <!-- Eyes --><!-- closed/sensitive, almond --><!-- variety: soft curve -->
  <circle cx="53" cy="24" r="2.2" fill="#0A0812"/>
  <circle cx="67" cy="24" r="2.2" fill="#0A0812"/>
  <path d="M53 24 Q56 22 59 24" fill="none" stroke="#0A0812" stroke-width="1"/>
  <path d="M61 24 Q64 22 67 24" fill="none" stroke="#0A0812" stroke-width="1"/>
  <!-- Mouth --><!-- gentle, hopeful --><!-- variety: soft smile -->
  <path d="M54 34 Q60 37 66 34" fill="none" stroke="#0A0812" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hair --><!-- long, flowing, dark brown --><!-- emphasis: flowing detail -->
  <path d="M42 24 Q36 40 40 58 Q44 62 60 62 Q76 62 80 58 Q84 40 78 24 Q70 16 60 16 Q50 16 42 24 Z"
        fill="#1a1410" stroke="#0A0812" stroke-width="1"/>
