  <path d="M48 38 Q52 34 56 38" fill="none" stroke="#1a1410" stroke-width="1.5" opacity=".3"/>
  <path d="M72 38 Q68 34 64 38" fill="none" stroke="#1a1410" stroke-width="1.5" opacity=".3"/>
  <!-- Dress --><!-- simple, flowing --><!-- hierarchy: body mass, soft color -->
  <path d="M40 40 Q37 68 60 116 Q83 68 80 40 Z" fill="#8a7a5a" stroke="#0A0812" stroke-width="3" rx="7"/>
  <!-- Dress trim --><!-- variety: decorative band -->
  <line x1="46" y1="52" x2="74" y2="52" stroke="#a9784e" stroke-width="2" opacity=".5"/>
  <line x1="46" y1="62" x2="74" y2="62" stroke="#a9784e" stroke-width="2" opacity=".4"/>
  <!-- Arms at sides --><!-- balance: symmetry -->
  <path d="M40 44 Q28 58 32 74" fill="none" stroke="#8a7a5a" stroke-width="6" stroke-linecap="round"/>
  <path d="M80 44 Q92 58 88 74" fill="none" stroke="#8a7a5a" stroke-width="6" stroke-linecap="round"/>
</svg>
