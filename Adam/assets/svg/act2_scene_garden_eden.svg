<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" data-parallax="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="treeGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7a3a"/>
      <stop offset="100%" stop-color="#3a5a3a"/>
    </linearGradient>
    <radialGradient id="treeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Garden bg — warm, golden, static -->
  <rect width="300" height="200" fill="#2b1d0c" data-depth="0"/>
  <!-- River — movement, rhythm, midground -->
  <path d="M150 30 Q140 50 145 80 Q150 110 140 140 Q130 160 145 175" fill="#4ECDC4" opacity=".6" stroke="#4ECDC4" stroke-width="3" stroke-linecap="round" data-depth="0.4"/>
  <path d="M155 32 Q162 52 158 82 Q152 112 162 142 Q170 162 155 175" fill="#4ECDC4" opacity=".5" stroke="#4ECDC4" stroke-width="2.5" stroke-linecap="round" data-depth="0.4"/>
  <!-- Trees — rhythm, repetition, framing, midground -->
  <!-- Left tree -->
  <rect x="20"  y="80"  width="24" height="80" fill="#5c4033" stroke="#0A0812" stroke-width="2" data-depth="0.5"/>
  <circle cx="32" cy="70" r="30" fill="url(#treeGreen)" stroke="#0A0812" stroke-width="2" data-depth="0.5"/>
  <!-- Right tree -->
  <rect x="256" y="90" width="24" height="70" fill="#5c4033" stroke="#0A0812" stroke-width="2" data-depth="0.5"/>
  <circle cx="268" cy="80" r="28" fill="url(#treeGreen)" stroke="#0A0812" stroke-width="2" data-depth="0.5"/>
  <!-- Center trees — emphasis: Tree of Life (right), Tree of Knowledge (left) -->
  <!-- Tree of Life — organic branching form, tapered trunk + bezier limbs + leaf clusters -->
  <g data-depth="0.55">
    <!-- divine glow behind the canopy -->
    <circle cx="188" cy="85" r="55" fill="url(#treeGlow)"/>
    <!-- tapered trunk -->
    <path d="M180 160 L184 118 L194 118 L198 160 Z" fill="#5c4033" stroke="#0A0812" stroke-width="2" stroke-linejoin="round"/>
    <!-- main limbs -->
    <path d="M186 122 C176 108 160 98 148 82" fill="none" stroke="#5c4033" stroke-width="7" stroke-linecap="round"/>
    <path d="M192 122 C202 106 218 96 230 78" fill="none" stroke="#5c4033" stroke-width="7" stroke-linecap="round"/>
    <path d="M189 116 C188 96 190 78 189 62" fill="none" stroke="#5c4033" stroke-width="6" stroke-linecap="round"/>
    <!-- secondary limbs, tapering thinner -->
    <path d="M162 96 C152 84 142 76 132 68" fill="none" stroke="#5c4033" stroke-width="4" stroke-linecap="round"/>
    <path d="M210 92 C220 80 230 72 240 64" fill="none" stroke="#5c4033" stroke-width="4" stroke-linecap="round"/>
    <path d="M189 84 C178 70 172 60 168 50" fill="none" stroke="#5c4033" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M189 84 C198 70 204 60 208 50" fill="none" stroke="#5c4033" stroke-width="3.5" stroke-linecap="round"/>
    <!-- foliage clusters at limb tips -->
    <g stroke="#0A0812" stroke-width="1.5">
      <circle cx="148" cy="82" r="17" fill="url(#treeGreen)"/>
      <circle cx="132" cy="68" r="13" fill="url(#treeGreen)"/>
      <circle cx="230" cy="78" r="17" fill="url(#treeGreen)"/>
      <circle cx="240" cy="64" r="13" fill="url(#treeGreen)"/>
      <circle cx="189" cy="62" r="15" fill="url(#treeGreen)"/>
      <circle cx="168" cy="50" r="12" fill="url(#treeGreen)"/>
      <circle cx="208" cy="50" r="12" fill="url(#treeGreen)"/>
      <circle cx="189" cy="95" r="20" fill="url(#treeGreen)"/>
    </g>
  </g>
  <!-- Tree of Knowledge -->
  <rect x="98"  y="105" width="18" height="55" fill="#5c4033" stroke="#0A0812" stroke-width="2" data-depth="0.55"/>
  <circle cx="107" cy="95" r="32" fill="url(#treeGreen)" stroke="#0A0812" stroke-width="2.5" data-depth="0.55"/>
  <!-- Fruit on Tree of Life — gold dots, nestled in the foliage clusters, near -->
  <circle cx="148" cy="82" r="4" fill="#FFD84D" opacity=".8" data-depth="0.6"/>
  <circle cx="230" cy="78" r="3.5" fill="#FFD84D" opacity=".8" data-depth="0.6"/>
  <circle cx="189" cy="62" r="4" fill="#FFD84D" opacity=".9" data-depth="0.6"/>
  <circle cx="168" cy="50" r="3" fill="#FFD84D" opacity=".7" data-depth="0.6"/>
  <circle cx="189" cy="95" r="3.5" fill="#FFD84D" opacity=".6" data-depth="0.6"/>
  <!-- Fruit on Tree of Knowledge — red dots, near -->
  <circle cx="98"  cy="85" r="4" fill="#FF6B5B" opacity=".8" data-depth="0.6"/>
  <circle cx="116" cy="88" r="3" fill="#FF6B5B" opacity=".7" data-depth="0.6"/>
  <circle cx="105" cy="110" r="4" fill="#FF6B5B" opacity=".6" data-depth="0.6"/>
  <!-- Ground grass — foreground -->
  <rect x="0" y="170" width="300" height="30" fill="#6b3a18" data-depth="0.9"/>
  <!-- Path — unity line through garden -->
  <rect x="148" y="168" width="4" height="32" fill="#8b5a2b" opacity=".4" data-depth="0.9"/>
</svg>
