<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Exile Judged — divine judgment, gates closing -->
  <!-- Deep night bg -->
  <rect width="300" height="200" fill="#0a0812"/>
  <!-- Ground -->
  <rect x="0" y="150" width="300" height="50" fill="#0d0705"/>
  <!-- Gates of Eden — closing -->
  <rect x="100" y="60" width="24" height="95" fill="#8b5a2b" stroke="#0A0812" stroke-width="3"/>
  <rect x="176" y="60" width="24" height="95" fill="#8b5a2b" stroke="#0A0812" stroke-width="3"/>
  <!-- Gate arch closing -->
  <rect x="100" y="60" width="100" height="8" fill="#8b5a2b" stroke="#0A0812" stroke-width="2"/>
  <!-- Gate bars -->
  <line x1="150" y1="60" x2="150" y2="155" stroke="#FFD84D" stroke-width="3"/>
  <line x1="100" y1="75" x2="200" y2="75" stroke="#FFD84D" stroke-width="3"/>
  <line x1="100" y1="90" x2="200" y2="90" stroke="#FFD84D" stroke-width="3"/>
  <!-- Flaming sword guard -->
  <ellipse cx="150" cy="50" rx="15" ry="30" fill="#FFD84D" opacity=".6"/>
  <rect x="147" y="20" width="6" height="60" fill="#FFD84D" transform="rotate(-15 150 50)"/>
  <!-- Serpent cursed -->
  <path d="M50 145 Q60 140 70 145 Q80 150 75 155" fill="#442211" opacity=".6"/>
  <!-- Adam and Eve departing — small -->
  <rect x="30" y="125" width="18" height="30" fill="#5c4033" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="39" cy="118" r="6" fill="#C8956C" stroke="#0A0812" stroke-width="1"/>
  <rect x="12" y="128" width="14" height="27" fill="#8a7a5a" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="19" cy="120" r="5" fill="#dcb088" stroke="#0A0812" stroke-width="1"/>
  <!-- Judgment lightning -->
  <path d="M150 20 L145 50 L155 50 Z" fill="#ffffff" opacity=".8"/>
  <path d="M160 15 L155 45 L165 45 Z" fill="#ffffff" opacity=".6"/>
</svg>
