<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="commandGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="treeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7a3a"/>
      <stop offset="100%" stop-color="#3a5a3a"/>
    </linearGradient>
  </defs>
  <!-- Garden — warm bg -->
  <rect width="300" height="200" fill="#2b1d0c"/>
  <!-- Divine light from above — emphasis, celestial -->
  <ellipse cx="150" cy="25" rx="80" ry="40" fill="url(#commandGlow)"/>
  <!-- The two trees in center — emphasis -->
  <!-- Tree of Knowledge (left) -->
  <rect x="80" y="90" width="30" height="70" fill="#5c4033" stroke="#0A0812" stroke-width="2.5"/>
  <circle cx="95" cy="75" r="44" fill="url(#treeG)" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Tree of Life (right) -->
  <rect x="190" y="85" width="30" height="75" fill="#5c4033" stroke="#0A0812" stroke-width="2.5"/>
  <circle cx="205" cy="72" r="42" fill="url(#treeG)" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Fruit on tree of knowledge — red -->
  <ellipse cx="80" cy="60" rx="8" ry="10" fill="#FF6B5B" stroke="#0A0812" stroke-width="2"/>
  <ellipse cx="110" cy="65" rx="8" ry="10" fill="#8B0000" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Fruit on tree of life — gold -->
  <ellipse cx="190" cy="55" rx="8" ry="10" fill="#FFD84D" stroke="#0A0812" stroke-width="2"/>
  <ellipse cx="220" cy="60" rx="8" ry="10" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Banister-like path dividing them — unity: the choice -->
  <rect x="148" y="155" width="4" height="25" fill="#8b5a2b" opacity=".4"/>
  <!-- Background trees — rhythm -->
  <rect x="20"  y="105" width="18" height="55" fill="#3a5a3a" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="262" y="115" width="18" height="45" fill="#3a5a3a" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Ground -->
  <rect x="0" y="165" width="300" height="35" fill="#6b3a18"/>
  <!-- Tablet/stone with command — symbol: divine law -->
  <rect x="140" y="170" width="20" height="18" fill="#8b5a2b" stroke="#0A0812" stroke-width="2"/>
  <line x1="145" y1="174" x2="155" y2="174" stroke="#0A0812" stroke-width="1"/>
  <line x1="145" y1="178" x2="155" y2="178" stroke="#0A0812" stroke-width="1"/>
</svg>
