<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Creation of humanity — Adam and Eve with animals in a garden setting -->
  <!-- Sky gradient — divine light -->
  <defs>
    <radialGradient id="godRays" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="#1a0e06"/>
  <!-- Divine light from above — emphasis: overhead, gentle -->
  <ellipse cx="150" cy="90" rx="140" ry="60" fill="url(#godRays)"/>
  <!-- Ground plane -->
  <rect x="0" y="155" width="300" height="45" fill="#5c4033" stroke="#0A0812" stroke-width="2"/>
  <!-- Grass tufts — rhythm, pattern -->
  <rect x="10"  y="158" width="4" height="6" fill="#6b3a18"/>
  <rect x="18"  y="157" width="3" height="7" fill="#6b3a18"/>
  <rect x="28"  y="159" width="5" height="5" fill="#6b3a18"/>
  <rect x="40"  y="158" width="3" height="6" fill="#6b3a18"/>
  <rect x="60"  y="156" width="4" height="8" fill="#6b3a18"/>
  <rect x="80"  y="159" width="3" height="5" fill="#6b3a18"/>
  <rect x="100" y="157" width="5" height="7" fill="#6b3a18"/>
  <rect x="120" y="158" width="4" height="6" fill="#6b3a18"/>
  <!-- Animals — variety: different shapes, sizes -->
  <!-- Sheep-ish -->
  <ellipse cx="230" cy="165" rx="14" ry="8" fill="#e8e0cf" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="225" cy="155" r="6" fill="#e8e0cf" stroke="#0A0812" stroke-width="1"/>
  <!-- Goat-ish -->
  <ellipse cx="250" cy="166" rx="10" ry="7" fill="#b88353" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="248" cy="156" r="5" fill="#b88353" stroke="#0A0812" stroke-width="1"/>
  <!-- Bird -->
  <path d="M200 140 Q210 132 220 140 Q215 138 210 140" fill="#8b6010" stroke="#0A0812" stroke-width="1"/>
  <!-- Adam figure — emphasis: central-left, standing -->
  <rect x="85"  y="90" width="34" height="70" fill="#5c4033" stroke="#0A0812" stroke-width="2.5" rx="4"/>
  <circle cx="102" cy="82" r="16" fill="#C8956C" stroke="#0A0812" stroke-width="2.5"/>
  <path d="M94 80 Q102 72 110 80" fill="none" stroke="#2a1e15" stroke-width="3"/>
  <!-- Eve figure — emphasis: central-right, gentle -->
  <rect x="181" y="92" width="30" height="68" fill="#8a7a5a" stroke="#0A0812" stroke-width="2.5" rx="4"/>
  <circle cx="196" cy="84" r="14" fill="#dcb088" stroke="#0A0812" stroke-width="2.5"/>
  <path d="M188 82 Q196 74 204 82" fill="none" stroke="#1a1410" stroke-width="2.5"/>
  <!-- Trees — rhythm, framing -->
  <rect x="15"  y="90" width="20" height="70" fill="#3a5a3a" stroke="#0A0812" stroke-width="2"/>
  <rect x="12"  y="82" width="26" height="10" fill="#5a7a3a" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="265" y="88" width="22" height="72" fill="#3a5a3a" stroke="#0A0812" stroke-width="2"/>
  <rect x="262" y="80" width="28" height="10" fill="#5a7a3a" stroke="#0A0812" stroke-width="1.5"/>
</svg>
