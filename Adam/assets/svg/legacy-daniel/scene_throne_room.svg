<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- NEW: Material Patterns -->
    <pattern id="stone-texture" patternUnits="userSpaceOnUse" width="100" height="100">
        <filter id="turbulence">
            <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="turbulence" />
            <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <rect width="100" height="100" fill="transparent" />
        <path d="M-10,10 C40,20 60,80 110,90 M-10,50 C40,60 60,40 110,30"
              stroke="#000" stroke-width="0.5" fill="none" opacity="0.07" filter="url(#turbulence)" />
    </pattern>
    <pattern id="wood-grain" patternUnits="userSpaceOnUse" width="80" height="80">
        <filter id="wood-turbulence">
            <feTurbulence type="fractalNoise" baseFrequency="0.02 0.1" numOctaves="1" result="turbulence" />
            <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="2" />
        </filter>
        <path d="M0,10 H80 M0,30 H80 M0,50 H80 M0,70 H80"
              stroke="#000" stroke-width="0.7" fill="none" opacity="0.1" filter="url(#wood-turbulence)" />
    </pattern>
    <pattern id="gold-texture" patternUnits="userSpaceOnUse" width="50" height="50">
        <rect width="50" height="50" fill="transparent" />
        <path d="M-10,25 C20,5 30,45 60,25" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.1" />
        <circle cx="10" cy="10" r="1" fill="#fff" opacity="0.15" />
        <circle cx="40" cy="40" r="1.5" fill="#fff" opacity="0.1" />
        <circle cx="25" cy="35" r="0.8" fill="#000" opacity="0.08" />
    </pattern>

    <linearGradient id="throneFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a08"/>
      <stop offset="100%" stop-color="#1e0f0a"/>
    </linearGradient>
    <radialGradient id="throneGlow" cx="50%" cy="60%" r="40%">
      <stop offset="0%"   stop-color="#FF6B5B" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#FF6B5B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="#1e0f0a"/>
  <!-- Ceiling — hierarchy: frames downward -->
  <path d="M0 28 Q150 4 300 28 L300 0 L0 0 Z" fill="#2e1208"/>
  <!-- Ceiling torches — rhythm, contrast -->
  <line x1="60"  y1="0" x2="60"  y2="26" stroke="#FF6B5B" stroke-width="1.5" opacity=".6"/>
  <circle cx="60"  cy="30" r="5"  fill="#FF6B5B" opacity=".8"/>
  <line x1="150" y1="0" x2="150" y2="20" stroke="#FFD84D" stroke-width="2"   opacity=".7"/>
  <circle cx="150" cy="24" r="7"  fill="#FFD84D" opacity=".9"/>
  <line x1="240" y1="0" x2="240" y2="26" stroke="#FF6B5B" stroke-width="1.5" opacity=".6"/>
  <circle cx="240" cy="30" r="5"  fill="#FF6B5B" opacity=".8"/>
  <!-- Floor tiles — pattern, perspective movement -->
  <rect x="0" y="156" width="300" height="44" fill="url(#throneFloor)"/>
  <rect x="0" y="156" width="300" height="44" fill="url(#stone-texture)" opacity="0.2"/>
  <line x1="0"  y1="172" x2="300" y2="172" stroke="#0A0812" stroke-width="1" opacity=".5"/>
  <line x1="0"  y1="188" x2="300" y2="188" stroke="#0A0812" stroke-width="1" opacity=".4"/>
  <line x1="0"  y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="100" y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="200" y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="300" y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <!-- Columns — repetition, rhythm: 4 tall, slightly different depths -->
  <rect x="8"   y="36" width="20" height="120" fill="#4a2010" stroke="#0A0812" stroke-width="2"/>
  <rect x="8"   y="36" width="20" height="120" fill="url(#stone-texture)" opacity="0.3"/>
  <rect x="6"   y="32" width="24" height="10"  fill="#6b3a18" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="50"  y="36" width="18" height="120" fill="#4a2010" stroke="#0A0812" stroke-width="2"/>
  <rect x="50"  y="36" width="18" height="120" fill="url(#stone-texture)" opacity="0.3"/>
  <rect x="48"  y="32" width="22" height="10"  fill="#6b3a18" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="232" y="36" width="18" height="120" fill="#4a2010" stroke="#0A0812" stroke-width="2"/>
  <rect x="232" y="36" width="18" height="120" fill="url(#stone-texture)" opacity="0.3"/>
  <rect x="230" y="32" width="22" height="10"  fill="#6b3a18" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="272" y="36" width="20" height="120" fill="#4a2010" stroke="#0A0812" stroke-width="2"/>
  <rect x="272" y="36" width="20" height="120" fill="url(#stone-texture)" opacity="0.3"/>
  <rect x="270" y="32" width="24" height="10"  fill="#6b3a18" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Frieze — unity -->
  <rect x="0" y="32" width="300" height="7" fill="#8b5a2b" opacity=".5"/>
  <rect x="0" y="32" width="300" height="7" fill="url(#wood-grain)" opacity="0.2"/>
  <!-- Throne glow aura — emphasis -->
  <ellipse cx="150" cy="120" rx="70" ry="50" fill="url(#throneGlow)"/>
  <!-- Throne base steps — hierarchy, proportion -->
  <rect x="82"  y="120" width="136" height="12" fill="#5a2a10" stroke="#0A0812" stroke-width="2"/>
  <rect x="82"  y="120" width="136" height="12" fill="url(#stone-texture)" opacity="0.2"/>
  <rect x="92"  y="108" width="116" height="14" fill="#6a3418" stroke="#0A0812" stroke-width="2"/>
  <rect x="92"  y="108" width="116" height="14" fill="url(#stone-texture)" opacity="0.2"/>
  <!-- Throne body — emphasis: heaviest object -->
  <rect x="108" y="60"  width="84"  height="50"  fill="#3a1a08" stroke="#0A0812" stroke-width="2.5"/>
  <rect x="108" y="60"  width="84"  height="50"  fill="url(#wood-grain)" opacity="0.3"/>
  <polygon points="108,60 150,38 192,60" fill="#5a2a10" stroke="#0A0812" stroke-width="2.5"/>
  <polygon points="108,60 150,38 192,60" fill="url(#wood-grain)" opacity="0.2"/>
  <!-- Throne accents — variety -->
  <rect x="116" y="70" width="18" height="8" fill="#FFD84D" opacity=".5"/>
  <rect x="116" y="70" width="18" height="8" fill="url(#gold-texture)" opacity="0.5"/>
  <rect x="166" y="70" width="18" height="8" fill="#FFD84D" opacity=".5"/>
  <rect x="166" y="70" width="18" height="8" fill="url(#gold-texture)" opacity="0.5"/>
  <rect x="124" y="82" width="52" height="5" fill="#FF6B5B" opacity=".4"/>
  <!-- Armrests — proportion -->
  <rect x="104" y="78" width="12" height="26" fill="#4a2010" stroke="#0A0812" stroke-width="2"/>
  <rect x="184" y="78" width="12" height="26" fill="#4a2010" stroke="#0A0812" stroke-width="2"/>
</svg>
