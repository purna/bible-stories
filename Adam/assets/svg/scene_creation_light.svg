<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Creation Light — divine command -->
  <rect width="300" height="200" fill="#03010a"/>
  <!-- Stars — far -->
  <circle cx="40" cy="20" r="1.2" fill="white" opacity=".6"/>
  <circle cx="80" cy="12" r="1" fill="white" opacity=".5"/>
  <circle cx="200" cy="18" r="1.3" fill="white" opacity=".6"/>
  <circle cx="260" cy="25" r="1" fill="white" opacity=".4"/>
  <!-- Light burst — central -->
  <ellipse cx="150" cy="110" rx="80" ry="90" fill="#FFD84D" opacity=".7"/>
  <!-- Expanding wave rings -->
  <circle cx="150" cy="110" r="95" fill="none" stroke="#FFD84D" stroke-width="2" opacity=".3"/>
  <circle cx="150" cy="110" r="115" fill="none" stroke="#FFD84D" stroke-width="1" opacity=".15"/>
  <!-- Earth — silhouette -->
  <circle cx="100" cy="160" r="14" fill="#1a251a" stroke="#0A0812" stroke-width="1"/>
  <!-- Moon -->
  <circle cx="240" cy="70" r="6" fill="#cccccc" opacity=".8"/>
  <!-- Ground -->
  <rect x="0" y="155" width="300" height="45" fill="#080510" stroke="#0A0812" stroke-width="2"/>
</svg>
