<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- The Hiding — shame, hiding from God -->
  <!-- Dark, somber bg -->
  <rect width="300" height="200" fill="#2a1008"/>
  <!-- Ground -->
  <rect x="0" y="150" width="300" height="50" fill="#4a2010" stroke="#0A0812" stroke-width="2"/>
  <!-- Tree of Knowledge — in background -->
  <rect x="260" y="70" width="20" height="80" fill="#5c4033" stroke="#0A0812" stroke-width="2"/>
  <path d="M270 65 Q240 30 210 50 Q230 35 200 30 Q230 20 200 15 Q230 10 260 25" fill="#2a4a2a" opacity=".5"/>
  <!-- Dropped fruit -->
  <ellipse cx="250" cy="155" rx="6" ry="7" fill="#FF6B5B" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Adam — hiding, shame -->
  <rect x="120" y="100" width="34" height="60" fill="#5c4033" stroke="#0A0812" stroke-width="2.5" rx="4"/>
  <circle cx="137" cy="88" r="14" fill="#C8956C" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Adam arms crossed -->
  <path d="M120 105 Q100 100 90 115" fill="none" stroke="#5c4033" stroke-width="10" stroke-linecap="round"/>
  <path d="M154 105 Q174 100 184 115" fill="none" stroke="#5c4033" stroke-width="10" stroke-linecap="round"/>
  <!-- Eve — hiding, opposite side -->
  <rect x="46" y="100" width="30" height="58" fill="#8a7a5a" stroke="#0A0812" stroke-width="2.5" rx="4"/>
  <circle cx="61" cy="88" r="12" fill="#dcb088" stroke="#0A0812" stroke-width="2"/>
  <!-- Fig leaves -->
  <path d="M53 108 Q57 102 61 108" fill="#2a4a2a" stroke="#0A0812" stroke-width="1"/>
  <path d="M68 108 Q72 102 76 108" fill="#2a4a2a" stroke="#0A0812" stroke-width="1"/>
  <!-- Shadows -->
  <ellipse cx="140" cy="170" rx="20" ry="6" fill="#0A0812" opacity=".5"/>
  <ellipse cx="60" cy="168" rx="16" ry="5" fill="#0A0812" opacity=".4"/>
  <!-- Tree of Life — distant -->
  <rect x="15" y="80" width="24" height="70" fill="#5c4033" stroke="#0A0812" stroke-width="2"/>
  <circle cx="27" cy="70" r="30" fill="#4a6a3a" opacity=".3" stroke="#0A0812" stroke-width="1.5"/>
</svg>
