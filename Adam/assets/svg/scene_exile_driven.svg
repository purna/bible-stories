<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" data-parallax="true">
  <!-- Exile Driven — driven out, flaming sword -->
  <!-- Deep space bg --><!-- data-parallax: stars far, gates mid, figures near -->
  <rect width="300" height="200" fill="#03010a" data-depth="0"/>
  <!-- Pre-dawn stars — far -->
  <circle cx="40" cy="20" r="1" fill="white" opacity=".5" data-depth="0.1"/>
  <circle cx="80" cy="12" r="0.8" fill="white" opacity=".4" data-depth="0.1"/>
  <circle cx="200" cy="18" r="1.2" fill="white" opacity=".5" data-depth="0.1"/>
  <circle cx="260" cy="25" r="0.8" fill="white" opacity=".3" data-depth="0.1"/>
  <!-- Gates of Eden — barred, midground -->
  <rect x="110" y="70" width="18" height="85" fill="#8b5a2b" stroke="#0A0812" stroke-width="3" data-depth="0.4"/>
  <rect x="192" y="70" width="18" height="85" fill="#8b5a2b" stroke="#0A0812" stroke-width="3" data-depth="0.4"/>
  <!-- Bar across top -->
  <rect x="110" y="65" width="100" height="6" fill="#4a4a4a" data-depth="0.4"/>
  <!-- Gate bars -->
  <line x1="150" y1="70" x2="150" y2="155" stroke="#FFD84D" stroke-width="3" data-depth="0.4"/>
  <!-- Flaming sword in gates -->
  <ellipse cx="150" cy="55" rx="14" ry="25" fill="#FFD84D" data-depth="0.5"/>
  <rect x="147" y="30" width="6" height="50" fill="#FFD84D" transform="rotate(-15 150 55)" data-depth="0.5"/>
  <!-- Flames -->
  <circle cx="150" cy="35" r="3" fill="#FF6B5B" data-depth="0.5"/>
  <circle cx="145" cy="40" r="2" fill="#FFD84D" data-depth="0.5"/>
  <!-- Distant mountains — far -->
  <path d="M10 120 L30 100 L50 120 Z" fill="#061224" opacity=".4" data-depth="0.15"/>
  <path d="M70 115 L95 95 L120 115 Z" fill="#061224" opacity=".4" data-depth="0.15"/>
  <path d="M140 125 L165 100 L190 125 Z" fill="#061224" opacity=".4" data-depth="0.15"/>
  <path d="M210 118 L240 100 L270 120 Z" fill="#061224" opacity=".4" data-depth="0.15"/>
  <!-- Adam and Eve departing — small, foreground -->
  <rect x="30" y="125" width="18" height="30" fill="#5c4033" stroke="#0A0812" stroke-width="1.5" data-depth="0.9"/>
  <circle cx="39" cy="118" r="6" fill="#C8956C" stroke="#0A0812" stroke-width="1" data-depth="0.9"/>
  <rect x="12" y="128" width="14" height="27" fill="#8a7a5a" stroke="#0A0812" stroke-width="1.5" data-depth="0.9"/>
  <circle cx="19" cy="120" r="5" fill="#dcb088" stroke="#0A0812" stroke-width="1" data-depth="0.9"/>
  <!-- Ground -->
  <rect x="0" y="160" width="300" height="40" fill="#030b18" data-depth="1.0"/>
</svg>
