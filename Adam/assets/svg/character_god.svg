<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="godGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Divine glow ---->
  <ellipse cx="60" cy="50" rx="50" ry="55" fill="url(#godGlow)"/>
  <!-- Robe --><!-- flowing --><!-- hierarchy: wide at base ---->
  <path d="M30 70 Q25 95 60 120 Q95 95 90 70 Z" fill="#e6d4a3" stroke="#0A0812" stroke-width="3"/>
  <!-- Beard --><!-- flowing, full --><!-- emphasis: facial detail ---->
  <path d="M40 70 Q60 95 80 70 Q75 85 60 88 Q45 85 40 70 Z" fill="#f0e6d0" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Robe overlay --><!-- division: tunic fold -->-->
  <path d="M30 70 Q60 90 90 70 L85 72 Q60 92 35 72 Z" fill="#d4c298" stroke="#0A0812" stroke-width="1"/>
  <!-- Torso --><!-- emphasis: central figure -->-->
  <rect x="45" y="42" width="30" height="38" fill="#e6d4a3" stroke="#0A0812" stroke-width="3" rx="4"/>
  <!-- Arms crossed / raised --><!-- movement: blessing -->-->
  <path d="M45 50 Q30 35 25 45" fill="none" stroke="#e6d4a3" stroke-width="8" stroke-linecap="round"/>
  <path d="M75 50 Q90 35 95 45" fill="none" stroke="#e6d4a3" stroke-width="8" stroke-linecap="round"/>
  <!-- Head / hair --><!-- hierarchy: above torso, richly bordered -->-->
  <circle cx="60" cy="30" r="22" fill="#f0e6d0" stroke="#0A0812" stroke-width="3"/>
  <!-- Beard flowing down --><!-- emphasis: longest detail -->
  <path d="M48 42 Q60 55 72 42" fill="none" stroke="#0A0812" stroke-width="3"/>
  <path d="M46 46 Q60 58 74 46" fill="none" stroke="#0A0812" stroke-width="2"/>
  <!-- Eyes --><!-- closed in contemplation --><!-- variety: organic curve --">-->
  <path d="M53 28 Q56 26 59 28" fill="none" stroke="#0A0812" stroke-width="2.5"/>
  <path d="M61 28 Q64 26 67 28" fill="none" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Mouth --><!-- gentle, calm --><!-- variety: subtle curve -->
  <path d="M56 36 Q60 38 64 36" fill="none" stroke="#0A0812" stroke-width="1.5"/>
</svg>
