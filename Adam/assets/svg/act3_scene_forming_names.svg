<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Forming Names — Adam naming creatures -->
  <rect width="300" height="200" fill="#2b1d0c"/>
  <!-- Ground -->
  <rect x="0" y="150" width="300" height="50" fill="#6b3a18" stroke="#0A0812" stroke-width="2"/>
  <!-- Adam — central, gesturing -->
  <rect x="135" y="95" width="30" height="60" fill="#5c4033" stroke="#0A0812" stroke-width="2.5" rx="4"/>
  <circle cx="150" cy="82" r="14" fill="#C8956C" stroke="#0A0812" stroke-width="2"/>
  <!-- Various creatures -->
  <!-- Sheep -->
  <circle cx="55" cy="140" r="10" fill="#e8e0cf" stroke="#0A0812" stroke-width="1"/>
  <circle cx="48" cy="142" r="3.5" fill="#0A0812" opacity=".5"/>
  <circle cx="62" cy="142" r="3.5" fill="#0A0812" opacity=".5"/>
  <!-- Lion -->
  <circle cx="190" cy="130" r="14" fill="#8b4513" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="185" cy="122" r="5" fill="#0A0812" opacity=".4"/>
  <!-- Bird -->
  <circle cx="250" cy="55" r="5" fill="#8b6010" stroke="#0A0812" stroke-width="1"/>
  <!-- Elephant -->
  <circle cx="240" cy="145" r="12" fill="#5a4a3a" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Trees framing -->
  <rect x="25" y="110" width="18" height="45" fill="#5c4033" stroke="#0A0812" stroke-width="2"/>
  <circle cx="34" cy="100" r="20" fill="#4a7a3a" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="257" y="110" width="18" height="45" fill="#5c4033" stroke="#0A0812" stroke-width="2"/>
  <circle cx="266" cy="100" r="20" fill="#4a7a3a" stroke="#0A0812" stroke-width="1.5"/>
</svg>
