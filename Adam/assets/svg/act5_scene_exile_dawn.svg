<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" data-parallax="true">
  <defs>
    <radialGradient id="dawnGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#4ECDC4" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="swordGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#FF6B5B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dawn after exile — cold but hopeful -->
  <!-- Deep blue night sky — static -->
  <rect width="300" height="200" fill="#061224" data-depth="0"/>
  <!-- Pre-dawn stars — far -->
  <circle cx="40"  cy="20" r="1.2" fill="white" opacity=".6" data-depth="0.15"/>
  <circle cx="80"  cy="12" r="1"   fill="white" opacity=".5" data-depth="0.15"/>
  <circle cx="200" cy="18" r="1.3" fill="white" opacity=".6" data-depth="0.15"/>
  <circle cx="260" cy="25" r="1"   fill="white" opacity=".4" data-depth="0.15"/>
  <!-- Dawn light breaking — midground -->
  <ellipse cx="150" cy="150" rx="130" ry="60" fill="url(#dawnGlow)" data-depth="0.3"/>
  <!-- Distant mountains — far -->
  <path d="M10 120 L30 100 L50 120 Z" fill="#061224" opacity=".4" data-depth="0.2"/>
  <path d="M70 115 L95 95 L120 115 Z" fill="#061224" opacity=".4" data-depth="0.2"/>
  <path d="M140 125 L165 100 L190 125 Z" fill="#061224" opacity=".4" data-depth="0.2"/>
  <path d="M210 118 L240 100 L270 120 Z" fill="#061224" opacity=".4" data-depth="0.2"/>
  <!-- Gates of Eden — closed, midground -->
  <rect x="110" y="100" width="80" height="50" fill="#1b4965" stroke="#0A0812" stroke-width="4" data-depth="0.5"/>
  <!-- Gate bars -->
  <line x1="150" y1="100" x2="150" y2="150" stroke="#FFD84D" stroke-width="3" data-depth="0.5"/>
  <line x1="110" y1="120" x2="190" y2="120" stroke="#FFD84D" stroke-width="3" data-depth="0.5"/>
  <line x1="110" y1="135" x2="190" y2="135" stroke="#FFD84D" stroke-width="3" data-depth="0.5"/>
  <!-- Flaming sword guard — emphasis -->
  <ellipse cx="150" cy="70" rx="25" ry="40" fill="url(#swordGlow)" data-depth="0.6"/>
  <rect x="146" y="30" width="8" height="80" fill="#FFD84D" stroke="#0A0812" stroke-width="2" transform="rotate(-15 150 70)" data-depth="0.6"/>
  <path d="M142 30 Q150 22 158 30" fill="#FFD84D" stroke="#0A0812" stroke-width="2" data-depth="0.6"/>
  <!-- Adam and Eve in distance — small, departing, foreground -->
  <rect x="240" y="115" width="22" height="50" fill="#5c4033" stroke="#0A0812" stroke-width="2" data-depth="0.9"/>
  <circle cx="251" cy="105" r="8" fill="#C8956C" stroke="#0A0812" stroke-width="1.5" data-depth="0.9"/>
  <rect x="266" y="120" width="18" height="45" fill="#8a7a5a" stroke="#0A0812" stroke-width="2" data-depth="0.9"/>
  <circle cx="275" cy="110" r="6" fill="#dcb088" stroke="#0A0812" stroke-width="1.5" data-depth="0.9"/>
  <!-- Ground — foreground -->
  <rect x="0" y="160" width="300" height="40" fill="#030b18" data-depth="0.9"/>
  <!-- Scorched earth marks — movement: the curse on the ground, foreground -->
  <path d="M40 170 Q55 168 70 170" stroke="#8b0000" stroke-width="2" fill="none" data-depth="1.0"/>
  <path d="M180 168 Q195 170 210 168" stroke="#8b0000" stroke-width="2" fill="none" data-depth="1.0"/>
  <path d="M260 172 Q270 170 280 172" stroke="#8b0000" stroke-width="2" fill="none" data-depth="1.0"/>
</svg>
