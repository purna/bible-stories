<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="eveGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4ECDC4" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a8a4a"/>
      <stop offset="100%" stop-color="#3a5a3a"/>
    </linearGradient>
  </defs>
  <!-- Shelter of leaves — garden setting --><!-- balance: low horizon -->
  <rect width="300" height="200" fill="#1a0e06"/>
  <!-- Dusk sky -->
  <rect x="0" y="0" width="300" height="120" fill="#2b1220"/>
  <!-- Leafy shelter — made from fig leaves -->
  <path d="M100 90 Q150 70 200 90 Q180 88 150 88 Q120 88 100 90 Z" fill="url(#leafGreen)" stroke="#0A0812" stroke-width="2"/>
  <ellipse cx="150" cy="85" rx="50" ry="6" fill="#6a8a4a" opacity=".7"/>
  <!-- Adam figure — sleeping on ground --><!-- emphasis: central, horizontal -->
  <rect x="100" y="95" width="42" height="65" fill="#5c4033" stroke="#0A0812" stroke-width="2.5" rx="4"/>
  <circle cx="121" cy="82" r="14" fill="#C8956C" stroke="#0A0812" stroke-width="2"/>
  <!-- Adam hair/beard */
  <path d="M108 80 Q121 70 134 80" fill="none" stroke="#2a1e15" stroke-width="3"/>
  <!-- Adam arm outstretched — variety, gesture -->
  <path d="M100 105 Q70 95 60 110" fill="none" stroke="#5c4033" stroke-width="10" stroke-linecap="round"/>
  <!-- Eve forming — emphasis: divine light, new life -->
  <ellipse cx="150" cy="75" rx="40" ry="35" fill="url(#eveGlow)"/>
  <!-- Eve figure — emerging from Adam's side --><!-- emphasis: rising, gentle -->
  <rect x="136" y="80" width="28" height="55" fill="#8a7a5a" stroke="#0A0812" stroke-width="2.5" rx="4"/>
  <circle cx="150" cy="70" r="12" fill="#dcb088" stroke="#0A0812" stroke-width="2"/>
  <!-- Eve hair — flowing --><!-- variety: long hair detail -->
  <path d="M140 62 Q150 52 160 62" fill="none" stroke="#1a1410" stroke-width="3"/>
  <path d="M138 72 Q144 58 150 60 Q156 58 162 72" fill="none" stroke="#1a1410" stroke-width="2" opacity=".5"/>
  <!-- Divine hand reaching down — movement, blessing -->
  <path d="M150 20 Q130 35 140 45" fill="none" stroke="#FFD84D" stroke-width="12" stroke-linecap="round" opacity=".5"/>
  <path d="M150 20 Q170 35 160 45" fill="none" stroke="#FFD84D" stroke-width="12" stroke-linecap="round" opacity=".5"/>
  <!-- Ground -->
  <rect x="0" y="160" width="300" height="40" fill="#5c4033" stroke="#0A0812" stroke-width="2"/>
</svg>
