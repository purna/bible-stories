<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" data-parallax="true">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="60%" stop-color="#FFD84D" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#B98CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dark night sky — static background -->
  <rect width="300" height="200" fill="#03010a" data-depth="0"/>
  <!-- Light burst — "Let there be light" -->
  <ellipse cx="150" cy="110" rx="90" ry="100" fill="url(#lightBurst)" data-depth="0.4"/>
  <!-- Stars — rhythm, white space, far -->
  <circle cx="40"  cy="20" r="1.5" fill="white" opacity=".8" data-depth="0.2"/>
  <circle cx="80"  cy="10" r="1.2" fill="white" opacity=".6" data-depth="0.2"/>
  <circle cx="120" cy="25" r="1.8" fill="white" opacity=".7" data-depth="0.2"/>
  <circle cx="200" cy="15" r="1"   fill="white" opacity=".5" data-depth="0.2"/>
  <circle cx="250" cy="22" r="1.4" fill="white" opacity=".7" data-depth="0.2"/>
  <circle cx="30"  cy="50" r="1.3" fill="white" opacity=".4" data-depth="0.2"/>
  <circle cx="60"  cy="42" r="1"   fill="white" opacity=".6" data-depth="0.2"/>
  <circle cx="230" cy="55" r="1.6" fill="white" opacity=".8" data-depth="0.2"/>
  <circle cx="270" cy="48" r="1.1" fill="white" opacity=".5" data-depth="0.2"/>
  <circle cx="100" cy="35" r="1.3" fill="white" opacity=".6" data-depth="0.2"/>
  <circle cx="180" cy="8"  r="1.5" fill="white" opacity=".7" data-depth="0.2"/>
  <!-- Nebula swirls — variety: organic gas clouds -->
  <path d="M80 170 Q120 140 160 170 Q200 180 240 160 Q200 180 160 185 Q120 180 80 170"
        fill="#B98CFF" opacity=".08" data-depth="0.3"/>
  <path d="M40 130 Q80 110 120 130 Q160 140 200 120 Q240 130 260 110 Q220 120 180 110"
        fill="#4ECDC4" opacity=".06" data-depth="0.3"/>
  <!-- Galaxy cluster — rhythm, repetition -->
  <circle cx="70"  cy="160" r="8"  fill="#B98CFF" opacity=".15" data-depth="0.35"/>
  <circle cx="62"  cy="158" r="4"  fill="#B98CFF" opacity=".4" data-depth="0.35"/>
  <circle cx="78"  cy="162" r="3"  fill="#B98CFF" opacity=".3" data-depth="0.35"/>
  <circle cx="230" cy="140" r="10" fill="#4ECDC4" opacity=".12" data-depth="0.35"/>
  <circle cx="225" cy="138" r="5"  fill="#4ECDC4" opacity=".35" data-depth="0.35"/>
  <circle cx="235" cy="142" r="4"  fill="#4ECDC4" opacity=".25" data-depth="0.35"/>
  <!-- Earth sphere — foreground planet -->
  <circle cx="100" cy="160" r="18" fill="#2a7d3a" stroke="#0A0812" stroke-width="1" data-depth="0.6"/>
  <!-- Moon — distant -->
  <circle cx="260" cy="60" r="8" fill="#cccccc" opacity=".8" data-depth="0.5"/>
  <!-- Dark earth below — near foreground -->
  <rect x="0" y="155" width="300" height="45" fill="#080510" stroke="#0A0812" stroke-width="2" data-depth="0.9"/>
</svg>
