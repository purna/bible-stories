<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Adam: earth-toned, simple tunic, beard, grounded -->
  <!-- Skin --><!-- warmth from earth --><!-- hierarchy: central figure -->
  <circle cx="60" cy="28" r="18" fill="#C8956C" stroke="#0A0812" stroke-width="3"/>
  <!-- Eyes --><!-- determination, grounded --><!-- variety: almond shape -->
  <circle cx="54" cy="26" r="2.5" fill="#0A0812"/>
  <circle cx="66" cy="26" r="2.5" fill="#0A0812"/>
  <!-- Mouth --><!-- neutral resolve --><!-- variety: straight line -->
  <line x1="55" y1="36" x2="65" y2="36" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Beard --><!-- short, rugged --><!-- variety: stubble texture -->
  <path d="M52 30 Q60 36 68 30 Q66 38 60 38 Q54 38 52 30 Z" fill="#8a8a8a" stroke="#0A0812" stroke-width="1"/>
  <!-- Hair --><!-- simple, earth-brown -->
  <path d="M44 26 Q60 18 76 26 Q72 22 60 22 Q48 22 44 26 Z" fill="#2a1e15"/>
  <!-- Tunic --><!-- simple, earth tones --><!-- hierarchy: body mass -->
  <path d="M38 44 Q35 72 60 118 Q85 72 82 44 Z" fill="#5c4033" stroke="#0A0812" stroke-width="3" rx="6"/>
  <!-- Tunic trim --><!-- variety: decorative stripe -->
  <line x1="42" y1="52" x2="78" y2="52" stroke="#8b5a2b" stroke-width="2" opacity=".5"/>
  <line x1="42" y1="62" x2="78" y2="62" stroke="#8b5a2b" stroke-width="2" opacity=".4"/>
  <!-- Arms --><!-- natural stance, balance -->
  <path d="M38 48 Q25 60 28 78" fill="none" stroke="#5c4033" stroke-width="8" stroke-linecap="round"/>
  <path d="M82 48 Q95 60 92 78" fill="none" stroke="#5c4033" stroke-width="8" stroke-linecap="round"/>
  <!-- Ground shadow --><!-- unity: grounds figure -->