<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Look Closely — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    :root{--ink:#3a2410;--good:#2e7d32;--bad:#c62828;--accent:#ffd84d;--bg:#fffaf0}
    html,body{width:100%;height:100%;overflow:hidden}
    body{font-family:'Comic Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);text-align:center;display:flex;align-items:center;justify-content:center}
    .wrap{width:960px;max-width:none;height:540px;margin:0;padding:16px;display:flex;flex:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transform:scale(var(--game-scale,1));transform-origin:center}
    h1{font-size:1.6rem;margin:4px 0}
    h1 svg{display:inline-block;width:32px;height:32px;vertical-align:-0.3rem}
    .sub{font-size:.9rem;opacity:.8;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-content:center;margin:0 auto;width:360px;max-width:92vw}
    .card{aspect-ratio:1/1;width:100%;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent);cursor:pointer;touch-action:manipulation;transition:transform .14s,filter .14s,background .2s;position:relative;font-size:2.4rem;font-weight:900}
    .card::before{content:'?';position:absolute}
    .card svg{width:62px;height:62px}
    .card.revealed::before,.card.matched::before{display:none}
    .card svg{display:none}
    .card.revealed svg,.card.matched svg{display:block}
    .card.revealed,    .card.matched{border-color:var(--good);background:#e8f5e9}
    .card:active{transform:scale(.92);filter:brightness(1.08)}
    .card.picked{transform:scale(.92);filter:brightness(1.08)}

    /* set-complete celebration */
    .set-pop{position:absolute;top:0;left:0;pointer-events:none;z-index:20;font-size:1.4rem;font-weight:800;color:var(--good);white-space:nowrap}
    .sparkle{position:absolute;width:16px;height:16px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:18;animation:spark .5s ease-out forwards}
    @keyframes spark{0%{transform:scale(0) rotate(0);opacity:1}100%{transform:scale(1.6) rotate(360deg);opacity:0}}
    #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:1.2rem;font-weight:700;text-align:center;padding:24px}
    .btn{display:block;width:max-content;background:var(--good);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:12px 20px;font-size:1.1rem;cursor:pointer;margin:14px auto 0}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Look Closely
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="8" fill="none" stroke="#3a2410" stroke-width="2"/>
        <path d="M8 16c2-4 6-6 8-6s6 2 8 6" stroke="#3a2410" stroke-width="2"/>
      </svg>
    </h1>
    <div class="sub">Turn over three cards. Find the three matching sets.</div>
    <div class="grid" id="grid"></div>
    <div id="msg"></div>
  </div>
  <script>
    function fitGameToViewport(){document.documentElement.style.setProperty('--game-scale',Math.min(innerWidth/960,innerHeight/540));}
    addEventListener('resize',fitGameToViewport); fitGameToViewport();
    const msg=document.getElementById('msg'),grid=document.getElementById('grid');
    const cards=[
      {label:'sun',svg:'<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="14" fill="#ffd43b" stroke="#6b4b00" stroke-width="3"/><g stroke="#e89b00" stroke-width="4" stroke-linecap="round"><path d="M32 5v8M32 51v8M5 32h8M51 32h8M13 13l6 6M45 45l6 6M51 13l-6 6M19 45l-6 6"/></g></svg>'},
      {label:'moon',svg:'<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M45 48A24 24 0 1 1 40 9a20 20 0 0 0 5 39Z" fill="#7b8fcb" stroke="#283b72" stroke-width="3"/></svg>'},
      {label:'star',svg:'<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m32 6 7.5 15.2 16.8 2.4-12.1 11.8 2.9 16.7L32 44.2l-15.1 7.9 2.9-16.7L7.7 23.6l16.8-2.4Z" fill="#ff9f1c" stroke="#7a3e00" stroke-width="3" stroke-linejoin="round"/></svg>'}
    ];
    // position presets for 3x3 grid — which index gets which card, different each load
    const layouts = [
      [0,1,2,1,2,0,2,0,1],   // rotated pattern
      [1,2,0,2,0,1,0,1,2],
      [2,0,1,0,1,2,1,2,0],
      [0,2,1,2,1,0,1,0,2],
      [1,0,2,0,2,1,2,1,0],
      [2,1,0,1,0,2,0,2,1],
      [0,0,1,2,2,1,1,0,2],
      [1,1,2,0,0,2,2,1,0],
      [2,2,0,1,1,0,0,2,1],
      [0,1,1,2,0,2,1,2,0]
    ];

    let layout = layouts[Math.floor(Math.random()*layouts.length)];
    // 9 positions => 3 copies of 3 symbols = 9 cards
    let selected=[],setsFound=0,locked=false;
    layout.forEach((symIdx,i)=>{
      const c=cards[symIdx];
      const el=document.createElement('div');
      el.className='card';
      el.dataset.label=c.label;
      el.innerHTML=c.svg;
      el.setAttribute('aria-label','Hidden card');
      grid.appendChild(el);
    });

    grid.addEventListener('click',e=>{
      const card=e.target.closest('.card');
      if(!card||locked||selected.includes(card)||card.classList.contains('matched'))return;
      card.classList.add('revealed');
      card.setAttribute('aria-label',card.dataset.label);
      selected.push(card);
      if(selected.length<3)return;
      locked=true;
      const match=selected.every(item=>item.dataset.label===selected[0].dataset.label);
      if(match){
        selected.forEach(item=>item.classList.replace('revealed','matched'));
        showSetCelebration(selected);
        selected=[];
        locked=false;
        setsFound++;
        if(setsFound===3)setTimeout(finish,350);
      }else{
        const attempt=[...selected];
        selected=[];
        setTimeout(()=>{
          attempt.forEach(item=>{item.classList.remove('revealed');item.setAttribute('aria-label','Hidden card')});
          locked=false;
        },700);
      }
    });

    function finish(){
      grid.style.display='none';
      msg.innerHTML=`You found every matching set!<br><span>"The earth is the Lord's, and everything in it." — Psalm 24:1</span><div class="btn" id="restart">Look again</div>`;
      msg.style.display='flex';
      document.getElementById('restart').addEventListener('click',()=>location.reload());
      if (window.parent !== window) window.parent.postMessage({type:'game-complete', game:'look_closely'}, '*');
    }

    function showSetCelebration(matchedCards){
      const cx = matchedCards.reduce((a,c)=>a+c.getBoundingClientRect().left,0)/matchedCards.length;
      const cy = matchedCards.reduce((a,c)=>a+c.getBoundingClientRect().bottom,0)/matchedCards.length - 24;
      const pop = document.createElement('div');
      pop.className='set-pop';
      pop.textContent='Set!';
      pop.style.left = (cx - grid.getBoundingClientRect().left) + 'px';
      pop.style.top = (cy - grid.getBoundingClientRect().top) + 'px';
      grid.appendChild(pop);
      setTimeout(()=>pop.remove(), 600);
      matchedCards.forEach((c,i)=>{
        const rect=c.getBoundingClientRect();
        const spark=document.createElement('div');
        spark.className='sparkle';
        spark.style.left=(rect.left + rect.width/2 - grid.getBoundingClientRect().left)+'px';
        spark.style.top=(rect.top + rect.height/2 - grid.getBoundingClientRect().top)+'px';
        grid.appendChild(spark);
        setTimeout(()=>spark.remove(),500);
      });
    }
  </script>
</body>
</html>
