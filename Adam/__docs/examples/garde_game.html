<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garden Game — Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root{--ink:#3a2410;--good:#2e7d32;--bad:#c62828;--accent:#ffd84d;--bg:#fffaf0}
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { display: flex; align-items: center; justify-content: center; background: var(--bg); }
        .core {
            background: var(--bg);
            color: var(--ink);
            padding: 1rem;
            margin: 0;
            width: 960px;
            height: 540px;
            flex: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            font-family: 'Comic Neue', Arial, Helvetica, sans-serif;
            border: 3px solid var(--ink);
            border-radius: 10px;
            overflow: hidden;
            transform: scale(var(--game-scale, 1));
            transform-origin: center;
        }

        .title {
            font-size: 1.6rem;
            flex: 1 100%;
            max-width: 100%;
            margin-top: 4px;
            margin-bottom: 0;
            text-align: center;
        }

        .title-icon {
            display: inline-block;
            width: 1.6rem;
            height: 1.6rem;
            vertical-align: -0.3rem;
        }

        .title-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .alert .icon {
            display: inline-block;
            width: 3rem;
            height: 3rem;
            vertical-align: middle;
            margin-bottom: 0.5rem;
        }

        .alert .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .sub {
            flex: 1 100%;
            text-align: center;
            font-size: .9rem;
            margin-top: 4px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .content {
            flex: 1 100%;
            max-width: 100%;
            display: flex;
            justify-content: center;
        }

        .dragarea__outer {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .dragarea {
            width: 300px;
            height: 300px;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            place-items: center;
            gap: 0.5rem;
            position: absolute;
            inset: 0;
            z-index: 10;
            border-radius: 8px;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            background-image: linear-gradient(to right, transparent calc(33.333% - 2px), rgba(255,255,255,.75) calc(33.333% - 2px), rgba(255,255,255,.75) calc(33.333% + 2px), transparent calc(33.333% + 2px), transparent calc(66.666% - 2px), rgba(255,255,255,.75) calc(66.666% - 2px), rgba(255,255,255,.75) calc(66.666% + 2px), transparent calc(66.666% + 2px)), linear-gradient(to bottom, transparent calc(33.333% - 2px), rgba(255,255,255,.75) calc(33.333% - 2px), rgba(255,255,255,.75) calc(33.333% + 2px), transparent calc(33.333% + 2px), transparent calc(66.666% - 2px), rgba(255,255,255,.75) calc(66.666% - 2px), rgba(255,255,255,.75) calc(66.666% + 2px), transparent calc(66.666% + 2px));
        }

        .dragarea:after {
            content: "";
            position: absolute;
            pointer-events: none;
            top: 0;
            left: 0;
            width: calc(100% - 4px);
            height: calc(100% - 4px);
            border: 2px solid #5b3624;
            z-index: 1;
            border-radius: 8px;
        }

        .drop-preview {
            position: absolute;
            width: 33.333%;
            height: 33.333%;
            display: none;
            align-items: center;
            justify-content: center;
            border: 3px dashed rgba(255,255,255,.9);
            border-radius: 8px;
            background: rgba(255,255,255,.16);
            pointer-events: none;
            z-index: 4;
        }

        .drop-preview svg { width: 3rem; height: 3rem; opacity: .42; }
        .dragarea > .sortable-ghost { opacity: 0 !important; }

        .plant {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 2rem;
            border-radius: 100%;
            user-select: none;
            transition: all linear 0.25s;
            cursor: default;
            z-index: 5;
        }

        .plant svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .plant.big {
            position: relative;
        }

        .plant.big:after {
            content: "Pull me!";
            font-size: 0.9rem;
            position: absolute;
            top: 100%;
            left: 0;
            line-height: 1.1;
            animation: ease-in-out 3s infinite reverse both running seed;
            user-select: none;
            pointer-events: none;
            z-index: 100;
        }

        .plant.pulled {
            transition: all ease-in-out 0.5s;
            animation: none;
            transform: scale(1.5);
            opacity: 0;
            cursor: default;
        }

        .plant.pulled:after {
            display: none;
        }

        .plant.weed {
            filter: drop-shadow(0 0 4px rgba(255, 224, 178, 0.7));
            cursor: pointer;
            touch-action: manipulation;
        }

        .seed {
            background-color: transparent;
            animation: ease-in-out 3s infinite reverse both running seed;
            transition: transform .14s, filter .14s;
        }
        .seed.picked,.seed.sortable-chosen { transform: scale(1.12); filter: brightness(1.18); }
        .seed.released,.plant.drop-pop { animation: releasePop .28s ease-out; }

        .dragboard {
            display: flex;
            flex-wrap: wrap;
            margin: 2rem -4rem 2rem 2rem;
            height: fit-content;
        }

        .dragboard .seed {
            background-color: transparent;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .alert {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            line-height: 1.3;
            flex-direction: column;
            text-align: center;
            font-weight: 700;
            z-index: 1000;
            padding: 24px;
            background: rgba(0,0,0,.45);
        }

        .alert.active {
            display: flex;
        }

        .goagain {
            display: block;
            width: max-content;
            line-height: 1.1;
            font-size: 1.1rem;
            background-color: var(--good);
            color: #fff;
            padding: 12px 20px;
            text-align: center;
            border: 3px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            margin: 14px auto 0;
            transition: transform .12s, filter .12s;
        }
        .goagain:active { transform: scale(.92); filter: brightness(.9); }
        @keyframes releasePop { 50% { transform: scale(1.12); } }

        @keyframes seed {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(10deg); }
            50% { transform: scale(1.05) rotate(-5deg); }
            75% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes pull {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.25) rotate(-15deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
    </style>
</head>

<body>
    <div class="core">
        <h1 class="title">Tend the Garden <span class="title-icon" aria-hidden="true" id="title-icon"></span></h1>
        <div class="sub">Drag seeds onto the soil, then tap any weeds that sprout.</div>

        <div class="dragarea__outer">
            <svg class="dragarea__bg" width="300" height="300" viewBox="0 0 300 300" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <rect width="300" height="300" fill="#6A4431" />
                <g opacity="0.85">
                    <rect width="100" height="100" fill="#7F5C40" />
                    <rect x="100" width="100" height="100" fill="#7F5C40" />
                    <rect x="200" width="100" height="100" fill="#7F5C40" />
                    <rect y="100" width="100" height="100" fill="#6A4431" />
                    <rect x="100" y="100" width="100" height="100" fill="#6A4431" />
                    <rect x="200" y="100" width="100" height="100" fill="#6A4431" />
                    <rect y="200" width="100" height="100" fill="#5a3c2d" />
                    <rect x="100" y="200" width="100" height="100" fill="#5a3c2d" />
                    <rect x="200" y="200" width="100" height="100" fill="#5a3c2d" />
                </g>
            </svg>
            <div class="dragarea"></div>
        </div>

        <div class="dragboard">
            <div id="seed-1" class="plant seed" draggable="true">
                <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                    <path d="M16 4c-2 4-6 6-6 11a6 6 0 0 0 12 0c0-5-4-7-6-11Z" fill="#7CC36B" stroke="#1f3a2b" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M16 4c-1 4-3 6-3 9" fill="none" stroke="#1f3a2b" stroke-width="1.4" stroke-linecap="round"/>
                    <ellipse cx="16" cy="27" rx="3" ry="1.6" fill="#4a2f1d" stroke="#1f3a2b" stroke-width="1.2"/>
                </svg>
            </div>
        </div>

    </div>

    <div class="alert"></div>

    <script>
        function fitGameToViewport() {
            document.documentElement.style.setProperty('--game-scale', Math.min(innerWidth / 960, innerHeight / 540));
        }
        addEventListener('resize', fitGameToViewport);
        fitGameToViewport();
        document.addEventListener('pointerdown',e=>{const el=e.target.closest('.seed,.goagain');if(el)el.classList.add('picked')});
        document.addEventListener('pointerup',e=>{const el=e.target.closest('.seed,.goagain');if(!el)return;el.classList.remove('picked');el.classList.remove('released');void el.offsetWidth;el.classList.add('released')});
        const SEED_SVG = `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M16 4c-2 4-6 6-6 11a6 6 0 0 0 12 0c0-5-4-7-6-11Z" fill="#7CC36B" stroke="#1f3a2b" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 4c-1 4-3 6-3 9" fill="none" stroke="#1f3a2b" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="16" cy="27" rx="3" ry="1.6" fill="#4a2f1d" stroke="#1f3a2b" stroke-width="1.2"/></svg>`;
        const FLOWER_SVG = `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><g stroke="#1f3a2b" stroke-width="1.6" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="4" ry="5" fill="#FFC93C"/><ellipse cx="25" cy="16" rx="5" ry="4" fill="#FFC93C"/><ellipse cx="16" cy="25" rx="4" ry="5" fill="#FFC93C"/><ellipse cx="7" cy="16" rx="5" ry="4" fill="#FFC93C"/></g><circle cx="16" cy="16" r="4.5" fill="#E07A1F" stroke="#1f3a2b" stroke-width="1.6"/></svg>`;
        const WEED_SVG = `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><g stroke="#3a2410" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 28c0-7 4-10 4-16" fill="none"/><path d="M20 14c2-1 4 0 5 2" fill="#6b4226"/><path d="M18 18c-2-1 4 0 5 2" fill="#6b4226"/><path d="M16 28c0-5-3-8-3-12" fill="none"/><path d="M13 18c-1-2-3-2-4-1" fill="#6b4226"/><path d="M14 14c1-2 3-2 4-1" fill="#6b4226"/></g><ellipse cx="16" cy="28" rx="6" ry="1.6" fill="#3a2410"/></svg>`;
        const CHECK_SVG = `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M8 16.5l5.5 5.5L24 11" fill="none" stroke="#1f3a2b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("title-icon").innerHTML = SEED_SVG;

            let victory = false;
            const dragArea = document.querySelector(".dragarea");
            const dragBoard = document.querySelector(".dragboard");
            const alertEl = document.querySelector(".alert");
            const dropPreview = document.createElement("div");
            dropPreview.className = "drop-preview";
            dropPreview.innerHTML = SEED_SVG;
            dragArea.appendChild(dropPreview);
            let draggingSeed = false;
            let lastPointer = null;

            function updateDropPreview(clientX, clientY) {
                lastPointer = { clientX, clientY };
                if (!draggingSeed) return;
                const tile = tileAt(clientX, clientY);
                if (!tile || !tileIsFree(tile.row, tile.col)) {
                    dropPreview.style.display = "none";
                    return;
                }
                dropPreview.style.left = ((tile.col - 1) * 33.333) + "%";
                dropPreview.style.top = ((tile.row - 1) * 33.333) + "%";
                dropPreview.style.display = "flex";
            }

            document.addEventListener("pointermove", event => updateDropPreview(event.clientX, event.clientY));
            dragBoard.addEventListener("pointerdown", event => {
                if (event.target.closest(".seed")) draggingSeed = true;
            });
            document.addEventListener("pointerup", () => {
                draggingSeed = false;
                dropPreview.style.display = "none";
            });

            // Seed tray: clone seeds so the tray always has one to drag
            const seedTray = new Sortable(dragBoard, {
                group: { name: "seeds", pull: "clone", put: false },
                draggable: ".seed",
                sort: false,
                animation: 150,
                ghostClass: "sortable-ghost",
                chosenClass: "sortable-chosen",
                dataIdAttr: "id",
                forceFallback: true,
                fallbackOnBody: true,
                fallbackTolerance: 3,
                onStart: function () { draggingSeed = true; },
                onEnd: function () { draggingSeed = false; dropPreview.style.display = "none"; }
            });

            // Grid: accepts clone drops from the tray
            const grid = new Sortable(dragArea, {
                group: { name: "seeds", pull: false, put: true },
                filter: ".planted-seed",
                ignore: ".planted-seed",
                preventOnFilter: false,
                draggable: ".seed",
                sort: false,
                animation: 150,
                ghostClass: "sortable-ghost",
                chosenClass: "sortable-chosen",
                emptyInsertThreshold: 20,
                forceFallback: true,
                fallbackOnBody: true,
                fallbackTolerance: 3,
                onMove: function (evt) {
                    const pointer = evt.originalEvent;
                    const px = pointer && (pointer.clientX ?? (pointer.touches && pointer.touches[0] && pointer.touches[0].clientX));
                    const py = pointer && (pointer.clientY ?? (pointer.touches && pointer.touches[0] && pointer.touches[0].clientY));
                    if (typeof px === "number") updateDropPreview(px, py);
                    const target = evt.related;
                    if (target && target.classList.contains("planted-seed")) return false;
                    return true;
                },
                onAdd: function (evt) {
                    const clone = evt.item;
                    placePlant(clone, evt);
                    draggingSeed = false;
                    dropPreview.style.display = "none";
                }
            });

            function placePlant(plant, evt) {
                // place on the tile the seed was actually dropped on; fall back
                // to the first empty tile if the drop point is off-grid or taken
                const originalEvent = (evt && evt.originalEvent) || lastPointer;
                const cx = originalEvent && originalEvent.clientX;
                const cy = originalEvent && originalEvent.clientY;
                let tile = (typeof cx === "number" && typeof cy === "number") ? tileAt(cx, cy) : null;
                if (!tile || !tileIsFree(tile.row, tile.col)) {
                    tile = firstFreeTile();
                }
                if (!tile) {
                    plant.remove();
                    return;
                }

                plant.id = "plant-" + Date.now();
                plant.classList.remove("seed");
                plant.classList.remove("sortable-ghost", "sortable-chosen");
                plant.classList.add("planted-seed", "row-" + tile.row, "col-" + tile.col);
                plant.classList.remove("released"); void plant.offsetWidth; plant.classList.add("drop-pop");
                plant.style.gridRow = tile.row;
                plant.style.gridColumn = tile.col;
                plant.setAttribute("aria-label", "seed planted");

                const delay = Math.floor(Math.random() * 3 + 2);
                setTimeout(() => {
                    if (Math.random() >= 0.5) {
                        plant.innerHTML = WEED_SVG;
                        plant.classList.add("big", "weed");
                        plant._weedPulled = false;
                    } else {
                        plant.innerHTML = FLOWER_SVG;
                        plant.classList.add("flower");
                        checkWin();
                    }
                }, delay * 1000);
            }

            dragArea.addEventListener("click", event => {
                const plant = event.target.closest(".plant.weed");
                if (!plant || plant._weedPulled || victory) return;
                plant._weedPulled = true;
                plant.innerHTML = CHECK_SVG;
                plant.classList.remove("weed", "big");
                plant.classList.add("pulled");
                setTimeout(() => plant.remove(), 600);
            });

            function tileAt(clientX, clientY) {
                const rect = dragArea.getBoundingClientRect();
                if (!rect) return null;
                const localX = clientX - rect.left;
                const localY = clientY - rect.top;
                if (localX < 0 || localX > rect.width || localY < 0 || localY > rect.height) return null;
                const col = Math.min(2, Math.max(0, Math.floor(localX / (rect.width / 3))));
                const row = Math.min(2, Math.max(0, Math.floor(localY / (rect.height / 3))));
                return { row: row + 1, col: col + 1 };
            }

            function tileIsFree(row, col) {
                return dragArea.querySelectorAll(`.row-${row}.col-${col}`).length === 0;
            }

            function firstFreeTile() {
                for (let r = 1; r <= 3; r++) {
                    for (let c = 1; c <= 3; c++) {
                        if (tileIsFree(r, c)) return { row: r, col: c };
                    }
                }
                return null;
            }

            function checkWin() {
                const total = dragArea.querySelectorAll(".planted-seed").length;
                const flowers = dragArea.querySelectorAll(".flower").length;
                if (total >= 9 && flowers >= 9 && !victory) {
                    victory = true;
                    finish();
                }
            }

            function finish() {
                alertEl.innerHTML = `<span class="icon">${FLOWER_SVG}</span><br>The Garden is in bloom!<br>Every tile is tended.<br><div class="verse">"The Lord God took the man and put him in the Garden of Eden to work it and take care of it." — Genesis 2:15</div> <div class="goagain">Tend again <span class="icon">${SEED_SVG}</span></div>`;
                alertEl.classList.add("active");
                seedTray.option("disabled", true);
                grid.option("disabled", true);
                alertEl.querySelector(".goagain").addEventListener("click", reset);
                if (window.parent !== window) window.parent.postMessage({ type: "game-complete", game: "garde_game" }, "*");
            }

            function reset() {
                alertEl.classList.remove("active");
                alertEl.innerHTML = "";
                victory = false;
                dragArea.querySelectorAll(".planted-seed").forEach(plant => plant.remove());
                dropPreview.style.display = "none";
                seedTray.option("disabled", false);
                grid.option("disabled", false);
            }
        });
    </script>
</body>

</html>
