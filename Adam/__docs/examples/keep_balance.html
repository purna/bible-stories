<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Keep the Balance — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    :root{--ink:#3a2410;--good:#2e7d32;--bad:#c62828;--accent:#ffd84d;--bg:#fffaf0}
    html,body{width:100%;height:100%;overflow:hidden}
    body{font-family:'Comic Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center}
    .wrap{width:960px;max-width:92vw;height:540px;margin:0;padding:16px;text-align:center;flex:none;overflow:hidden;transform:scale(var(--game-scale,1));transform-origin:center}
    h1{font-size:1.6rem;margin:4px 0}
    .header{font-size:.9rem;opacity:.85;margin-bottom:12px;min-height:1.4em}
    .machines{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;height:172px}
    .meter{width:170px;height:172px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;position:relative;box-shadow:0 2px 6px #0001}
    .meter .name{font-size:1.1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px}
    .meter .name svg{width:24px;height:24px}
    .bar{height:34px;border:2px solid var(--ink);border-radius:8px;background:linear-gradient(90deg,#a8e6a3 0%,#a8e6a3 var(--pct,50%),#ffcdd2 var(--pct,50%),#ffcdd2 100%)}
    .meter.empty .bar{background:#ffcdd2}
    .count{position:absolute;top:-12px;right:-12px;min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:var(--accent);color:var(--ink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem}
    .tokens{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .token{width:84px;height:84px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:2.2rem;cursor:pointer;touch-action:none;transition:transform .14s,filter .14s}
    .token.claimed,.token.picked{transform:scale(1.08);filter:brightness(1.08)}
    .token.released,.meter.drop-pop{animation:releasePop .28s ease-out}
    .token svg{width:46px;height:46px}
    #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:1.2rem;font-weight:700;text-align:center;padding:24px}
    .btn{display:block;width:max-content;background:var(--good);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:12px 20px;font-size:1.1rem;cursor:pointer;margin:14px auto 0;transition:transform .12s,filter .12s}
    .btn:active{transform:scale(.92);filter:brightness(.9)}
    @keyframes releasePop{50%{transform:scale(1.1)}}
    .meter.drop-pop{animation:dropPop .32s ease-out}
    @keyframes dropPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Keep the Balance</h1>
    <div class="header" id="header"></div>
    <div class="machines" id="machines">
      <div class="meter" data-for="water" data-need="2">
        <div class="name"><svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 24c0-5 6-9 10-9s10 4 10 9v2a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4z" fill="#1a73e8"/></svg> Water</div>
        <div class="bar" style="--pct:50%"></div>
        <div class="count">0 / 2</div>
      </div>
      <div class="meter" data-for="fire" data-need="2">
        <div class="name"><svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 4c-5 6-8 11-8 16a8 8 0 0 0 16 0c0-5-3-10-8-16z" fill="#e65100"/><circle cx="16" cy="20" r="3" fill="#fff"/></svg> Fire</div>
        <div class="bar" style="--pct:50%"></div>
        <div class="count">0 / 2</div>
      </div>
      <div class="meter" data-for="food" data-need="2">
        <div class="name"><svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="16" cy="18" rx="9" ry="5" fill="#d4af37"/><path d="M8 14c2-3 6-4 8-4s6 1 8 4" stroke="#a8861d" stroke-width="1.5" fill="none"/></svg> Food</div>
        <div class="bar" style="--pct:50%"></div>
        <div class="count">0 / 2</div>
      </div>
    </div>
    <div class="tokens">
      <div class="token" data-helps="water" data-name="bucket"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="8" y="6" width="16" height="20" rx="4" fill="#1a73e8" stroke="#0d2b5a" stroke-width="2"/><path d="M11 26h10" stroke="#0d2b5a" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="token" data-helps="fire" data-name="wood"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="13" y="6" width="6" height="20" rx="3" fill="#8B4513"/><rect x="9" y="9" width="14" height="5" rx="2" fill="#8B4513"/></svg></div>
      <div class="token" data-helps="food" data-name="grain"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><ellipse cx="16" cy="18" rx="9" ry="5" fill="#d4af37"/><path d="M8 14c2-3 6-4 8-4s6 1 8 4" stroke="#a8861d" stroke-width="1.5" fill="none"/></svg></div>
    </div>
    <div id="msg"></div>
  </div>
  <script>
    function fitGameToViewport(){document.documentElement.style.setProperty('--game-scale',Math.min(innerWidth/960,innerHeight/540));}
    addEventListener('resize',fitGameToViewport); fitGameToViewport();

    const CHECK_SVG='<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 16.5l5.5 5.5L24 11" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>';

    const levels = [
      { target:'water', need:2, text:'Water is getting low — pour 2 buckets!' },
      { target:'fire', need:2, text:'The fire needs fuel — add 2 logs!' },
      { target:'food', need:2, text:'Share the food — place 2 bundles!' }
    ];
    let step = 0, done = 0, total = levels.length;
    let drops = { water:0, fire:0, food:0 };
    const msg = document.getElementById('msg');
    const header = document.getElementById('header');
    const tokenTray = document.querySelector('.tokens');

    addPressEffects('.token,.btn');
    function addPressEffects(selector){
      document.addEventListener('pointerdown',e=>{const el=e.target.closest(selector);if(el)el.classList.add('picked')});
      document.addEventListener('pointerup',e=>{const el=e.target.closest(selector);if(!el)return;el.classList.remove('picked');el.classList.remove('released');void el.offsetWidth;el.classList.add('released')});
    }

    function updateHeader(){
      const cur = levels[step];
      header.innerHTML = `${cur.text} <span style="opacity:.7">— Progress: ${done}/${total}</span>`;
    }

    // Tray of tokens: clone so we keep one to drag each round
    const traySort = new Sortable(tokenTray, {
      group: { name: 'care', pull: 'clone', put: false },
      draggable: '.token',
      sort: false,
      animation: 150,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      forceFallback: true,
      fallbackOnBody: true,
      fallbackTolerance: 3
    });

    function updateBars(){
      document.querySelectorAll('.meter').forEach(m=>{
        const key=m.dataset.for; const need=parseInt(m.dataset.need);
        const pct=Math.max(0,100-(drops[key]/need*100));
        m.querySelector('.count').textContent=`${drops[key]} / ${need}`;
        m.querySelector('.bar').style.setProperty('--pct', pct+'%');
        if(drops[key]>=need) m.classList.add('empty'); else m.classList.remove('empty');
      });
    }

    document.querySelectorAll('.meter').forEach(meter=>{
      new Sortable(meter, {
        group: 'care',
        draggable: '.tokens .token',
        sort: false,
        animation: 150,
        ghostClass: 'sortable-ghost',
        forceFallback: true,
        fallbackOnBody: true,
        fallbackTolerance: 3,
        onAdd: function (evt) {
          const clone = evt.item;
          const helps = clone.dataset.helps;
          const need = parseInt(meter.dataset.need);
          if (helps !== meter.dataset.for) {
            meter.style.outline = '3px solid var(--bad)';
            setTimeout(() => meter.style.outline = '', 600);
            clone.remove();
            return;
          }
          if (drops[helps] >= need) { clone.remove(); return; }
          drops[helps]++;
          clone.remove();
          meter.classList.remove('drop-pop'); void meter.offsetWidth; meter.classList.add('drop-pop');
          updateBars();
          updateHeader();
          if (drops[helps] >= need) {
            done++;
            traySort.option('disabled', true);
            setTimeout(() => {
              if (done >= total) { finish(); }
              else { traySort.option('disabled', false); setLevel(step + 1); }
            }, 800);
          }
        },
        onChoose: function (evt) { evt.item.classList.add('claimed'); },
        onUnchoose: function (evt) { evt.item.classList.remove('claimed'); }
      });
    });

    function setLevel(i){
      step = i;
      document.querySelectorAll('.meter').forEach(m => m.classList.remove('empty'));
      drops = { water:0, fire:0, food:0 };
      updateBars();
      document.querySelectorAll('.token').forEach(t => { t.style.opacity = 1; t.classList.remove('used'); });
      if (i < total - 1) {
        setTimeout(() => {
          document.querySelector(`[data-helps="${levels[i].target}"]`).style.opacity = '0.4';
        }, 1200);
      }
      updateHeader();
      header.style.color = 'var(--ink)';
    }

    function finish(){
      traySort.option('disabled', true);
      header.textContent = '';
      msg.innerHTML = `<span style="font-size:1.4rem">${CHECK_SVG}<br>All cared for!</span><br><span style="font-size:1.1rem">"The Lord bless you and keep you." — Numbers 6:24</span><div class="btn" id="restart">Care again</div>`;
      msg.style.display = 'flex';
      document.getElementById('restart').addEventListener('click', () => location.reload());
      if (window.parent !== window) window.parent.postMessage({ type: 'game-complete', game: 'keep_balance' }, '*');
    }

    setLevel(0);
  </script>
</body>
</html>
