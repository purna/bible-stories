<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Adam</title>
<!--
  SCENE DIRECTOR NOTES — Adam (Genesis 1–5)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. Formed from Dust
     The Lord forms the man from the dust of the ground and breathes life into his nostrils. Stage: a mound of dark soil under a first sunrise, the figure rising as breath enters; ochre earth, cool morning blue, the first ribs of light over a newborn world.

  2. The Garden
     God plants Eden in the east and sets the man among every tree pleasant to the eye, with the river dividing into four heads. Stage: a lush riverside garden, pomegranate and fig, gold and green; the man walking among the trees, lion and lamb at the water's edge; soft diffused light through leaves.

  3. Together
     The animals are brought to Adam for naming, and from his side God forms the woman. Stage: a shaded clearing at dusk, creatures gathering in pairs, the man reaching toward the new companion; rose-gold evening light, a sense of completion.

  4. The Boundary
     The man and woman dwell freely in the garden, permitted every fruit except the tree of the knowledge of good and evil. Stage: the garden's heart, one broad tree set apart in a circle of light; the couple walking away from it; abundance everywhere, one still point of restraint.

  5. The Choice
     The serpent, craftier than any beast, questions the command and the woman takes the fruit. Stage: the forbidden tree in shadow, a coiled serpent in the branches, the woman's hand reaching; dappled light turning colder, the first tension in an idyll.

  6. Hiding
     They hear the Lord walking in the garden at the cool of the day and hide among the trees. Stage: tall grasses and fig leaves at evening, two figures crouched, guilty and bare; a searching shaft of light moving through the grove.

  7. East of Eden
     The couple is sent from the garden; cherubim and a flaming sword guard the way to the tree of life. Stage: the garden gate at dawn behind them, a wall of flame and wings before it; the pair walking into a harsher, rockier land; silhouetted against a burning threshold.

  8. Cain and Abel
     The brothers bring offerings — the Lord respects Abel's flock and not Cain's produce, and anger smoulders. Stage: two altars on a bare hill, one heaped with grain, one with lamb's wool and fat; smoke rising, the brothers apart; a cold wind over stubble fields.

  9. The Field
     Cain rises against Abel in the field, and the blood cries from the ground. Stage: an isolated furrowed field under a heavy sky, a fallen figure and a stunned brother; crows gathering; the first murder in muted browns and grey light.

  10. A New Line
     Cain goes out as a wanderer, and Adam and Eve bear Seth to replace Abel; the line of faith begins. Stage: a tent by a river at dusk, a newborn child, Eve's quiet gratitude; distant hills, the first stars, a lamp in the doorway.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
