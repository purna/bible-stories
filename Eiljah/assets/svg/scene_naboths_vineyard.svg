<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Rich, sunny Jezreel valley sky gradient -->
        <linearGradient id="skyVineyard" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#4a90e2"/>
            <stop offset="40%" stop-color="#87b3f8"/>
            <stop offset="80%" stop-color="#f5d66c"/>
            <stop offset="100%" stop-color="#f7b733"/>
        </linearGradient>

        <!-- Vineyard terraced hillside gradient -->
        <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8fbc8f"/>
            <stop offset="50%" stop-color="#6b8e23"/>
            <stop offset="100%" stop-color="#4a5d23"/>
        </linearGradient>

        <!-- Ancient stone wall gradient -->
        <linearGradient id="stoneWall" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#a39171"/>
            <stop offset="100%" stop-color="#705f42"/>
        </linearGradient>

        <!-- Soft summer sun glow filter -->
        <filter id="vineyardGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Jezreel Sky -->
    <rect width="200" height="100" fill="url(#skyVineyard)"/>

    <!-- Bright Summer Sun -->
    <circle cx="160" cy="25" r="14" fill="#fffde7" opacity="0.9" filter="url(#vineyardGlow)"/>

    <!-- Distant Hills of Samaria / Jezreel -->
    <path d="M 0 70 L 60 55 L 120 65 L 180 50 L 200 55 L 200 100 L 0 100 Z" fill="#5c6f44" opacity="0.6"/>

    <!-- Terraced Vineyard Slopes (1 Kings 21:1 - Naboth's Vineyard near King Ahab's palace) -->
    <path d="M 0 75 Q 80 65 200 78 L 200 100 L 0 100 Z" fill="url(#hillGrad)"/>
    
    <!-- Stone retaining wall typical of ancient Israelite vineyards -->
    <rect x="40" y="72" width="120" height="6" fill="url(#stoneWall)"/>
    <rect x="20" y="86" width="140" height="5" fill="url(#stoneWall)"/>

    <!-- Grapevines / Trellises with Clusters of Grapes -->
    <g fill="#4a3b2c" stroke="#38291c" stroke-width="1.5">
        <!-- Vine posts and horizontal wires -->
        <line x1="50" y1="72" x2="50" y2="52"/>
        <line x1="90" y1="72" x2="90" y2="52"/>
        <line x1="130" y1="72" x2="130" y2="52"/>
        <line x1="40" y1="58" x2="140" y2="58"/>
    </g>

    <!-- Lush Vine Leaves & Grape Clusters -->
    <g filter="url(#vineyardGlow)">
        <!-- Vine Canopy Left -->
        <ellipse cx="50" cy="55" rx="14" ry="8" fill="#2e5a17"/>
        <circle cx="46" cy="62" r="3" fill="#6a1b9a"/>
        <circle cx="52" cy="63" r="3.5" fill="#6a1b9a"/>

        <!-- Vine Canopy Center -->
        <ellipse cx="90" cy="55" rx="16" ry="9" fill="#2e5a17"/>
        <circle cx="86" cy="63" r="3.5" fill="#6a1b9a"/>
        <circle cx="94" cy="62" r="3" fill="#6a1b9a"/>

        <!-- Vine Canopy Right -->
        <ellipse cx="130" cy="55" rx="15" ry="8.5" fill="#2e5a17"/>
        <circle cx="127" cy="63" r="3" fill="#6a1b9a"/>
        <circle cx="134" cy="62" r="3.5" fill="#6a1b9a"/>
    </g>

    <!-- Naboth Tending His Vineyard (1 Kings 21:2) -->
    <g transform="translate(95, 66)">
        <!-- Robe / Tunic -->
        <path d="M 10 16 Q 4 11 0 16 L 4 23 L 13 23 Z" fill="#795548"/>
        <path d="M 5 5 Q 9 0 13 5 Q 16 12 12 23 L 3 23 Q 0 12 5 5 Z" fill="#a1887f"/>
        <!-- Head and working posture -->
        <circle cx="8" cy="2" r="2.2" fill="#d1b399"/>
        <path d="M 7 4 L 3 12" stroke="#6d4c41" stroke-width="1.5" stroke-linecap="round"/>
    </g>
</svg>
