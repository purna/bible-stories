<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Golden late-afternoon riverside landscape gradient -->
        <linearGradient id="skyMantle" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#4a3b5c"/>
            <stop offset="40%" stop-color="#8c5862"/>
            <stop offset="80%" stop-color="#e07a5f"/>
            <stop offset="100%" stop-color="#f4a261"/>
        </linearGradient>

        <!-- Jordan river water gradient -->
        <linearGradient id="riverMantle" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b7a82"/>
            <stop offset="100%" stop-color="#18363a"/>
        </linearGradient>

        <!-- Prophetic mantle fabric gradient (Rich camel/brown wool) -->
        <linearGradient id="mantleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8d5b34"/>
            <stop offset="100%" stop-color="#4a2e18"/>
        </linearGradient>

        <!-- Soft divine grace / miracle glow filter -->
        <filter id="mantleGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Scenic Twilight Sky -->
    <rect width="200" height="100" fill="url(#skyMantle)"/>

    <!-- Setting Sun over River -->
    <circle cx="100" cy="50" r="16" fill="#ffe082" opacity="0.75" filter="url(#mantleGlow)"/>

    <!-- Riverbanks & Hills -->
    <path d="M 0 72 Q 50 65 100 70 T 200 68 L 200 100 L 0 100 Z" fill="#2d382e"/>

    <!-- The Jordan River Flowing across the foreground -->
    <path d="M 0 78 Q 100 70 200 82 L 200 100 L 0 100 Z" fill="url(#riverMantle)"/>
    <!-- River reflections / ripples -->
    <path d="M 30 85 Q 100 78 170 88" fill="none" stroke="#84ffff" stroke-width="1.2" opacity="0.6"/>

    <!-- Elijah's Fallen Mantle Floating / Lying near the Water (2 Kings 2:13) -->
    <g transform="translate(112, 74) rotate(-15)" filter="url(#mantleGlow)">
        <!-- Folded Fabric Shape -->
        <path d="M 0 0 Q 8 6 15 2 Q 22 -3 28 4 Q 18 14 5 10 Q -2 8 0 0 Z" fill="url(#mantleGrad)" stroke="#2b170a" stroke-width="0.8"/>
        <path d="M 4 3 Q 12 8 20 5" fill="none" stroke="#c49a6c" stroke-width="1" opacity="0.8"/>
    </g>

    <!-- Elisha Reaching Down to Pick Up the Mantle -->
    <g transform="translate(75, 54)">
        <!-- Seated / Kneeling Robe -->
        <path d="M 12 18 Q 6 13 2 18 L 6 26 L 16 26 Z" fill="#1a237e"/>
        <path d="M 6 7 Q 10 2 14 7 Q 18 15 14 26 L 4 26 Q 0 15 6 7 Z" fill="#283593"/>
        <!-- Head and hands reaching down toward ground/mantle -->
        <circle cx="9" cy="4" r="2.3" fill="#d1b399"/>
        <path d="M 8 2 L 15 15" stroke="#d1b399" stroke-width="1.3" stroke-linecap="round"/>
    </g>
</svg>
