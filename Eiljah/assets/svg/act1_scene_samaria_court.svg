<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Regal Samaria palace interior / throne room lighting gradient -->
        <linearGradient id="palaceInterior" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#4a3b5c"/>
            <stop offset="40%" stop-color="#6b527a"/>
            <stop offset="80%" stop-color="#3d2b45"/>
            <stop offset="100%" stop-color="#1f1424"/>
        </linearGradient>

        <!-- Golden throne gradient -->
        <linearGradient id="goldThrone" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe082"/>
            <stop offset="50%" stop-color="#ffb300"/>
            <stop offset="100%" stop-color="#f57c00"/>
        </linearGradient>

        <!-- Floor marble gradient -->
        <linearGradient id="palaceFloor" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2d2235"/>
            <stop offset="100%" stop-color="#120c17"/>
        </linearGradient>

        <!-- Torch or ambient glow filter -->
        <filter id="courtGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Palace Throne Room Background -->
    <rect width="200" height="100" fill="url(#palaceInterior)"/>

    <!-- Architectural Stone Pillars of Samaria Palace -->
    <rect x="15" y="0" width="16" height="85" fill="#2d2235" stroke="#1f1424" stroke-width="1"/>
    <rect x="169" y="0" width="16" height="85" fill="#2d2235" stroke="#1f1424" stroke-width="1"/>
    <!-- Pillar capitals -->
    <rect x="12" y="0" width="22" height="6" fill="#5c436b"/>
    <rect x="166" y="0" width="22" height="6" fill="#5c436b"/>

    <!-- Polished Marble Floor -->
    <rect x="0" y="82" width="200" height="18" fill="url(#palaceFloor)"/>
    <!-- Floor perspective lines -->
    <line x1="0" y1="82" x2="60" y2="100" stroke="#3d2b45" stroke-width="1.5"/>
    <line x1="200" y1="82" x2="140" y2="100" stroke="#3d2b45" stroke-width="1.5"/>

    <!-- King Ahab's Grand Throne (Center-Right background) -->
    <g transform="translate(130, 42)">
        <!-- Throne Backrest -->
        <rect x="0" y="0" width="28" height="42" fill="url(#goldThrone)" rx="3"/>
        <path d="M 14 -8 Q 22 -15 28 0 Z" fill="#ff8f00"/>
        <!-- Seat Base -->
        <rect x="-4" y="34" width="36" height="8" fill="#e65100"/>
        <!-- Armrests -->
        <rect x="-4" y="20" width="6" height="16" fill="#ffb300"/>
    </g>

    <!-- King Ahab Seated on the Throne (Wearing royal robes and crown) -->
    <g transform="translate(134, 52)">
        <!-- Royal Garment (Purple/Crimson) -->
        <path d="M 10 16 Q 4 11 0 16 L 4 28 L 16 28 Z" fill="#4a148c"/>
        <path d="M 4 5 Q 9 0 14 5 Q 18 13 14 28 L 2 28 Q -2 13 4 5 Z" fill="#7b1fa2"/>
        <!-- Crown and Head -->
        <circle cx="9" cy="2" r="2.3" fill="#d1b399"/>
        <path d="M 6 -1 L 12 -1 L 11 -3 L 9 -2 L 7 -3 Z" fill="#ffb300"/>
    </g>

    <!-- Elijah Confronting Ahab in Court (1 Kings 21:17-20 - "Have you found me, O my enemy?") -->
    <g transform="translate(65, 54)">
        <!-- Prophet's Rough Mantle / Robe -->
        <path d="M 10 18 Q 4 12 0 18 L 4 28 L 14 28 Z" fill="#3e2723"/>
        <path d="M 5 6 Q 9 0 13 6 Q 17 14 13 28 L 3 28 Q 0 14 5 6 Z" fill="#5c3a21"/>
        <!-- Head and authoritative pointing gesture -->
        <circle cx="8" cy="3" r="2.3" fill="#d1b399"/>
        <path d="M 7 1 L 14 -2" stroke="#d1b399" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Ambient Torch Light on Pillar -->
    <circle cx="31" cy="40" r="8" fill="#ffb703" opacity="0.6" filter="url(#courtGlow)"/>
    <circle cx="31" cy="40" r="3" fill="#fff"/>
</svg>
