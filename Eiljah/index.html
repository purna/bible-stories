<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Book of Elijah - An interactive comic book experience. Read offline with our PWA service worker!">
    <meta name="theme-color" content="#e94560">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Elijah — Interactive Comic</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/story-runtime.css">
    <link rel="stylesheet" href="css/loading-screen.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/elijah-comic.css">
    <link rel="stylesheet" href="css/info-modal.css">
    <script src="vendor/gsap.3.12.5.min.js"></script>
  </head>

<body>
  <div id="startScreen">
    <div class="comic-cover">
      <span data-follow="8" style="top:8%;left:12%;"></span>
      <span data-follow="14" style="top:12%;right:14%;"></span>
      <span data-follow="10" style="bottom:14%;left:16%;"></span>
      <span data-follow="18" style="bottom:10%;right:10%;"></span>
      <div class="issue">SPECIAL EDITION #1</div>
      <h1>ELIJAH</h1>
      <div class="subtitle">& THE STILL, SMALL VOICE</div>
      <div class="bigicon"><svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></svg></div>
      <p>An interactive story! Navigate using arrows, swipes, or scroll.</p>
      <button id="startBtn">LAUNCH COMIC</button>
    </div>
  </div>

  <div id="app">
    <div id="bgGradient"></div>
    <canvas id="particles"></canvas>
    <div id="halftoneOverlay"></div>

    <div id="hud">
      <select id="chapterSelect"></select>
      <div id="dots"></div>
    </div>

    <div id="stageWrap">
      <div id="stage"></div>
    </div>

    <div id="choices"></div>
    <div id="delayNote"></div>

    <div id="navHints">
      <span>◀ Use Left/Right Arrow keys or swipe ▶</span>
      <span>· ↓ Scroll down at line end to drop into next chapter ·</span>
    </div>
    <button id="audioToggle" type="button" title="Turn audio off" aria-label="Turn audio off"></button>
    <button id="nextBtn">Next Chapter ↴</button>
    <button id="nextLineBtn">Next →</button>
  </div>

  <div id="portal"></div>

  <footer class="tools-footer" aria-label="Story creation tools">
    <span>Create assets</span>
    <a href="tools/texture-forge.html">Texture Forge</a>
    <a href="tools/character_head_generator.html">Character Generator</a>
  </footer>

  <script src="js/asset-download-manager.js"></script>
  <script src="js/story-runtime.js"></script>
  <script src="js/loading-screen.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/info-modal.js"></script>
  <script src="js/elijah-comic.js" defer></script>
  <script>
    window.addEventListener('load', async () => {
      try {
        await screen.orientation?.lock?.('landscape');
      } catch {
        // Orientation locking may be unavailable outside an installed PWA or fullscreen mode.
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const registerStoryWorker = () => navigator.serviceWorker.register('js/sw.js');
        if (window.__storyAssetsReady) registerStoryWorker();
        else window.addEventListener('story:assetsready', registerStoryWorker, { once: true });
      });
    }
  </script>

  <script>
    /* follow.js — lightweight cursor-follow accent dots on the start screen.
       No external dependency: a 60-line inline implementation that mirrors
       the jwanner83/follow-js API (data-follow attribute + factor). */
    (function () {
      'use strict';
      const FOLLOW_FACTOR_DEFAULT = 12;
      const FOLLOW_SMOOTH = 0.18;
      const elements = [];
      let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      let target = { x: mouse.x, y: mouse.y };

      function parseFactor(el) {
        const v = el.getAttribute('data-follow');
        if (v === null || v === '' || v === 'true') return FOLLOW_FACTOR_DEFAULT;
        const n = parseFloat(v);
        return Number.isFinite(n) ? n : FOLLOW_FACTOR_DEFAULT;
      }

      function refresh() {
        elements.length = 0;
        document.querySelectorAll('[data-follow]').forEach(el => {
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          elements.push({ el, cx, cy, factor: parseFactor(el) });
        });
      }

      window.addEventListener('mousemove', e => {
        target.x = e.clientX;
        target.y = e.clientY;
      }, { passive: true });
      window.addEventListener('touchmove', e => {
        if (e.touches[0]) { target.x = e.touches[0].clientX; target.y = e.touches[0].clientY; }
      }, { passive: true });

      function tick() {
        mouse.x += (target.x - mouse.x) * FOLLOW_SMOOTH;
        mouse.y += (target.y - mouse.y) * FOLLOW_SMOOTH;
        for (const item of elements) {
          const dx = mouse.x - item.cx;
          const dy = mouse.y - item.cy;
          const f = item.factor / 100;
          item.el.style.transform = 'translate(' + (dx * f).toFixed(2) + 'px, ' + (dy * f).toFixed(2) + 'px)';
        }
        requestAnimationFrame(tick);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => { refresh(); tick(); });
      } else { refresh(); tick(); }
      window.addEventListener('resize', refresh);
      window.Follow = { refresh, destroy: () => elements.length = 0 };
    })();
  </script>
</body>

</html>
