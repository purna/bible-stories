  SCENE DIRECTOR NOTES — David (1 Samuel 16 – 1 Kings 2)
  12 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. Anointed
     Samuel anoints the youngest son of Jesse, a shepherd boy of Bethlehem, while his elder brothers watch in surprise. Stage: a Bethlehem hillside at golden hour, sheep around, oil poured on a ruddy boy's head; a horn of oil, distant town rooftops; warm ochre light.

  2. Goliath
     The Philistine giant struts between the armies; David refuses Saul's armour and steps out with staff, sling and five stones. Stage: the Valley of Elah, two armies on facing ridges, a nine-foot figure in bronze scale, a boy walking steadily toward him; dry heat, dust, a streambed glittering.

  3. Saul’s Court
     David plays the lyre for Saul, and the king's torment eases while his jealousy stirs. Stage: a dim throne room at night, a boy with a harp, the king looming on a chair, a spear at his belt; firelight flickering on stone; tension beneath the melody.

  4. Covenant Friends
     Jonathan and David make a covenant, exchanging tokens — the robe, tunic, sword, bow and belt. Stage: a field outside the camp at dawn, two young men kneeling, a prince's robe passing to the shepherd; parted friends on a rising road; pale morning gold.

  5. The Wilderness
     David hides in the wilderness of En Gedi, and when Saul comes to relieve himself in a cave, David cuts off the hem of his robe and refuses to strike. Stage: a sun-baked cliff with dark cave mouths, sheep, a hidden figure watching the king pass; craggy grey-gold rock, shimmering heat.

  6. Abigail
     Abigail rides out with provisions to meet David before Nabal's foolishness becomes bloodshed, and she speaks peace. Stage: a donkey train descending a dry ravine at noon, a wise woman carrying loaves and wine, David's band armed on the ridge; terracotta, dust, and a tense standoff turning to grace.

  7. The Throne
     David is anointed king over all Israel at Hebron and takes Jerusalem, the city of Jebus, for his capital. Stage: a water shaft climbing to the city gate, warriors ascending, the king on a throne of stone on the citadel; olive hills, bronze light, banners.

  8. Bathsheba and Uriah
     From his roof David sees Bathsheba bathing; the deed that follows brings Uriah to the front line and judgment on the house. Stage: a royal rooftop at evening, a distant figure at her bath below, a sealed letter passing between hands; purple dusk, a heavy stillness.

  9. Nathan’s Parable
     The prophet Nathan tells the rich man with many sheep who takes the poor man's one ewe lamb — and David condemns himself. Stage: a candlelit chamber, the prophet with a staff, the king listening; two flocks in the background, one rich, one poor; a single lamp and a long silence.

  10. Absalom
     Absalom's long hair catches in the branches of a great tree as his rebellion breaks in the forest of Ephraim; Joab strikes him down. Stage: a dense oak wood in rain, a royal mule at bay, tangled hair in the branches, a spear flash; cold green light, the king waiting on the road.

  11. The Census
     David counts the people and repents; the prophet Gad offers three choices, and a plague stalks Israel until the threshing floor of Araunah. Stage: a nation of tents under a wasting sky, a king on his rooftop in grief, an altar rising on a purchased threshing floor; grey light breaking warm.

  12. Solomon
     David charges Solomon to build the house of the Lord and walks in wisdom; the old king dies and the son reigns. Stage: Jerusalem's hill with a temple site marked out, father and son on a terrace, the kingdom passing; cedar light, a quiet benediction.
  -->
