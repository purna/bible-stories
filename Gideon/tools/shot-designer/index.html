<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Gideon</title>
<!--
  SCENE DIRECTOR NOTES — Gideon (Judges 6–8)
  7 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Winepress
     Gideon threshes wheat in a winepress to hide it from Midian, and the angel of the Lord appears under the oak at Ophrah. Stage: a hidden winepress in a vineyard at dawn, a man beating wheat, a figure in shining raiment beneath the oak; dust, shadow, and the first gleam of the divine messenger.

  2. The Sign
     Gideon prepares a young goat and unleavened cakes; fire consumes the offering on the rock and the angel vanishes. Stage: a rock at the oak's shade, a meat offering on a stone, a flame rising from it; the terrified Gideon; the morning lit by one sudden fire.

  3. The Fleece
     Gideon lays a wool fleece on the threshing floor: dew on the fleece alone, then dry fleece on wet ground. Stage: a threshing floor at dawn, a single fleece glistening with dew, the ground around it parched; silence, patience, and a second night reversed.

  4. The Army Reduced
     Thirty-two thousand men drink at the spring; those who lap like dogs are three hundred, and God reduces the army to them. Stage: a stream at a desert spring, an army kneeling, the water glinting; three hundred hands cupping the water; morning light on a thinning host.

  5. The Dream
     Gideon creeps to the Midianite camp with Purah and hears a dream: a barley cake rolls into the camp and flattens a tent. Stage: a vast night camp of countless fires, the men moving between tents, a dreamer and his companion; starlight and firelight, a murmuring army.

  6. The Battle
     The three hundred shatter jars, light torches, blow trumpets, and shout for the Lord and for Gideon; the host turns on itself. Stage: the midnight camp erupting in flame and trumpet, torchlight sweeping the tents, panic in the dark; the valley blazing like a battlefield of light.

  7. The Victory
     The Midianite kings are pursued to Karkor and captured, and Israel is freed for forty years; Gideon refuses the crown. Stage: a desert ford at dawn, the kings in purple caught by the river, the exhausted army triumphant; a man refusing a crown; long light over a quiet land.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
