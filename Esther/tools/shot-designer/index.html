<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Esther</title>
<!--
  SCENE DIRECTOR NOTES — Esther (Esther 1–9)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Banquet
     King Ahasuerus feasts in Susa for a hundred and eighty days, and Queen Vashti refuses his summons. Stage: a Persian palace hall with blue and gold glazed bricks, a thousand couches, wine; the queen withdrawing from the far doorway; torchlight and marble.

  2. A New Queen
     Esther, a Jewish orphan in the care of Mordecai, is taken to the king and wins the crown. Stage: a harem court at dawn, young women in myrrh and perfumes, Esther stepping forward; a crown lifted; rose and gold light.

  3. The Gate Plot
     Mordecai overhears two eunuchs plotting against the king and saves him; the deed is written in the royal record. Stage: the king's gate at midday, a figure in the shadow of a column, scribes at work; a whispered warning; a narrow, tense street.

  4. Haman's Decree
     Haman the Agagite persuades the king to destroy the Jews; the decree rides out to every province. Stage: a great hall, Haman in high honour, the sealed parchment on a table; couriers galloping past a map of the empire; cold shadow and a rising drum of hoofbeats.

  5. For Such a Time
     Mordecai's plea comes to Esther: relief will come from another quarter — and who knows but you have come to the kingdom for such a time? Stage: a courtyard with a purple canopy, Mordecai in sackcloth beyond the gate, Esther in the doorway weighing her life; midday stillness.

  6. The First Banquet
     Esther invites the king and Haman to a banquet and asks them to return the next night — her request still unspoken. Stage: a banquet table in a shaded colonnade, the king with his ring, Haman swollen with pride, the queen veiled and composed; evening lamplight.

  7. The Sleepless Night
     The king cannot sleep, and the record of Mordecai's saved life is read aloud — the night turns. Stage: a sleepless king in a dim throne room, a scribe reading the chronicle; a rooster crowing in the dark; a single lamp turning the room.

  8. The Second Banquet
     Esther names her people and her enemy; Haman pleads on the couch and is hanged on the gallows he built for Mordecai. Stage: the banquet hall again, the queen risen, the king's face in shadow, Haman dragged from the couch; a garden visible through the columns, a gallows in the dark beyond.

  9. A New Decree
     The king gives Haman's house to Esther and Mordecai, and a new decree lets the Jews defend themselves. Stage: the royal gate at dawn, a new seal on a fresh scroll, riders lining up; light breaking over the city; a relieved crowd at the gates.

  10. Purim
     The Jews feast and send gifts, and the days of Purim are fixed — a feast of reversal. Stage: a city street in festival light, tables of food, children in costume, a scroll unrolled; warm lanterns, the sound of celebration.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
