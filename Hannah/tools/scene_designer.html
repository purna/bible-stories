  SCENE DIRECTOR NOTES — Hannah (1 Samuel 1–2)
  8 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Journey to Shiloh
     Elkanah's household travels the annual road to worship at Shiloh, where the ark and Eli's sons keep the tabernacle. Stage: a hill country road at dawn, a family with donkeys and provisions, the tabernacle rising on the horizon; morning light, the sound of a travelling household.

  2. At the Table
     At the feast Elkanah gives Hannah a double portion, while Peninnah provokes her for her barrenness. Stage: a long table in the temple court, food and drink, two wives opposite each other; a double portion of meat, a heavy silence; firelight and grief.

  3. Silent Prayer
     Hannah prays without a sound, lips moving only; the vow: a son given back to the Lord. Stage: the tabernacle interior at twilight, a woman kneeling by a post, a lamp between the holy place and the door; the first candle in the dark; no sound in the frame.

  4. Misunderstood
     Eli watches her and thinks she is drunk; she answers, 'No, my lord, I am a woman troubled in spirit.' Stage: the old priest at the entrance, hand on the doorpost, the woman defending her prayer; a narrow doorway, lamplight on two faces.

  5. Remembered
     The family returns home, and Hannah's prayer is remembered; a child is conceived. Stage: a house in the hill country at sunrise, a doorway, a hopeful morning; the road behind and the road ahead; a quiet room being prepared.

  6. The Little Robe
     Each year Hannah weaves a little robe and brings it to Samuel at Shiloh as he grows in the Lord's presence. Stage: a loom at work, a tiny linen robe, the boy in a linen ephod at the tabernacle door; a mother's hands, a child's growing frame; warm, domestic light.

  7. Given Back
     Hannah and Elkanah bring the weaned child to the temple and lend him to the Lord for life. Stage: the tabernacle courtyard at midday, the small boy with his mother, Eli receiving him; a child walking into the holy shadow; a vow made visible.

  8. Hannah’s Song
     Hannah sings: the Lord makes poor and makes rich, brings low and lifts up; the Lord's anointed will be exalted. Stage: a woman standing in the temple court, arms lifted, the ark behind her; light on the courtyard stones; a song rising with the morning.
