<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Noah</title>
<!--
  SCENE DIRECTOR NOTES — Noah (Genesis 6–9)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Warning
     The Lord warns Noah of the coming flood, and he is told to make an ark of gopher wood, for the earth is filled with violence. Stage: a plain at dusk, a man listening to a voice, the world behind him darkening, the first rain cloud on the horizon; a lone figure in a field.

  2. The Blueprint
     The ark is to be three hundred cubits long, fifty wide, and thirty high, with a roof, a door, and three decks. Stage: a man marking out the great hull with a line and a cubit rod, the shape of the ark in the dust; the light of a late afternoon on a plan of wood.

  3. The Long Build
     Noah and his sons gather timber, fit planks, and seal them with pitch, and the work goes on for a hundred and twenty years. Stage: a hillside workshop through the seasons, a hull rising, a family at work, the neighbours watching and mocking; a long, patient, quiet labour.

  4. The Gathering
     The animals come to Noah two by two, clean and unclean, and he brings them into the ark. Stage: the ark door at dawn, a line of creatures coming up the ramp, birds and beasts, a man and his sons guiding them; the world's parade, arriving.

  5. The Door Shuts
     The Lord shuts the door of the ark, and the fountains of the deep break up, and the windows of heaven are opened. Stage: the great door closing in a darkening sky, a family inside, the first rain beginning; a world shut in, a world washed out.

  6. Forty Days
     The rain falls forty days and forty nights, and the waters rise, and the ark floats on the face of the waters. Stage: the ark in a great sea of rain, the water over the hills, the animals in the dark below; a world of water, the rain never stopping, a lamp in the hold.

  7. The Long Wait
     Noah sends out a raven, then a dove; the dove returns with an olive leaf, and the waters are drying. Stage: the ark on a quiet sea at dawn, a dove returning to the window, a branch of olive in its beak; the first sign of the world coming back.

  8. Dry Ground
     The ark rests on the mountains of Ararat, and Noah opens the window and looks out on the new earth. Stage: a mountain peak at sunrise, the ark resting on the rock, the water gone from the valleys; a man stepping out onto the wet ground, the first day.

  9. The Covenant
     Noah builds an altar, offers burnt offerings, and the Lord sets the rainbow in the cloud as a sign of the covenant. Stage: an altar of stone on a mountain, the smoke rising, the sky clearing, a rainbow across the whole earth; a promise being made in colour and light.

  10. The Vineyard
     Noah plants a vineyard, drinks the wine, and is uncovered in his tent; Ham sees, Shem and Japheth cover him. Stage: a vineyard in the afternoon, a man resting in a tent, a son coming in with a garment, the father's shame and blessing; the first vineyard, the first family, the first sorrow.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
