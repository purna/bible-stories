<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Book of Noah — An interactive 10-chapter comic about the Ark, the Flood, and the Rainbow Covenant. Read offline with our PWA service worker!">
    <meta name="theme-color" content="#e94560">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>NOAH! — An Interactive Comic Book</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/story-runtime.css">
    <link rel="stylesheet" href="css/loading-screen.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/noah-comic.css">
    <link rel="stylesheet" href="css/info-modal.css">
</head>
<body>

  <!-- ── Start / Cover Screen ──────────────────────────────── -->
  <div id="startScreen">
    <div class="comic-cover">
      <span data-follow="8" style="top:8%;left:12%;"></span>
      <span data-follow="14" style="top:12%;right:14%;"></span>
      <span data-follow="10" style="bottom:14%;left:16%;"></span>
      <span data-follow="18" style="bottom:10%;right:10%;"></span>
      <div class="issue">GENESIS · SPECIAL EDITION</div>
      <h1>NOAH!</h1>
      <div class="subtitle">The Ark, The Flood &amp; The Covenant</div>
      <div class="bigark">🚢</div>
      <p>An interactive 10-chapter comic. Use arrow keys, swipe, or tap Next to navigate.</p>
      <button id="startBtn">OPEN THE ARK</button>
    </div>
  </div>

  <!-- ── App Shell ─────────────────────────────────────────── -->
  <div id="app">

    <!-- background gradient layer -->
    <div id="bgGradient"></div>

    <!-- particle canvas -->
    <canvas id="particles"></canvas>

    <!-- rain / flood / storm animated layer -->
    <div id="rainLayer">
      <div id="rainStripes"></div>
      <div class="wave-container">
        <div class="air air1"></div>
        <div class="air air2"></div>
        <div class="air air3"></div>
        <div class="air air4"></div>
      </div>
    </div>

    <!-- ambient layer: doves, rainbow arc (post-flood + covenant) -->
    <div id="ambientLayer">
      <div class="rainbow-arc"></div>
      <div class="dove-container">
        <div class="dove-fly"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h.01"/><path d="M4 14c2-2 4-4 6-4s3 2 5 2 4-2 6-4"/><path d="M16 14l-4 3-4-3"/><path d="M20 10l-4 6-4-6"/></svg></div>
        <div class="dove-fly"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h.01"/><path d="M4 14c2-2 4-4 6-4s3 2 5 2 4-2 6-4"/><path d="M16 14l-4 3-4-3"/><path d="M20 10l-4 6-4-6"/></svg></div>
        <div class="dove-fly"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h.01"/><path d="M4 14c2-2 4-4 6-4s3 2 5 2 4-2 6-4"/><path d="M16 14l-4 3-4-3"/><path d="M20 10l-4 6-4-6"/></svg></div>
      </div>
    </div>

    <!-- halftone comic dot overlay -->
    <div id="halftoneOverlay"></div>

    <!-- HUD: chapter select + dot progress -->
    <div id="hud">
      <select id="chapterSelect" aria-label="Jump to chapter"></select>
      <div id="dots" role="list" aria-label="Progress"></div>
    </div>

    <!-- main comic panel stage -->
    <div id="stageWrap">
      <div id="stage"></div>
    </div>

    <!-- choice buttons -->
    <div id="choices" role="group" aria-label="Choices"></div>

    <!-- consequence / note display -->
    <div id="delayNote" role="status"></div>

    <!-- navigation hints -->
    <div id="navHints">
      <span>◀ Arrow keys or swipe to navigate ▶</span>
      <span>· ↓ Arrow Down to next chapter ·</span>
    </div>

  <!-- chapter-end button -->
    <button id="audioToggle" type="button" title="Turn audio off" aria-label="Turn audio off"></button>
    <button id="nextBtn" aria-label="Next chapter">Next Chapter ↴</button>

    <!-- line-advance button -->
    <button id="nextLineBtn" aria-label="Next line">Next →</button>

  </div>

  <!-- portal iris transition overlay -->
  <div id="portal"></div>

  <footer class="tools-footer" aria-label="Story creation tools">
    <span>Create assets</span>
    <a href="tools/texture-forge.html">Texture Forge</a>
    <a href="tools/character_head_generator.html">Character Generator</a>
    <a href="tools/animal_pair_generator.html">Animal Pair Generator</a>
  </footer>

  <script src="js/asset-download-manager.js"></script>
  <script src="js/story-runtime.js"></script>
  <script src="js/loading-screen.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/info-modal.js"></script>
  <script src="js/noah-story.js"></script>
  <script>
    window.addEventListener('load', async () => {
      try {
        await screen.orientation?.lock?.('landscape');
      } catch {
        // Orientation locking may be unavailable outside an installed PWA or fullscreen mode.
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const registerStoryWorker = () => navigator.serviceWorker.register('js/sw.js');
        if (window.__storyAssetsReady) registerStoryWorker();
        else window.addEventListener('story:assetsready', registerStoryWorker, { once: true });
      });
    }
  </script>

  <script>
    /* follow.js — lightweight cursor-follow accent dots on the start screen.
       No external dependency: a 60-line inline implementation that mirrors
       the jwanner83/follow-js API (data-follow attribute + factor). */
    (function () {
      'use strict';
      const FOLLOW_FACTOR_DEFAULT = 12;
      const FOLLOW_SMOOTH = 0.18;
      const elements = [];
      let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      let target = { x: mouse.x, y: mouse.y };

      function parseFactor(el) {
        const v = el.getAttribute('data-follow');
        if (v === null || v === '' || v === 'true') return FOLLOW_FACTOR_DEFAULT;
        const n = parseFloat(v);
        return Number.isFinite(n) ? n : FOLLOW_FACTOR_DEFAULT;
      }

      function refresh() {
        elements.length = 0;
        document.querySelectorAll('[data-follow]').forEach(el => {
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          elements.push({ el, cx, cy, factor: parseFactor(el) });
        });
      }

      window.addEventListener('mousemove', e => {
        target.x = e.clientX;
        target.y = e.clientY;
      }, { passive: true });
      window.addEventListener('touchmove', e => {
        if (e.touches[0]) { target.x = e.touches[0].clientX; target.y = e.touches[0].clientY; }
      }, { passive: true });

      function tick() {
        mouse.x += (target.x - mouse.x) * FOLLOW_SMOOTH;
        mouse.y += (target.y - mouse.y) * FOLLOW_SMOOTH;
        for (const item of elements) {
          const dx = mouse.x - item.cx;
          const dy = mouse.y - item.cy;
          const f = item.factor / 100;
          item.el.style.transform = 'translate(' + (dx * f).toFixed(2) + 'px, ' + (dy * f).toFixed(2) + 'px)';
        }
        requestAnimationFrame(tick);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => { refresh(); tick(); });
      } else { refresh(); tick(); }
      window.addEventListener('resize', refresh);
      window.Follow = { refresh, destroy: () => elements.length = 0 };
    })();
  </script>
</body>
</html>
