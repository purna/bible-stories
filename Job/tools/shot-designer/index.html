<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Job</title>
<!--
  SCENE DIRECTOR NOTES — Job (Job 1–42)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. A Blameless Life
     Job is blameless and upright, with seven sons, three daughters, and great flocks; he offers burnt offerings for his children. Stage: a rich household at sunrise in the land of Uz, sheep and camels and tents, a father praying for his children; a golden, ordered world.

  2. The Accuser
     In the heavenly court the Lord asks Satan about Job; the adversary asks for permission to test him, and the hand of loss begins. Stage: a cosmic court, a throne of light and a figure in shadow, the earth in miniature below; a single day that will undo everything.

  3. Loss upon Loss
     The messengers come one after another: the oxen, the donkeys, the fire, the wind — and the children. Stage: a ruined threshold at dusk, one messenger after another arriving, a great house going silent; a single figure on the ground, the sky empty of birds.

  4. Seven Days
     Job's three friends sit with him seven days and nights, and no one speaks, for his grief is very great. Stage: a heap of ashes outside a city, four figures seated in silence, the sun crossing the sky above them; a week measured in light and shadow.

  5. Job Speaks
     Job opens his mouth and curses the day of his birth, and calls for the grave to come. Stage: a man on a dunghill at midnight, his body scarred, the first words of a long lament; the stars wheeling overhead; a voice rising into the dark.

  6. The Friends
     Eliphaz, Bildad and Zophar argue: the righteous prosper, the wicked fall — therefore repent, Job. Stage: a desert camp at dawn, three men in flowing robes, a fourth in ashes, the argument turning from comfort to accusation; wind, dust, long shadows.

  7. Elihu
     The young Elihu burns with anger at Job's self-justification and the friends' failure; he speaks of God speaking in dreams and in pain. Stage: a circle of listeners at noon, a young man rising, his cloak bright with indignation; the older men stilled; a still, hot air.

  8. Out of the Whirlwind
     The Lord answers Job out of the whirlwind: where were you when I laid the earth's foundation? Stage: a storm on the horizon, a whirlwind forming, a figure in the dark at its centre; the heavens opening, the earth trembling; a question no one can answer.

  9. Job Responds
     Job answers the Lord: I had heard of you by the hearing of the ear, but now my eye sees you; therefore I repent in dust and ashes. Stage: a man kneeling as the storm breaks, his hand over his mouth, the whirlwind withdrawing; the first rain in years; a quiet, broken peace.

  10. Restoration
     The Lord restores Job's fortunes twofold: flocks, children, daughters of beauty, and a long life. Stage: a household again, tents full of children, camels in the shade, a new generation at the door; evening light and music; a table set for a feast.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
