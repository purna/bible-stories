<!--
  SCENE DIRECTOR NOTES — Job (Job 1–42)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. A Blameless Life
     Job is blameless and upright, with seven sons, three daughters, and great flocks; he offers burnt offerings for his children. Stage: a rich household at sunrise in the land of Uz, sheep and camels and tents, a father praying for his children; a golden, ordered world.

  2. The Accuser
     In the heavenly court the Lord asks Satan about Job; the adversary asks for permission to test him, and the hand of loss begins. Stage: a cosmic court, a throne of light and a figure in shadow, the earth in miniature below; a single day that will undo everything.

  3. Loss upon Loss
     The messengers come one after another: the oxen, the donkeys, the fire, the wind — and the children. Stage: a ruined threshold at dusk, one messenger after another arriving, a great house going silent; a single figure on the ground, the sky empty of birds.

  4. Seven Days
     Job's three friends sit with him seven days and nights, and no one speaks, for his grief is very great. Stage: a heap of ashes outside a city, four figures seated in silence, the sun crossing the sky above them; a week measured in light and shadow.

  5. Job Speaks
     Job opens his mouth and curses the day of his birth, and calls for the grave to come. Stage: a man on a dunghill at midnight, his body scarred, the first words of a long lament; the stars wheeling overhead; a voice rising into the dark.

  6. The Friends
     Eliphaz, Bildad and Zophar argue: the righteous prosper, the wicked fall — therefore repent, Job. Stage: a desert camp at dawn, three men in flowing robes, a fourth in ashes, the argument turning from comfort to accusation; wind, dust, long shadows.

  7. Elihu
     The young Elihu burns with anger at Job's self-justification and the friends' failure; he speaks of God speaking in dreams and in pain. Stage: a circle of listeners at noon, a young man rising, his cloak bright with indignation; the older men stilled; a still, hot air.

  8. Out of the Whirlwind
     The Lord answers Job out of the whirlwind: where were you when I laid the earth's foundation? Stage: a storm on the horizon, a whirlwind forming, a figure in the dark at its centre; the heavens opening, the earth trembling; a question no one can answer.

  9. Job Responds
     Job answers the Lord: I had heard of you by the hearing of the ear, but now my eye sees you; therefore I repent in dust and ashes. Stage: a man kneeling as the storm breaks, his hand over his mouth, the whirlwind withdrawing; the first rain in years; a quiet, broken peace.

  10. Restoration
     The Lord restores Job's fortunes twofold: flocks, children, daughters of beauty, and a long life. Stage: a household again, tents full of children, camels in the shade, a new generation at the door; evening light and music; a table set for a feast.
  -->
