<title>Scene Designer — Samuel</title>
<!--
  SCENE DIRECTOR NOTES — Samuel (1 Samuel 1–16)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Boy at Shiloh
     Samuel, a child in a linen ephod, serves at the tabernacle before Eli the priest. Stage: the tabernacle court at dawn, a boy in a small ephod, an old priest on a chair by the doorpost; the ark in the dark behind, the lamp not yet gone out.

  2. The Voice at Night
     The Lord calls Samuel in the night; he runs to Eli three times before Eli says: speak, Lord, for your servant is listening. Stage: a dark temple at night, a boy waking, a lamp burning low, an old priest's hand; the fourth call, the answer, the light in the boy's eyes.

  3. A Hard Message
     Eli makes Samuel tell the whole message: the house of Eli will be judged, and no sacrifice can stop it. Stage: a chamber at first light, a boy trembling, an old man listening, a lamp going out; a prophecy delivered with tears.

  4. The Ark Captured
     The Philistines defeat Israel, the ark is taken, and Eli falls from his seat and breaks his neck at the gate. Stage: a battlefield at dusk, a camp in smoke, the ark in enemy hands, an old man falling at the gate; a town wailing, a line of captives.

  5. Ebenezer
     The Philistines return the ark, and Samuel sets a stone between Mizpah and Shen and calls it Ebenezer, saying: thus far the Lord has helped us. Stage: a field at dawn, a great stone being set up, the people gathered, the ark on a new cart; a victory and a memorial, the first light.

  6. A King Demanded
     The elders ask for a king, and Samuel is displeased; the Lord tells him to listen to the people and show them the cost of a king. Stage: a town gate at midday, a crowd of elders, a judge listening, a scroll of the king's rights; a request made, a warning given.

  7. Saul Chosen
     Saul is chosen by lot, and he is found hiding among the baggage, taller than any of the people. Stage: a town square at dawn, a great man being brought from the baggage, a crown of gold, a tall figure among a crowd; the first king of Israel.

  8. Saul’s First Victory
     Nahash the Ammonite threatens Jabesh-gilead, and Saul cuts his oxen and sends the pieces through Israel; the people rally and win. Stage: a field of oxen at noon, a yoke of oxen cut in pieces, a trumpet being blown, the people coming up from the fields; a first victory.

  9. The Rejected King
     Saul disobeys at Gilgal and Samuel says: to obey is better than sacrifice, and the kingdom is torn from him. Stage: a battlefield at dusk, a king in torn robes, a prophet with a torn cloak, the sound of the sheep and the cattle; a kingdom ending, a door closing.

  10. David Anointed
     Samuel anoints David the youngest son of Jesse in Bethlehem, and the Spirit of the Lord comes upon him from that day. Stage: a Bethlehem hillside at golden hour, a boy among his brothers, a horn of oil, a shepherd's crook; the last son, the first light on a new king.
  -->
