<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Samuel</title>
<!--
  SCENE DIRECTOR NOTES — Samuel (1 Samuel 1–16)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Boy at Shiloh
     Samuel, a child in a linen ephod, serves at the tabernacle before Eli the priest. Stage: the tabernacle court at dawn, a boy in a small ephod, an old priest on a chair by the doorpost; the ark in the dark behind, the lamp not yet gone out.

  2. The Voice at Night
     The Lord calls Samuel in the night; he runs to Eli three times before Eli says: speak, Lord, for your servant is listening. Stage: a dark temple at night, a boy waking, a lamp burning low, an old priest's hand; the fourth call, the answer, the light in the boy's eyes.

  3. A Hard Message
     Eli makes Samuel tell the whole message: the house of Eli will be judged, and no sacrifice can stop it. Stage: a chamber at first light, a boy trembling, an old man listening, a lamp going out; a prophecy delivered with tears.

  4. The Ark Captured
     The Philistines defeat Israel, the ark is taken, and Eli falls from his seat and breaks his neck at the gate. Stage: a battlefield at dusk, a camp in smoke, the ark in enemy hands, an old man falling at the gate; a town wailing, a line of captives.

  5. Ebenezer
     The Philistines return the ark, and Samuel sets a stone between Mizpah and Shen and calls it Ebenezer, saying: thus far the Lord has helped us. Stage: a field at dawn, a great stone being set up, the people gathered, the ark on a new cart; a victory and a memorial, the first light.

  6. A King Demanded
     The elders ask for a king, and Samuel is displeased; the Lord tells him to listen to the people and show them the cost of a king. Stage: a town gate at midday, a crowd of elders, a judge listening, a scroll of the king's rights; a request made, a warning given.

  7. Saul Chosen
     Saul is chosen by lot, and he is found hiding among the baggage, taller than any of the people. Stage: a town square at dawn, a great man being brought from the baggage, a crown of gold, a tall figure among a crowd; the first king of Israel.

  8. Saul's First Victory
     Nahash the Ammonite threatens Jabesh-gilead, and Saul cuts his oxen and sends the pieces through Israel; the people rally and win. Stage: a field of oxen at noon, a yoke of oxen cut in pieces, a trumpet being blown, the people coming up from the fields; a first victory.

  9. The Rejected King
     Saul disobeys at Gilgal and Samuel says: to obey is better than sacrifice, and the kingdom is torn from him. Stage: a battlefield at dusk, a king in torn robes, a prophet with a torn cloak, the sound of the sheep and the cattle; a kingdom ending, a door closing.

  10. David Anointed
     Samuel anoints David the youngest son of Jesse in Bethlehem, and the Spirit of the Lord comes upon him from that day. Stage: a Bethlehem hillside at golden hour, a boy among his brothers, a horn of oil, a shepherd's crook; the last son, the first light on a new king.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
