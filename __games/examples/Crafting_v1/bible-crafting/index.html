<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Built by Faith – Bible Story Crafting</title>
<style>
:root{--bg:#f6f1e6;--card:#fffaf0;--ink:#2b2418;--mute:#7a6c52;--gold:#b8860b;--btn:#3b2f1a;--btnink:#fff6dc;--chip:#efe4c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110b;--card:#211a10;--ink:#f1e7d0;--mute:#b3a483;--gold:#e5b94a;--btn:#e5b94a;--btnink:#1a1408;--chip:#32281a}}
:root[data-theme="dark"]{--bg:#15110b;--card:#211a10;--ink:#f1e7d0;--mute:#b3a483;--gold:#e5b94a;--btn:#e5b94a;--btnink:#1a1408;--chip:#32281a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
.w{max-width:600px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.4rem;text-align:center;margin:4px 0 10px}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:14px;padding:12px;margin-bottom:12px}
.ref{color:var(--gold);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.bar{display:flex;justify-content:space-between;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:8px 11px;font:inherit;color:var(--ink);cursor:pointer}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn:disabled,.chip:disabled{opacity:.4}.w100{width:100%;text-align:center}
.slots{display:flex;gap:8px;margin:8px 0}
.slot{flex:1;height:54px;border:2px dashed var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer}
.mute{color:var(--mute);font-size:.9rem}
.log{min-height:2.6em;font-style:italic;color:var(--mute)}
.need{display:flex;gap:8px;flex-wrap:wrap}.need span{background:var(--chip);border-radius:8px;padding:6px 10px}.need .ok{outline:2px solid var(--gold)}
.quote{border-left:3px solid var(--gold);padding-left:10px;margin:8px 0}
h3{margin:0 0 6px;font-size:1rem}
</style></head><body><div class="w"><h1 id="h"></h1><div id="app"></div></div>
<script>
const ST=[{"f": "Adam", "n": "Adam & Eve", "r": "Genesis 1–3", "raws": ["🌱 Seed", "💧 Water", "🪵 Branch"], "rc": ["Bed|🟫|Seed+Water|Seed and water in the soil.", "Garden|🌳|Bed+Bed+Branch|Two beds with a tree's care."], "goal": "Garden", "w": "God planted a garden and gave you work to tend it. Make a garden to walk in with Him.", "v": "In the cool of the day God walked in the garden with them. Life began as a friendship.", "l": "Faith starts with trusting what God has said."}, {"f": "Enoch", "n": "Enoch", "r": "Genesis 5 · Hebrews 11:5", "raws": ["🪵 Wood", "🌿 Flax", "💧 Water"], "rc": ["Staff|🦯|Wood+Flax|Timber bound with fibre.", "Sandals|👡|Flax+Flax|Woven strips for the road.", "Waterskin|🫗|Flax+Water|Woven fibre that holds water."], "goal": "Staff,Sandals,Waterskin", "w": "Enoch walked with God day after day. Prepare for the long walk.", "v": "Enoch walked with God, and was not, for God took him.", "l": "Pleasing God is walking with Him, trusting Him step by step."}, {"f": "Noah", "n": "Noah", "r": "Genesis 6–9 · Hebrews 11:7", "raws": ["🪵 Wood", "🟤 Clay", "🌿 Reed"], "rc": ["Plank|📏|Wood+Wood|Two pieces of the same timber.", "Pitch|⚫|Wood+Clay|Burn timber with earth for a sealant.", "Ark|🚢|Plank+Plank+Pitch|Beams, sealed within and without."], "goal": "Ark", "w": "“Make yourself an ark.” There is no rain yet. Build it anyway.", "v": "The rain came. Noah built for a flood no one had ever seen.", "l": "Faith acts on God's warning before there is proof."}, {"f": "Abraham", "n": "Abraham", "r": "Genesis 12 · Hebrews 11:8–10", "raws": ["🌿 Flax", "🪵 Wood", "🌾 Grain", "💧 Water"], "rc": ["Rope|🪢|Flax+Flax|Twist fibre with fibre.", "Tent|⛺|Rope+Rope+Wood|Cord, cord and a pole.", "Bread|🍞|Grain+Grain+Water|Ground grain bound with water."], "goal": "Tent,Bread", "w": "“Go to the land I will show you.” You aren't told where. Pack for the road.", "v": "Abraham lived in tents in the land of promise, looking for a city built by God.", "l": "Faith packs for a road it can't see the end of."}, {"f": "Jacob", "n": "Jacob", "r": "Genesis 28 · Hebrews 11:21", "raws": ["🪨 Stone", "🪵 Wood", "🌿 Flax", "🫒 Oil"], "rc": ["Staff|🦯|Wood+Flax|Timber bound with fibre.", "Pillar|🗿|Stone+Stone+Oil|Stones set up and anointed."], "goal": "Pillar,Staff", "w": "On the run, Jacob slept on a stone and saw heaven open. Mark the place.", "v": "“Surely the LORD is in this place.” Jacob leaned on his staff and worshipped.", "l": "Faith marks the places where God met us."}, {"f": "Joseph", "n": "Joseph", "r": "Genesis 41 · Hebrews 11:22", "raws": ["🌾 Grain", "🟤 Clay", "🪵 Wood"], "rc": ["Jar|🏺|Clay+Clay|Fire-hardened earth.", "Granary|🏛️|Jar+Jar+Grain|Jars filled and stored against famine."], "goal": "Granary", "w": "Seven good years are coming, then seven lean ones. Prepare while the fields are full.", "v": "Famine came. Because Joseph stored grain in the good years, many were fed.", "l": "Faith prepares for what God has shown, even before it comes."}, {"f": "Moses", "n": "Moses", "r": "Exodus 2–3 · Hebrews 11:23–27", "raws": ["🌿 Reed", "🟤 Clay", "🪵 Wood"], "rc": ["Rope|🪢|Reed+Reed|Twist the river reeds.", "Pitch|⚫|Wood+Clay|Burn timber with earth for a sealant.", "Basket|🧺|Rope+Pitch|Woven cord sealed against water.", "Staff|🦯|Wood+Rope|A shepherd's pole."], "goal": "Basket,Staff", "w": "The king's order is out. Save the child, and prepare for the call to come.", "v": "The baby was drawn from the river. Later, a shepherd's staff became a sign of God's power.", "l": "Faith does what it can and leaves the rest with God."}, {"f": "Joshua", "n": "Joshua", "r": "Joshua 3–6 · Hebrews 11:30", "raws": ["🟤 Clay", "🪵 Wood", "🪨 Stone"], "rc": ["Horn|📯|Clay+Clay+Wood|Earth shaped around a wooden core.", "Memorial|🗿|Stone+Stone+Stone|Three stones from the river."], "goal": "Horn,Horn,Memorial", "w": "March around the city seven days. Make trumpets, and a memorial for the Jordan crossing.", "v": "The walls fell after they were encircled for seven days.", "l": "Faith keeps going through the stretch where nothing happens."}, {"f": "Deborah", "n": "Deborah", "r": "Judges 4–5", "raws": ["🪵 Wood", "🌿 Flax", "⛏️ Iron"], "rc": ["Banner|🚩|Flax+Wood|Cloth on a pole.", "Peg|📍|Wood+Iron|An iron-tipped tent stake."], "goal": "Banner,Banner,Peg", "w": "Deborah judged Israel under a palm tree and called Barak to battle. Prepare for the day.", "v": "God routed the army. A tent peg ended the day, and the land had peace for forty years.", "l": "Faith answers God's call even when others hold back."}, {"f": "Ruth", "n": "Ruth", "r": "Ruth 1–4", "raws": ["🌾 Grain", "🌿 Flax", "💧 Water"], "rc": ["Sheaf|🎍|Grain+Grain|Gathered grain tied up.", "Basket|🧺|Flax+Flax|Woven reeds to carry the harvest.", "Bread|🍞|Sheaf+Water|Gleaned grain ground with water."], "goal": "Basket,Bread", "w": "Ruth chose to follow Naomi and glean in a stranger's field. Gather what you need to feed you both.", "v": "Boaz noticed her loyalty. Ruth became part of the family line of King David.", "l": "Faith commits to God's people and finds a home."}, {"f": "Hannah", "n": "Hannah", "r": "1 Samuel 1–2", "raws": ["🐑 Wool", "🌿 Flax"], "rc": ["Thread|🧵|Wool+Wool|Spin the fleece.", "Robe|🧥|Thread+Thread+Flax|Cloth stitched for a small boy.", "Basket|🧺|Flax+Flax|Woven reeds for an offering."], "goal": "Robe,Basket", "w": "Hannah prayed for a child and promised to give him to God. Each year she made him a little robe.", "v": "God heard her prayer. Samuel grew up in the house of the LORD.", "l": "Faith prays honestly and gives back what it receives."}, {"f": "Samuel", "n": "Samuel", "r": "1 Samuel 3 & 16", "raws": ["🫒 Olive", "🟤 Clay"], "rc": ["Oil|🫒|Olive+Olive|Press the fruit.", "Flask|🏺|Clay+Clay|Fire-hardened earth.", "Oil Flask|🫙|Flask+Oil|A vessel filled for anointing.", "Lamp|🪔|Clay+Oil|A clay bowl that burns."], "goal": "Oil Flask,Lamp", "w": "Samuel was called in the night while the lamp of God still burned. Later he would anoint a shepherd boy.", "v": "God looks at the heart. Samuel poured the oil on the youngest son.", "l": "Faith listens first, and sees as God sees."}, {"f": "David", "n": "David", "r": "1 Samuel 17 · Hebrews 11:32", "raws": ["🪨 Stone", "🌿 Flax", "💧 Water"], "rc": ["Sling|🪃|Flax+Flax|Braided strands with a pouch.", "Smooth Stone|⚪|Stone+Water|Rubbed smooth in the brook."], "goal": "Sling,Smooth Stone,Smooth Stone", "w": "A giant mocks God's army. Armor doesn't fit you, so use what you know. Prepare your sling.", "v": "David ran toward Goliath. The battle belonged to the LORD.", "l": "Faith uses what God has put in our hands."}, {"f": "Job", "n": "Job", "r": "Job 1–42", "raws": ["🪨 Stone", "🪵 Wood", "🌿 Flax"], "rc": ["Cloth|🧣|Flax+Flax|Woven for mourning.", "Altar|🪨|Stone+Stone+Wood|Stacked stones and timber."], "goal": "Altar,Cloth", "w": "Job lost everything but didn't curse God. Build an altar and wear mourning cloth.", "v": "“I know my Redeemer lives.” God answered, and Job's life was restored.", "l": "Faith holds on when no answers come."}, {"f": "Elijah", "n": "Elijah", "r": "1 Kings 17–18", "raws": ["🪨 Stone", "🪵 Wood", "🌾 Grain", "💧 Water"], "rc": ["Altar|🪨|Stone+Stone+Wood|Stones stacked with timber.", "Cake|🫓|Grain+Water|The widow's last flour and oil."], "goal": "Altar,Cake", "w": "Drought grips the land. A widow shares her last meal, and a prophet rebuilds an altar on Carmel.", "v": "Fire fell from heaven. The flour jar never ran out.", "l": "Faith gives from the last of what it has."}, {"f": "Elisha", "n": "Elisha", "r": "2 Kings 2 & 4", "raws": ["🟤 Clay", "🫒 Oil", "🧂 Salt"], "rc": ["Jar|🏺|Clay+Clay|Empty vessels borrowed from neighbours.", "Bowl|🥣|Clay+Salt|A new bowl with salt.", "Full Jar|🫙|Jar+Oil|Oil poured until it fills."], "goal": "Full Jar,Full Jar,Bowl", "w": "A widow is in debt. Gather empty jars, and a new bowl for healing the spring.", "v": "The oil flowed until every jar was full, and the spring was made clean.", "l": "Faith brings empty vessels and expects God to fill them."}, {"f": "Jonah", "n": "Jonah", "r": "Jonah 1–4", "raws": ["⚫ Ash", "💧 Water", "🌿 Reed", "🌿 Flax"], "rc": ["Ink|🖋️|Ash+Water|Soot mixed with water.", "Scroll|📜|Reed+Ink|Written warning.", "Sackcloth|🧣|Flax+Flax|Rough weave for repentance."], "goal": "Scroll,Sackcloth", "w": "Jonah ran the other way. Now God says go to Nineveh. Prepare the message and the sackcloth.", "v": "Nineveh repented, and God spared the city.", "l": "Faith turns back and goes where God sends."}, {"f": "Isaiah", "n": "Isaiah", "r": "Isaiah 6", "raws": ["🪵 Wood", "⚫ Soot", "🌿 Reed", "💧 Water"], "rc": ["Ink|🖋️|Soot+Water|Soot mixed with water.", "Scroll|📜|Reed+Ink|Written prophecy.", "Coal|🔥|Wood+Soot|A burning ember."], "goal": "Scroll,Coal", "w": "Isaiah saw the LORD high and lifted up. A coal touched his lips, and he said, “Here am I.”", "v": "Isaiah's words carried hope for generations.", "l": "Faith says yes to God, even when the message is hard."}, {"f": "Jeremiah", "n": "Jeremiah", "r": "Jeremiah 18 & 13", "raws": ["🟤 Clay", "💧 Water", "🌿 Flax"], "rc": ["Wet Clay|🟤|Clay+Water|Soft and workable.", "Vessel|🏺|Wet Clay+Wet Clay|Shaped on the wheel.", "Belt|🎗️|Flax+Flax|A linen belt."], "goal": "Vessel,Belt", "w": "God sends Jeremiah to the potter's house. The clay is marred, so the potter remakes it.", "v": "God can reshape his people and give a future and a hope.", "l": "Faith trusts the Potter's hands."}, {"f": "Daniel", "n": "Daniel", "r": "Daniel 1 & 6 · Hebrews 11:33", "raws": ["🌾 Grain", "💧 Water", "🪵 Wood", "🌿 Flax"], "rc": ["Meal|🥣|Grain+Water|Simple food for the faithful.", "Window|🪟|Wood+Wood+Flax|A frame open towards Jerusalem."], "goal": "Meal,Window", "w": "Daniel chose simple food and prayed three times a day at his open window, even when it was forbidden.", "v": "God shut the lions' mouths.", "l": "Faith keeps its habits when it costs something."}, {"f": "Esther", "n": "Esther", "r": "Esther 4–8", "raws": ["🌿 Flax", "🌸 Myrrh", "🫒 Oil", "💧 Water"], "rc": ["Cloth|🧣|Flax+Flax|Fine weave.", "Royal Robe|👘|Cloth+Cloth|Cloth on cloth.", "Perfume|🧴|Myrrh+Oil|Resin and oil."], "goal": "Royal Robe,Perfume", "w": "“Who knows whether you have come to the kingdom for such a time as this?” Prepare to approach the king.", "v": "The king held out his scepter, and God's people were saved.", "l": "Faith takes risks for others at the right time."}, {"f": "Nehemiah", "n": "Nehemiah", "r": "Nehemiah 2–6", "raws": ["🪨 Stone", "🟤 Clay", "💧 Water", "🪵 Wood"], "rc": ["Mortar|🧱|Clay+Water|Clay slurry for binding.", "Wall|🏯|Stone+Stone+Mortar|Stones mortared together.", "Gate|🚪|Wood+Wood+Clay|Timber hung with clay hinges."], "goal": "Wall,Wall,Gate", "w": "Jerusalem's walls lie in ruins. Rebuild with your hands, and your eyes on God.", "v": "The wall was finished in fifty-two days.", "l": "Faith rebuilds, one stone at a time."}],FIX=null;
let G,S,IC,NEED;
const COMIC="https://purna.github.io/bible-stories/";
function menu(){h.textContent="🛠️ Built by Faith";G=null;app.innerHTML=`<p class="mute" style="text-align:center">Pick a story. Gather, craft, and offer it in faith.</p><div class="grid">${ST.map(s=>`<button class="chip" onclick="start('${s.f}')">${s.n}</button>`).join("")}</div>`}
function start(f){G=ST.find(s=>s.f==f);IC={};
G.R=G.raws.map(x=>{const i=x.indexOf(" ");IC[x.slice(i+1)]=x.slice(0,i);return[x.slice(0,i),x.slice(i+1)]});
G.C=G.rc.map(x=>{const[n,e,i,t]=x.split("|");IC[n]=e;return{n,e,ing:i.split("+"),t}});
NEED={};G.goal.split(",").forEach(k=>NEED[k]=(NEED[k]||0)+1);
S={day:1,act:6,inv:{},disc:{},slots:[],log:"Gather materials, then combine them at the bench.",rev:0};draw()}
const add=(k,n)=>S.inv[k]=(S.inv[k]||0)+n;
function gather(k){if(S.act<1)return;S.act--;const n=2+(Math.random()<.35?1:0);add(k,n);S.log=`You gathered ${n} ${k.toLowerCase()}.`;draw()}
function pick(k){if(S.slots.length>=3||S.slots.filter(x=>x==k).length>=S.inv[k])return;S.slots.push(k);draw()}
function craft(){if(S.act<1||S.slots.length<2)return;const key=[...S.slots].sort().join();
const r=G.C.find(r=>[...r.ing].sort().join()==key);S.act--;
if(r){S.slots.forEach(k=>S.inv[k]--);add(r.n,1);const f=!S.disc[r.n];S.disc[r.n]=1;S.log=`${r.e} You made: ${r.n}${f?" (new recipe!)":""}.`}
else S.log="Nothing useful came of that. Your materials are kept. Try another mix.";
S.slots=[];draw()}
function rest(){S.day++;S.act=6;S.slots=[];S.log="A new day. Strength restored.";draw()}
const can=()=>Object.entries(NEED).every(([k,n])=>(S.inv[k]||0)>=n);
function deliver(){Object.entries(NEED).forEach(([k,n])=>S.inv[k]-=n);S.rev=S.day<=2?3:S.day<=4?2:1;draw()}
function back(){FIX?location.href="index.html":menu()}
function draw(){h.textContent=G.n;
if(S.rev){app.innerHTML=`<div class="card"><div class="ref">${G.n} · ${G.r}</div><h3>The unseen is revealed</h3><p>${G.v}</p><div class="quote">${G.l}</div>
<p class="mute">Finished on day ${S.day} → ${"✨".repeat(S.rev)}</p></div>
<div class="row"><button class="btn" onclick="start('${G.f}')">Play again</button><button class="btn" onclick="back()">All stories</button><a class="btn" href="${COMIC}${G.f}/">Read the comic</a></div>`;return}
const inv=Object.keys(S.inv).filter(k=>S.inv[k]>0);
const need=Object.entries(NEED).map(([k,n])=>`<span class="${(S.inv[k]||0)>=n?'ok':''}">${IC[k]} ${S.disc[k]?k:"???"} ×${n} (${S.inv[k]||0})</span>`).join("");
const notes=G.C.map(r=>`<div class="mute">${S.disc[r.n]?`${r.e} <b>${r.n}</b> = ${r.ing.map(i=>IC[i]).join(" + ")}`:`❓ ${r.t}`}</div>`).join("");
app.innerHTML=`<div class="bar"><span>Day ${S.day}</span><span>⚡ ${S.act}/6</span></div>
<div class="card"><div class="ref">${G.r}</div><p style="margin:6px 0">${G.w}</p><div class="need">${need}</div></div>
<div class="card"><h3>Gather (1 ⚡)</h3><div class="row">${G.R.map(([e,n])=>`<button class="chip" ${S.act<1?'disabled':''} onclick="gather('${n}')">${e} ${n}</button>`).join("")}</div></div>
<div class="card"><h3>Bench (1 ⚡)</h3><div class="row">${inv.map(k=>`<button class="chip" onclick="pick('${k}')">${IC[k]} ${k} ×${S.inv[k]}</button>`).join("")||'<span class="mute">Empty. Go gather.</span>'}</div>
<div class="slots">${[0,1,2].map(i=>`<div class="slot" onclick="S.slots.splice(${i},1);draw()">${S.slots[i]?IC[S.slots[i]]:""}</div>`).join("")}</div>
<div class="row"><button class="btn" ${S.act<1||S.slots.length<2?'disabled':''} onclick="craft()">🔨 Combine</button><button class="btn" onclick="S.slots=[];draw()">Clear</button></div><div class="log">${S.log}</div></div>
<div class="row"><button class="btn" style="flex:1" ${can()?'':'disabled'} onclick="deliver()">✅ Offer it in faith</button><button class="btn" onclick="rest()">🌙 End day</button><button class="btn" onclick="back()">☰</button></div>
<div class="card"><h3>Recipe notes</h3>${notes}<div class="mute">Tap a bench slot to remove an item. Order doesn't matter.</div></div>`}
FIX?start(FIX):menu();
</script></body></html>
