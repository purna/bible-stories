<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Temple Builder — Enhanced Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_shared/modal.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="_shared/timer.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    :root{
      --ink:#3a2410;
      --good:#2e7d32;
      --good-glow:rgba(46,125,50,0.4);
      --bad:#c62828;
      --accent:#ffd84d;
      --accent-dark:#d4a317;
      --bg:#1a1008;
      --panel-bg:rgba(255, 250, 240, 0.92);
    }
    html,body{width:100%;height:100%;overflow:hidden;background:#100a05}
    body{
      font-family:'Comic Neue',Arial,sans-serif;
      color:var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at 50% 30%, #3a2212 0%, #120904 100%);
    }

    .wrap{
      width:960px;
      height:540px;
      margin:0;
      padding:16px;
      flex:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      overflow:hidden;
      transform:scale(var(--game-scale,1));
      transform-origin:center;
      position:relative;
    }

    /* Ambient Background Atmosphere */
    .bg-sky {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, #3d2314 0%, #7c4822 50%, #ca884c 85%, #5a8c2f 85%, #3a5c1e 100%);
      z-index: 0;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.3);
      border: 4px solid #5a3c1e;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 240, 220, 0.25);
      border-radius: 50px;
      animation: floatCloud 35s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute; background: inherit; border-radius: 50%;
    }
    .cloud1 { width: 120px; height: 30px; top: 35px; left: -130px; }
    .cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
    .cloud1::after { width: 40px; height: 40px; top: -15px; left: 55px; }
    
    .cloud2 { width: 160px; height: 40px; top: 75px; left: -180px; animation-delay: -18s; animation-duration: 45s; }
    .cloud2::before { width: 60px; height: 60px; top: -25px; left: 25px; }
    .cloud2::after { width: 50px; height: 50px; top: -20px; left: 70px; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(1150px); }
    }

    /* Particles Canvas */
    #fxCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Content Layout */
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-top: 2px;
      text-shadow: 0 2px 4px rgba(255,255,255,0.4);
    }
    h1{
      font-size:1.8rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 3px 0 var(--ink), 0 0 10px rgba(255,216,77,0.5);
      letter-spacing: 1px;
    }
    .sub{
      text-align:center;
      font-size:.92rem;
      color: #ffe8cc;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      margin-bottom: 4px;
    }

    .hud{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-bottom:6px;
      font-size:.95rem;
      font-weight:800;
    }
    .hud .chip{
      background: var(--panel-bg);
      border:2.5px solid var(--ink);
      border-radius:12px;
      padding:4px 14px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scene{
      flex:1;
      display:flex;
      gap:24px;
      justify-content:center;
      align-items:center;
      width:100%;
      margin-bottom: 6px;
    }

    /* Tray Styling */
    .tray-wrap{text-align:center;}
    .tray-wrap .label, .site-wrap .label{
      font-size:.85rem;
      font-weight:800;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 1.5px;
      margin-bottom:6px;
    }
    .tray{
      width:288px;
      background: var(--panel-bg);
      border:3px solid var(--ink);
      border-radius:16px;
      padding:14px;
      display:grid;
      grid-template-columns:repeat(3, 78px);
      gap:10px;
      justify-content:center;
      min-height:280px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 2px 6px rgba(255,255,255,0.8);
    }
    
    /* Interactive Blocks */
    .block{
      width:78px;
      height:78px;
      border-radius:14px;
      background: linear-gradient(135deg, #ffe885 0%, #ffd033 100%);
      border:3px solid var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:grab;
      touch-action:none;
      transition:transform .18s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter .14s, box-shadow .14s;
      box-shadow:0 5px 0 #9d7613, 0 6px 10px rgba(0,0,0,0.2);
      position:relative;
    }
    .block:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow:0 8px 0 #9d7613, 0 8px 14px rgba(0,0,0,0.25);
    }
    .block .shape{width:58px;height:58px;display:block;filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));}
    .block.sortable-chosen, .block.sortable-ghost{
      opacity:0.9;
      transform:scale(1.1) rotate(-3deg);
      box-shadow:0 12px 20px rgba(0,0,0,0.3);
      cursor:grabbing;
    }
    .block.placed{
      opacity:0.15;
      pointer-events:none;
      box-shadow:none;
      filter: grayscale(1);
      transform: scale(0.92);
    }

    /* Temple Site */
    .site-wrap{text-align:center;flex:1;max-width:440px}
    .site{
      position:relative;
      width:390px;
      height:290px;
      margin:0 auto;
      background: linear-gradient(180deg, #d2a679 0%, #b88a5c 100%);
      border:4px solid var(--ink);
      border-radius:16px;
      box-shadow:0 8px 0 #5c3e21, 0 12px 24px rgba(0,0,0,0.4);
      overflow:hidden;
    }
    .site .ground{
      position:absolute;
      left:0;right:0;bottom:0;
      height:44px;
      background: linear-gradient(180deg, #6ba336 0%, #467320 100%);
      border-top:3.5px solid var(--ink);
    }
    
    .site .temple-roof{
      position:absolute;
      left:50%;
      top:-2px;
      transform:translateX(-50%);
      width:280px;
      height:32px;
      background: linear-gradient(180deg, #f7d262 0%, #c99a22 100%);
      border:3.5px solid var(--ink);
      border-radius:6px 6px 2px 2px;
      z-index: 3;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .site .temple-roof::before {
      content:'';
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-bottom: 16px solid #c99a22;
    }

    .site .temple-outline{
      position:absolute;
      left:50%;
      top:30px;
      transform:translateX(-50%);
      width:250px;
      height:220px;
      border:3px dashed rgba(58,36,16,.6);
      border-radius:8px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);
      gap:6px;
      padding:8px;
      background:rgba(255,255,255,.22);
      backdrop-filter: blur(2px);
      z-index: 2;
    }

    .site .temple-outline .cell{
      background:rgba(255,255,255,.45);
      border:2px dashed rgba(58,36,16,.4);
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:0;
      min-width:0;
      position: relative;
      transition: all 0.2s ease;
    }
    .site .temple-outline .cell.target-slot {
      background: rgba(255, 235, 175, 0.55);
      border-color: rgba(180, 120, 20, 0.7);
    }
    .site .temple-outline .cell.target-slot::before {
      content: '';
      position: absolute;
      opacity: 0.25;
      width: 70%;
      height: 70%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none;
    }
    /* Blueprint ghost shapes */
    .site .temple-outline .cell[data-shape="square"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect x="6" y="6" width="48" height="48" rx="4" fill="%233a2410"/></svg>');
    }
    .site .temple-outline .cell[data-shape="arch"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><path d="M10 50V30a20 20 0 0 1 40 0v20Z" fill="%233a2410"/></svg>');
    }
    .site .temple-outline .cell[data-shape="pillar"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect x="20" y="6" width="20" height="48" fill="%233a2410"/></svg>');
    }
    .site .temple-outline .cell[data-shape="window"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect x="10" y="6" width="40" height="48" rx="6" fill="%233a2410"/></svg>');
    }
    .site .temple-outline .cell[data-shape="lamp"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><path d="M10 40c0-8 8-14 20-14s20 6 20 14-9 10-20 10-20-2-20-10Z" fill="%233a2410"/></svg>');
    }
    .site .temple-outline .cell[data-shape="wreath"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="20" fill="%233a2410"/></svg>');
    }
    .site .temple-outline .cell[data-shape="banner"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect x="10" y="8" width="40" height="42" rx="4" fill="%233a2410"/></svg>');
    }
    .site .temple-outline .cell[data-shape="urn"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><path d="M20 20h20l-4 30a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4Z" fill="%233a2410"/></svg>');
    }
    .site .temple-outline .cell[data-shape="incense"]::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><ellipse cx="30" cy="34" rx="20" ry="14" fill="%233a2410"/></svg>');
    }

    .site .temple-outline .cell.correct{
      background:rgba(46,125,50,.3);
      border: 2.5px solid var(--good);
      box-shadow: inset 0 0 12px var(--good-glow);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .site .temple-outline .cell.correct::before { opacity: 0; }
    
    .site .temple-outline .cell.wrong{
      animation: shake 0.4s ease;
      border-color: var(--bad);
      background: rgba(198, 40, 40, 0.3);
    }

    .site .temple-outline .cell .label{
      font-size:.68rem;
      font-weight:800;
      color:var(--ink);
      opacity:.65;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.1;
    }
    .site .temple-outline .cell.correct .label{display:none;}
    .site .temple-outline .cell svg{
      width:80%;
      height:80%;
      display:block;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .site .temple-pillar{
      position:absolute;
      left:50%;
      top:30px;
      transform:translateX(-50%);
      width:10px;
      height:190px;
      background:#ccae81;
      border:2px solid var(--ink);
      z-index:1;
      pointer-events:none;
      border-radius:4px;
      opacity:.5;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bg-sky">
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
    </div>

    <canvas id="fxCanvas"></canvas>

    <div class="content">
      <header>
        <h1>Temple Builder</h1>
        <div class="sub">Drag every stone and decoration to its matching silhouette to finish the temple!</div>
      </header>

      <div class="hud">
        <div class="chip" id="placedChip">Placed: 0 / 4</div>
        <div class="chip" id="triesChip">Tries: 0</div>
      </div>

      <div class="scene">
        <div class="tray-wrap">
          <div class="label">BUILDING PIECES</div>
          <div class="tray" id="tray"></div>
        </div>
        <div class="site-wrap">
          <div class="label">THE TEMPLE</div>
          <div class="site" id="site">
            <div class="temple-roof"></div>
            <div class="temple-outline" id="outline"></div>
            <div class="temple-pillar"></div>
            <div class="ground"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal" role="dialog" aria-live="assertive">
    <div class="modal-card" id="modalCard">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-text" id="modalText"></div>
      <button type="button" class="modal-btn" id="modalBtn">Build again</button>
    </div>
  </div>

  <script>
    window.GAME_CONFIG = { timerSeconds: 140, timer: true };

    function fitGameToViewport(){
      document.documentElement.style.setProperty('--game-scale', Math.min(innerWidth/960, innerHeight/540));
    }
    addEventListener('resize', fitGameToViewport); 
    fitGameToViewport();

    // --- Audio Synthesizer Engine ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTone(freq, type, duration, startGain=0.15) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(startGain, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
      }
      playPick() {
        this.init();
        this.playTone(320, 'sine', 0.08, 0.1);
      }
      playCorrect() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Heavy satisfying thud + chime
        this.playTone(180, 'triangle', 0.2, 0.25);
        setTimeout(() => this.playTone(523.25, 'sine', 0.25, 0.2), 50); // C5
        setTimeout(() => this.playTone(659.25, 'sine', 0.3, 0.2), 120);  // E5
      }
      playWrong() {
        this.init();
        if (!this.ctx) return;
        this.playTone(160, 'sawtooth', 0.18, 0.15);
        setTimeout(() => this.playTone(130, 'sawtooth', 0.22, 0.15), 100);
      }
      playWin() {
        this.init();
        if (!this.ctx) return;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, i) => {
          setTimeout(() => this.playTone(freq, 'triangle', 0.4, 0.25), i * 110);
        });
      }
    }
    const SFX = new SoundEngine();

    // --- Particle FX Engine ---
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = 960;
      canvas.height = 540;
    }
    resizeCanvas();

    function createDust(x, y) {
      for (let i = 0; i < 24; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: Math.random() * 6 + 3,
          color: Math.random() > 0.4 ? '#ffd84d' : '#e3d4b4',
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(renderParticles);
    }
    requestAnimationFrame(renderParticles);

    // SVGs & Shapes Data
    const HOURGLASS_SVG='<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 4h14l-1 3c-1 3-4 5-6 7 2 2 5 4 6 7l1 3H9l1-3c1-3 4-5 6-7-2-2-5-4-6-7Z" fill="#fff" stroke="#1b5e20" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 4v24" stroke="#1b5e20" stroke-width="2" stroke-dasharray="2 2"/></svg>';
    const SUN_SVG='<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="7" fill="#ffd43b" stroke="#1b5e20" stroke-width="2.5"/><g stroke="#1b5e20" stroke-width="2.5" stroke-linecap="round"><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6 6l3 3M23 23l3 3M26 6l-3 3M9 23l-3 3"/></g></svg>';

    const SHAPES = [
      { id:'square',  name:'Stone Block', cell:0, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="48" height="48" rx="4" fill="#e3d4b4" stroke="#3a2410" stroke-width="3"/><path d="M14 18h32M14 30h32M14 42h32M22 10v40M38 10v40" stroke="#3a2410" stroke-width="1.5" opacity=".5"/></svg>' },
      { id:'arch',    name:'Arch Stone',  cell:4, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M10 50V30a20 20 0 0 1 40 0v20" fill="#e3d4b4" stroke="#3a2410" stroke-width="3" stroke-linejoin="round"/><rect x="6" y="46" width="48" height="8" fill="#a8861d" stroke="#3a2410" stroke-width="3"/></svg>' },
      { id:'pillar',  name:'Pillar',      cell:2, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><rect x="22" y="6" width="16" height="6" rx="1" fill="#a8861d" stroke="#3a2410" stroke-width="2.5"/><rect x="20" y="12" width="20" height="38" fill="#e3d4b4" stroke="#3a2410" stroke-width="3"/><rect x="22" y="50" width="16" height="6" rx="1" fill="#a8861d" stroke="#3a2410" stroke-width="2.5"/><path d="M26 18v26M30 18v26M34 18v26" stroke="#3a2410" stroke-width="1.5" opacity=".4"/></svg>' },
      { id:'window',  name:'Window',      cell:6, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="6" width="40" height="48" rx="6" fill="#e3d4b4" stroke="#3a2410" stroke-width="3"/><path d="M30 6v48M10 30h40" stroke="#3a2410" stroke-width="2.5"/><circle cx="30" cy="30" r="6" fill="#7CC6FF" stroke="#173b59" stroke-width="2"/></svg>' },
      { id:'lamp',    name:'Oil Lamp',    cell:1, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M10 40c0-8 8-14 20-14s20 6 20 14-9 10-20 10-20-2-20-10Z" fill="#e3d4b4" stroke="#3a2410" stroke-width="3"/><path d="M30 26c2-6 2-10-1-14" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M27 10c0-3 2-5 3-5s3 2 3 5-3 6-3 6-3-3-3-6Z" fill="#ff8a3d" stroke="#3a2410" stroke-width="2"/></svg>' },
      { id:'wreath',  name:'Vine Wreath', cell:3, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="18" fill="none" stroke="#6ba336" stroke-width="6"/><circle cx="30" cy="30" r="18" fill="none" stroke="#3a2410" stroke-width="2"/><g fill="#3f7d20" stroke="#3a2410" stroke-width="1"><ellipse cx="30" cy="10" rx="6" ry="3"/><ellipse cx="50" cy="30" rx="3" ry="6"/><ellipse cx="30" cy="50" rx="6" ry="3"/><ellipse cx="10" cy="30" rx="3" ry="6"/></g></svg>' },
      { id:'banner',  name:'Temple Curtain', cell:5, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="8" width="44" height="6" rx="2" fill="#a8861d" stroke="#3a2410" stroke-width="2.5"/><path d="M12 14 Q12 40 18 50 Q24 40 24 14 Z" fill="#c62828" stroke="#3a2410" stroke-width="2"/><path d="M24 14 Q24 40 30 50 Q36 40 36 14 Z" fill="#7c2020" stroke="#3a2410" stroke-width="2"/><path d="M36 14 Q36 40 42 50 Q48 40 48 14 Z" fill="#c62828" stroke="#3a2410" stroke-width="2"/></svg>' },
      { id:'urn',     name:'Flower Urn',  cell:7, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M20 24h20l-4 26a4 4 0 0 1-4 3.5h-4a4 4 0 0 1-4-3.5Z" fill="#e3d4b4" stroke="#3a2410" stroke-width="3"/><rect x="17" y="18" width="26" height="8" rx="2" fill="#a8861d" stroke="#3a2410" stroke-width="2.5"/><circle cx="30" cy="10" r="5" fill="#ff8a3d" stroke="#3a2410" stroke-width="2"/><circle cx="22" cy="14" r="4" fill="#ffd84d" stroke="#3a2410" stroke-width="2"/><circle cx="38" cy="14" r="4" fill="#ffd84d" stroke="#3a2410" stroke-width="2"/></svg>' },
      { id:'incense', name:'Incense Bowl', cell:8, svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M12 34c0 10 8 16 18 16s18-6 18-16" fill="#e3d4b4" stroke="#3a2410" stroke-width="3"/><ellipse cx="30" cy="34" rx="18" ry="6" fill="#c9a15a" stroke="#3a2410" stroke-width="3"/><path d="M30 28c-2-6 4-8 2-14M27 14c1 3 5 3 4 7" stroke="#8a8a8a" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/></svg>' },
    ];

    const trayEl=document.getElementById('tray');
    const outlineEl=document.getElementById('outline');
    const placedChip=document.getElementById('placedChip');
    const triesChip=document.getElementById('triesChip');
    const modal=document.getElementById('modal'), modalCard=document.getElementById('modalCard'), modalIcon=document.getElementById('modalIcon'), modalTitle=document.getElementById('modalTitle'), modalText=document.getElementById('modalText'), modalBtn=document.getElementById('modalBtn');

    function showModal(kind, title, lines, btnLabel){
      modalCard.classList.remove('success','timeout');
      if(kind==='success') modalCard.classList.add('success');
      if(kind==='timeout') modalCard.classList.add('timeout');
      modalIcon.innerHTML = kind==='success' ? SUN_SVG : HOURGLASS_SVG;
      modalTitle.textContent = title;
      modalText.innerHTML = lines.map(l => /[“”"]/.test(l) ? `<div class="modal-verse">${l}</div>` : `<div>${l}</div>`).join('');
      modalBtn.textContent = btnLabel || 'Build again';
      modal.classList.add('active');
      modalBtn.onclick = () => location.reload();
    }

    let placed = 0, tries = 0, over = false, tray = null;
    const cellSortables = [];

    function updateHud(){
      placedChip.textContent = `Placed: ${placed} / ${SHAPES.length}`;
      triesChip.textContent = `Tries: ${tries}`;
    }

    function build(){
      const positions = [0,1,2,3,4,5,6,7,8];
      positions.forEach(idx => {
        const c = document.createElement('div');
        c.className = 'cell';
        c.dataset.idx = idx;
        const shape = SHAPES.find(s => s.cell === idx);
        
        if (shape){
          c.dataset.shape = shape.id;
          c.dataset.target = '1';
          c.classList.add('target-slot');
          c.innerHTML = '<span class="label">'+shape.name+'</span>';
        } else {
          c.dataset.target = '0';
          c.innerHTML = '<span class="label">Decor</span>';
        }
        
        outlineEl.appendChild(c);

        const s = new Sortable(c, {
          group: 'temple',
          draggable: '.tray .block',
          sort: false,
          animation: 150,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          forceFallback: true,
          fallbackOnBody: true,
          fallbackTolerance: 3,
          onStart: () => SFX.playPick(),
          onAdd: function(evt){
            if (over) { evt.item.remove(); return; }
            const clone = evt.item;
            const shapeId = clone.dataset.shape;
            tries++;

            const existing = c.querySelector('.block');
            if (existing) existing.remove();

            if (shapeId === c.dataset.shape && c.dataset.target === '1'){
              c.classList.add('correct');
              c.classList.remove('wrong');
              
              // Mark corresponding tray block as placed
              const trayBlock = trayEl.querySelector(`.block[data-shape="${shapeId}"]`);
              if (trayBlock) trayBlock.classList.add('placed');

              const shapeObj = SHAPES.find(s => s.id === shapeId);
              c.innerHTML = shapeObj.svg;
              
              // Particle explosion at target center
              const rect = c.getBoundingClientRect();
              const wrapRect = document.querySelector('.wrap').getBoundingClientRect();
              const scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--game-scale')) || 1;
              const posX = (rect.left + rect.width / 2 - wrapRect.left) / scale;
              const posY = (rect.top + rect.height / 2 - wrapRect.top) / scale;
              
              createDust(posX, posY);
              SFX.playCorrect();

              placed++;
              updateHud();

              if (placed >= SHAPES.length){
                setTimeout(() => finish(true), 600);
              }
            } else {
              SFX.playWrong();
              c.classList.add('wrong');
              setTimeout(() => c.classList.remove('wrong'), 500);
              clone.remove();
              updateHud();
            }
          }
        });
        cellSortables.push(s);
      });

      // Populate Tray
      const shuffled = [...SHAPES].sort(() => Math.random() - 0.5);
      shuffled.forEach(shape => {
        const b = document.createElement('div');
        b.className = 'block';
        b.dataset.shape = shape.id;
        b.setAttribute('aria-label', shape.name);
        b.innerHTML = '<div class="shape">' + shape.svg + '</div>';
        trayEl.appendChild(b);
      });

      tray = new Sortable(trayEl, {
        group: { name: 'temple', pull: 'clone', put: false },
        draggable: '.block',
        sort: false,
        animation: 150,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        forceFallback: true,
        fallbackOnBody: true,
        fallbackTolerance: 3,
        onStart: () => SFX.playPick()
      });
    }

    build();
    updateHud();

    function finish(success, reason){
      if (over) return;
      over = true;
      if (tray) { try{ tray.option('disabled', true); }catch(e){} }
      cellSortables.forEach(s => { try{ s.option('disabled', true); }catch(e){} });

      if (success){
        SFX.playWin();
        showModal('success', 'The Temple is Built!', [
          'Every stone placed with craft and precision.',
          '"The temple of the Lord was finished." — 1 Kings 6:14'
        ], 'Build again');
        
        window.dispatchEvent(new CustomEvent('game-complete'));
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'game-complete', game: 'temple_builder' }, '*');
        }
      } else {
        showModal('timeout', 'Work Stopped!', [
          reason || 'Time’s up.',
          '"Be still before the Lord and wait patiently." — Psalm 37:7'
        ], 'Try again');
        
        window.dispatchEvent(new CustomEvent('game-over'));
      }
    }

    addEventListener('game-timeout', () => finish(false, 'Time’s up! The builders had to rest.'));
  </script>
</body>
</html>
