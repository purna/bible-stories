<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Jonah’s Path — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_shared/modal.css">
  <script src="_shared/timer.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    :root{--ink:#3a2410;--good:#2e7d32;--bad:#c62828;--accent:#ffd84d;--bg:#fffaf0}
    html,body{width:100%;height:100%;overflow:hidden}
    body{font-family:'Comic Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center}
    .wrap{width:960px;max-width:none;height:540px;margin:0;padding:14px;flex:none;display:flex;flex-direction:column;align-items:center;overflow:hidden;transform:scale(var(--game-scale,1));transform-origin:center}
    h1{font-size:1.5rem;margin:0 0 4px}
    .sub{text-align:center;font-size:.85rem;opacity:.8;margin-bottom:6px}
    .hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;font-size:.9rem;font-weight:800}
    .chip{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 10px}
    .chip.warn{background:#ffe5b4;border-color:#a85b00}
    .stage{flex:1;position:relative;border:4px solid var(--ink);border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#9ed7f0 0%,#bfe6f6 60%,#cfeaef 100%);box-shadow:0 6px 0 #6c8da0}
    .ocean{position:absolute;left:0;right:0;top:60%;bottom:0;background:linear-gradient(180deg,#5fa3d4 0%,#3a6b8a 100%)}
    .ocean .wave{position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 6px,transparent 6px 14px);animation:slide 3s linear infinite}
    .ocean .wave.b{top:24%;animation-duration:4s;animation-direction:reverse}
    .ocean .wave.c{top:60%;animation-duration:3.5s}
    @keyframes slide{0%{background-position:0 0}100%{background-position:60px 0}}
    .boat{position:absolute;right:14px;top:18%;width:120px;height:70px;opacity:.85;z-index:1;animation:float 4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .nineveh{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:90px;height:120px;background:#cfa463;border:3px solid var(--ink);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px;z-index:2}
    .nineveh::before{content:"";position:absolute;left:8px;top:-22px;width:30px;height:22px;background:#a8861d;border:3px solid var(--ink);clip-path:polygon(0 100%,50% 0,100% 100%)}
    .nineveh::after{content:"";position:absolute;right:8px;top:-22px;width:30px;height:22px;background:#a8861d;border:3px solid var(--ink);clip-path:polygon(0 100%,50% 0,100% 100%)}
    .nineveh .label{font-size:.7rem;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 6px;margin-bottom:4px}
    .nineveh .gate{width:32px;height:42px;background:#5e3e0a;border:2px solid var(--ink);border-radius:14px 14px 0 0}
    .sea-floor{position:absolute;left:0;right:0;bottom:0;height:50px;background:#7a5d2a;border-top:3px solid var(--ink);z-index:0}
    .grid{position:relative;display:grid;grid-template-columns:repeat(5,140px);grid-template-rows:repeat(3,90px);gap:10px;padding:14px;z-index:3}
    .cell{width:140px;height:90px;border-radius:12px;background:rgba(255,255,255,.5);border:3px dashed rgba(58,36,16,.5);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:background .15s,transform .15s}
    .cell.used{background:rgba(46,125,50,.4);border-style:solid;border-color:var(--good);cursor:default}
    .cell.used::after{content:"";position:absolute;inset:6px;background:repeating-linear-gradient(45deg,#d4b97a 0 6px,#c8a35e 6px 12px);border-radius:6px;opacity:.5}
    .cell.target{background:rgba(255,216,77,.4);border-color:#9d7613;border-style:solid;animation:pulse 1.2s infinite}
    .cell.wrong{outline:4px solid var(--bad);outline-offset:-4px;animation:shake .35s}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,.6)}50%{box-shadow:0 0 0 6px rgba(255,216,77,0)}}
    .cell .hint{position:absolute;top:6px;left:6px;font-size:.7rem;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 6px}
    .cell .arrow{position:absolute;bottom:6px;right:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
    .jonah{position:absolute;width:46px;height:60px;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none;transition:left .35s ease, top .35s ease, transform .35s}
    .jonah svg{width:100%;height:100%}
    .wave-hit{position:absolute;inset:0;background:rgba(63,150,213,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:2rem;z-index:6;opacity:0;pointer-events:none}
    .wave-hit.show{animation:waveFlash .8s}
    @keyframes waveFlash{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1)}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Jonah’s Path</h1>
    <div class="sub">Follow the arrows on each stone to reach Nineveh.</div>
    <div class="hud">
      <div class="chip" id="stepChip">Step 0 / 12</div>
      <div class="chip warn" id="errChip">Waves: 0 / 3</div>
    </div>
    <div class="stage">
      <div class="ocean"><div class="wave a"></div><div class="wave b"></div><div class="wave c"></div></div>
      <div class="nineveh"><div class="gate"></div><div class="label">NINEVEH</div></div>
      <div class="sea-floor"></div>
      <div class="grid" id="grid"></div>
      <div class="wave-hit" id="waveHit">CRASH!</div>
    </div>
  </div>
  <div class="modal-overlay" id="modal" role="dialog" aria-live="assertive">
    <div class="modal-card" id="modalCard">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-text" id="modalText"></div>
      <button type="button" class="modal-btn" id="modalBtn">Try again</button>
    </div>
  </div>
  <script>
    window.GAME_CONFIG = { timerSeconds: 60, timer: true };
    function fitGameToViewport(){document.documentElement.style.setProperty('--game-scale',Math.min(innerWidth/960,innerHeight/540));}
    addEventListener('resize',fitGameToViewport); fitGameToViewport();

    const JONAH_SVG='<svg viewBox="0 0 46 60" xmlns="http://www.w3.org/2000/svg"><circle cx="23" cy="14" r="8" fill="#f8d8b0" stroke="#3a2410" stroke-width="2.5"/><path d="M19 11 q 4 -3 8 0" stroke="#3a2410" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="20" cy="14" r="1.2" fill="#3a2410"/><circle cx="26" cy="14" r="1.2" fill="#3a2410"/><path d="M16 22 q 7 -3 14 0 v 22 h -14 z" fill="#7e57c2" stroke="#3a2410" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 30 l -8 4 M30 30 l 8 4" stroke="#f8d8b0" stroke-width="2.5" stroke-linecap="round"/><path d="M14 44 l 0 12 M22 44 l 0 14 M30 44 l 0 12" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round"/></svg>';
    const ARROW_SVG={
      up:'<svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><path d="M15 4 L 26 16 L 20 16 L 20 26 L 10 26 L 10 16 L 4 16 Z" fill="#3a2410"/></svg>',
      down:'<svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><path d="M15 26 L 4 14 L 10 14 L 10 4 L 20 4 L 20 14 L 26 14 Z" fill="#3a2410"/></svg>',
      left:'<svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><path d="M4 15 L 16 4 L 16 10 L 26 10 L 26 20 L 16 20 L 16 26 Z" fill="#3a2410"/></svg>',
      right:'<svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><path d="M26 15 L 14 4 L 14 10 L 4 10 L 4 20 L 14 20 L 14 26 Z" fill="#3a2410"/></svg>',
    };
    const SUN_SVG='<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="7" fill="#ffd43b" stroke="#1b5e20" stroke-width="2.5"/><g stroke="#1b5e20" stroke-width="2.5" stroke-linecap="round"><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6 6l3 3M23 23l3 3M26 6l-3 3M9 23l-3 3"/></g></svg>';
    const HOURGLASS_SVG='<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M9 4h14l-1 3c-1 3-4 5-6 7 2 2 5 4 6 7l1 3H9l1-3c1-3 4-5 6-7-2-2-5-4-6-7Z" fill="#fff" stroke="#1b5e20" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 4v24" stroke="#1b5e20" stroke-width="2" stroke-dasharray="2 2"/></svg>';

    // Build a winding path of 12 cells across a 5x3 grid (rows 0..2, cols 0..4).
    // Each path cell has an arrow hint pointing to the next cell. The player taps the cell in the indicated direction.
    const PATH = [
      [2,0], [1,0], [1,1], [0,1], [0,2], [1,2], [2,2], [2,3], [1,3], [1,4], [0,4], [2,4]
    ];
    // Compute direction from PATH[i] to PATH[i+1]
    function dirOf(a,b){
      if (b[0] < a[0]) return 'up';
      if (b[0] > a[0]) return 'down';
      if (b[1] < a[1]) return 'left';
      return 'right';
    }
    // For the final cell, the hint is "Nineveh" (right)
    const TOTAL = PATH.length;
    const HINTS = PATH.map((p, i) => i < TOTAL-1 ? dirOf(p, PATH[i+1]) : 'right');

    const grid=document.getElementById('grid'),stage=document.querySelector('.stage');
    const stepChip=document.getElementById('stepChip'),errChip=document.getElementById('errChip');
    const waveHit=document.getElementById('waveHit');
    const modal=document.getElementById('modal'),modalCard=document.getElementById('modalCard'),modalIcon=document.getElementById('modalIcon'),modalTitle=document.getElementById('modalTitle'),modalText=document.getElementById('modalText'),modalBtn=document.getElementById('modalBtn');

    function showModal(kind, title, lines, btnLabel){
      modalCard.classList.remove('success','timeout');
      if(kind==='success') modalCard.classList.add('success');
      if(kind==='timeout') modalCard.classList.add('timeout');
      modalIcon.innerHTML = kind==='success' ? SUN_SVG : HOURGLASS_SVG;
      modalTitle.textContent = title;
      modalText.innerHTML = lines.map(l => /[“”"]/.test(l) ? `<div class="modal-verse">${l}</div>` : `<div>${l}</div>`).join('');
      modalBtn.textContent = btnLabel || 'Try again';
      modal.classList.add('active');
      modalBtn.onclick = () => location.reload();
    }

    let step = 0, errors = 0, over = false, busy = false;
    const MAX_ERR = 3;
    const cells = [];
    const jonah = document.createElement('div');
    jonah.className = 'jonah';
    jonah.innerHTML = JONAH_SVG;

    function build(){
      for (let r=0;r<3;r++){
        for (let c=0;c<5;c++){
          const d = document.createElement('div');
          d.className = 'cell';
          d.dataset.r = r; d.dataset.c = c;
          d.addEventListener('click', ()=> onTap(d));
          grid.appendChild(d);
          cells.push(d);
        }
      }
      grid.appendChild(jonah);
    }

    function getCell(r,c){ return cells.find(x => +x.dataset.r === r && +x.dataset.c === c); }

    function placeJonahAt(r,c){
      const cell = getCell(r,c);
      if (!cell) return;
      const gridRect = grid.getBoundingClientRect();
      const cellRect = cell.getBoundingClientRect();
      jonah.style.left = (cellRect.left - gridRect.left + cellRect.width/2 - 23) + 'px';
      jonah.style.top  = (cellRect.top - gridRect.top + cellRect.height/2 - 30) + 'px';
    }
    function placeJonahOffStage(){
      // Move toward the Nineveh tower on the right
      jonah.style.left = (grid.getBoundingClientRect().right - 60) + 'px';
      jonah.style.top  = (grid.getBoundingClientRect().top + grid.getBoundingClientRect().height/2) + 'px';
    }

    function refreshHints(){
      cells.forEach(c => { c.classList.remove('target','used','wrong'); c.innerHTML=''; });
      // Mark all path cells up to step-1 as used
      for (let i=0;i<step;i++){
        const [r,c] = PATH[i];
        const cell = getCell(r,c);
        if (cell){
          cell.classList.add('used');
          cell.innerHTML = '';
        }
      }
      // Mark current cell with hint
      if (step < TOTAL){
        const [r,c] = PATH[step];
        const cell = getCell(r,c);
        if (cell){
          cell.classList.add('target');
          const hint = HINTS[step];
          const num = document.createElement('div');
          num.className='hint';
          num.textContent = (step+1);
          cell.appendChild(num);
          if (hint){
            const a = document.createElement('div');
            a.className = 'arrow';
            a.innerHTML = ARROW_SVG[hint];
            cell.appendChild(a);
          }
        }
      }
    }

    function onTap(cell){
      if (over || busy) return;
      if (step >= TOTAL) return;
      const r = +cell.dataset.r, c = +cell.dataset.c;
      const [er, ec] = PATH[step];
      if (r === er && c === ec){
        cell.classList.remove('target');
        cell.classList.add('used');
        placeJonahAt(r,c);
        step++;
        stepChip.textContent = `Step ${step} / ${TOTAL}`;
        if (step >= TOTAL){
          setTimeout(()=>{ placeJonahOffStage(); setTimeout(()=> finish(true), 600); }, 350);
        } else {
          refreshHints();
        }
      } else {
        cell.classList.add('wrong');
        errors++;
        errChip.textContent = `Waves: ${errors} / ${MAX_ERR}`;
        showWave();
        setTimeout(()=> cell.classList.remove('wrong'), 400);
        if (errors >= MAX_ERR) finish(false, 'too many waves');
      }
    }

    function showWave(){
      waveHit.classList.remove('show');
      void waveHit.offsetWidth;
      waveHit.classList.add('show');
    }

    function finish(success, reason){
      if (over) return;
      over = true;
      if (success){
        showModal('success','Nineveh is reached!',['The people of Nineveh heard the message.', '"When God saw what they did and how they turned from their evil ways, he relented." — Jonah 3:10'],'Try again');
        window.dispatchEvent(new CustomEvent('game-complete'));
        if (window.parent !== window) window.parent.postMessage({type:'game-complete', game:'jonah_path'}, '*');
      } else {
        showModal('timeout','Jonah was tossed back!',[reason || 'Too many waves.', '"Now the Lord provided a huge fish to swallow Jonah." — Jonah 1:17'],'Try again');
        window.dispatchEvent(new CustomEvent('game-over'));
      }
    }

    build();
    refreshHints();
    placeJonahAt(PATH[0][0], PATH[0][1]);
    stepChip.textContent = `Step 0 / ${TOTAL}`;
    addEventListener('game-timeout', () => { if (!over) finish(false, 'time up'); });
  </script>
</body>
</html>
