<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adam & Eve – Built by Faith</title>
<style>
:root{--bg:#f6f1e6;--card:#fffaf0;--ink:#2b2418;--mute:#7a6c52;--gold:#b8860b;--btn:#3b2f1a;--btnink:#fff6dc;--chip:#efe4c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110b;--card:#211a10;--ink:#f1e7d0;--mute:#b3a483;--gold:#e5b94a;--btn:#e5b94a;--btnink:#1a1408;--chip:#32281a}}
:root[data-theme="dark"]{--bg:#15110b;--card:#211a10;--ink:#f1e7d0;--mute:#b3a483;--gold:#e5b94a;--btn:#e5b94a;--btnink:#1a1408;--chip:#32281a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
.w{max-width:600px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.4rem;text-align:center;margin:4px 0 10px}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:14px;padding:12px;margin-bottom:12px}
.ref{color:var(--gold);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.bar{display:flex;justify-content:space-between;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:8px 11px;font:inherit;color:var(--ink);cursor:pointer}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn:disabled,.chip:disabled{opacity:.4}.w100{width:100%;text-align:center}
.slots{display:flex;gap:8px;margin:8px 0}
.slot{flex:1;height:54px;border:2px dashed var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plot{background:var(--chip);border-radius:12px;padding:10px 4px;text-align:center}
.plot .e{font-size:2rem;min-height:2.6rem}.plot .btn{padding:7px 4px;font-size:.85rem;width:100%}
.mute{color:var(--mute);font-size:.9rem}
.log{min-height:2.6em;font-style:italic;color:var(--mute)}
.need{display:flex;gap:8px;flex-wrap:wrap}.need span{background:var(--chip);border-radius:8px;padding:6px 10px}.need .ok{outline:2px solid var(--gold)}
.quote{border-left:3px solid var(--gold);padding-left:10px;margin:8px 0}
h3{margin:0 0 6px;font-size:1rem}
</style><style>
:root,:root[data-theme="dark"],:root[data-theme="light"]{--bg:#183444;--card:#fff4d6;--ink:#172b38;--mute:#4f5c60;--gold:#8c531d;--btn:#ffb45c;--btnink:#172b38;--chip:#f5dfac}
body{font-family:system-ui,sans-serif}.w{max-width:760px;padding:16px 14px 40px}h1{font:900 clamp(28px,6vw,42px)/1.15 system-ui;color:#ffcf65;margin:24px 0}.card{border:3px solid #101925;box-shadow:4px 4px #101925;border-radius:6px;margin-bottom:18px;background-color:var(--card);background-image:radial-gradient(#172b3818 1px,transparent 1px);background-size:12px 12px}.chip,.btn{min-height:44px;min-width:44px;border:2px solid #172b38;border-radius:5px;font-weight:800;touch-action:manipulation;overflow-wrap:anywhere}.btn{box-shadow:3px 3px #101925}.row{gap:10px}.slot{min-width:44px}.craft-test-nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;color:#fff4d6}.craft-test-nav a{display:inline-block;color:inherit;padding:10px 0;min-height:44px}.craft-test-nav button{font:800 14px system-ui;min-height:44px;border:3px solid #101925;background:#ffb45c;color:#172b38;padding:8px 12px;border-radius:5px;cursor:pointer}.craft-test-note{background:#dfcff2;color:#172b38;padding:12px;border-radius:5px;font-size:14px}.bar{color:#fff4d6}.row>.btn{white-space:normal}button:focus-visible,a:focus-visible{outline:4px solid #2885ce;outline-offset:3px}
</style></head><body><div class="w"><nav class="craft-test-nav" aria-label="Game testing"><a href="index.html">← Adam &amp; Eve games</a><button id="craftRestart" type="button">Restart</button><a href="index.html">Skip →</a></nav><p class="craft-test-note">Crafting v2 standalone test. This prototype does not save story progress. Each day has six actions. When they run out, choose Start new day to keep playing.</p><h1>🌳 Adam & Eve</h1><div id="app"></div></div>
<script>
const HUB="index.html",COMIC="https://purna.github.io/bible-stories/Adam/";
const IC={Seed:"🌱",Water:"💧",Branch:"🪵","Fig leaf":"🍃",Stone:"🪨",Lamb:"🐑",Bed:"🟫",Altar:"🗿","Fig Apron":"🌿",Garment:"🧥",Fruit:"🍇"};
const R=[
{n:"Bed",ing:["Seed","Water"],t:"A seed pressed into wet soil."},
{n:"Altar",ing:["Stone","Stone","Branch"],t:"Stones stacked and topped with wood."},
{n:"Fig Apron",ing:["Fig leaf","Fig leaf"],t:"The first thing they thought of: leaves stitched together."},
{n:"Garment",ing:["Fig Apron","Lamb"],t:"Leaves aren't enough. God supplies the covering."}];
const K=[
{n:"Tend the Garden",r:"Genesis 2",par:3,raws:["Seed","Water","Branch"],need:{Fruit:4},
 w:"God planted a garden and gave Adam work to do in it. Prepare beds, plant, water, and wait. Offer the first fruits of the garden.",
 v:"Fruit grew from the soil, as God had given. The garden was meant for friendship with Him.",l:"Faith works with what God provides and waits for Him to give the growth."},
{n:"Covered by God",r:"Genesis 3–4 · Hebrews 11:4",par:2,raws:["Stone","Branch","Fig leaf","Lamb"],need:{Garment:1,Altar:1},
 w:"They hid, and sewed leaves to cover themselves. It wasn't enough. God clothed them. Later, Abel offered a better sacrifice. Make a covering and an altar.",
 v:"God made garments of skin and clothed them. By faith, Abel offered a better sacrifice, and through it he still speaks.",l:"Faith can't cover itself. It trusts the covering God gives."}];
let S;
function init(){S={c:0,day:1,start:1,act:6,inv:{},disc:{Fruit:1},slots:[],plots:[0,0,0],stars:0,rev:null,fin:false,log:"The garden is quiet. Begin."}}
const add=(k,n)=>S.inv[k]=(S.inv[k]||0)+n,has=k=>S.inv[k]||0;
function gather(k){if(S.act<1)return;S.act--;const n=2+(Math.random()<.35?1:0);add(k,n);S.log=`You gathered ${n} ${k.toLowerCase()}.`;draw()}
function pick(k){if(S.slots.length>=3||S.slots.filter(x=>x==k).length>=has(k))return;S.slots.push(k);draw()}
function craft(){if(S.act<1||S.slots.length<2)return;const key=[...S.slots].sort().join();
const r=R.find(r=>[...r.ing].sort().join()==key);S.act--;
if(r){S.slots.forEach(k=>S.inv[k]--);add(r.n,1);const f=!S.disc[r.n];S.disc[r.n]=1;S.log=`${IC[r.n]} You made: ${r.n}${f?" (new recipe!)":""}.`}
else S.log="Nothing useful came of that. Materials kept.";S.slots=[];draw()}
function plant(i){if(S.act<1||has("Bed")<1||S.plots[i])return;S.act--;S.inv.Bed--;S.plots[i]=1;S.log="Planted. It needs water.";draw()}
function water(i){if(S.act<1||has("Water")<1||S.plots[i]!=1)return;S.act--;S.inv.Water--;S.plots[i]=2;S.log="Watered. Now you wait for the night.";draw()}
function harvest(i){if(S.act<1||S.plots[i]!=3)return;S.act--;S.plots[i]=0;add("Fruit",2);S.log="🍇 Two fruit harvested.";draw()}
function rest(){S.day++;S.act=6;S.slots=[];S.plots=S.plots.map(p=>p==2?3:p);S.log=S.plots.includes(3)?"Overnight, something grew.":"A new day.";draw()}
const need=()=>K[S.c].need,can=()=>Object.entries(need()).every(([k,n])=>has(k)>=n);
function deliver(){Object.entries(need()).forEach(([k,n])=>S.inv[k]-=n);const d=S.day-S.start+1,p=K[S.c].par;const st=d<=p?3:d<=p+2?2:1;S.stars+=st;S.rev=st;draw()}
function nextC(){S.rev=null;S.c++;if(S.c>=K.length)S.fin=true;else{S.start=S.day;S.act=6;S.slots=[];S.plots=[0,0,0];S.log="A new calling."}draw()}
function draw(){const c=K[S.c]||K[1];
if(S.fin){app.innerHTML=`<div class="card"><div class="ref">Hebrews 11:4</div><div class="quote">By faith Abel offered God a more acceptable sacrifice… and through his faith, though he died, he still speaks.</div>
<p>You finished with <b>${S.stars} ✨</b> of 6. The garden, the covering and the altar were all made in advance of the answer. That's how the Bible describes faith: trusting what God has said and doing the next thing.</p></div>
<div class="row"><button class="btn" onclick="init();draw()">Play again</button><a class="btn" href="${HUB}">All stories</a><a class="btn" href="index.html">Read the comic</a></div>`;return}
if(S.rev){app.innerHTML=`<div class="card"><div class="ref">${c.n} · ${c.r}</div><h3>The unseen is revealed</h3><p>${c.v}</p><div class="quote">${c.l}</div><p class="mute">Day ${S.day-S.start+1} (par ${c.par}) → ${"✨".repeat(S.rev)}</p></div>
<button class="btn w100" onclick="nextC()">${S.c<K.length-1?"Next calling →":"Finish"}</button>`;return}
const inv=Object.keys(S.inv).filter(k=>S.inv[k]>0);
const nd=Object.entries(need()).map(([k,n])=>`<span class="${has(k)>=n?'ok':''}">${IC[k]} ${S.disc[k]?k:"???"} ×${n} (${has(k)})</span>`).join("");
const notes=R.filter(r=>S.c==1||r.n=="Bed").map(r=>`<div class="mute">${S.disc[r.n]?`${IC[r.n]} <b>${r.n}</b> = ${r.ing.map(i=>IC[i]).join(" + ")}`:`❓ ${r.t}`}</div>`).join("");
const pl=S.c==0?`<div class="card"><h3>Garden plots</h3><div class="plots">${S.plots.map((p,i)=>`<div class="plot"><div class="e">${["🟫","🌱","💧","🍇"][p]}</div>${p==0?`<button class="btn" ${has("Bed")<1||S.act<1?'disabled':''} onclick="plant(${i})">Plant</button>`:p==1?`<button class="btn" ${has("Water")<1||S.act<1?'disabled':''} onclick="water(${i})">Water</button>`:p==2?`<div class="mute">Grows overnight</div>`:`<button class="btn" ${S.act<1?'disabled':''} onclick="harvest(${i})">Harvest</button>`}</div>`).join("")}</div><div class="mute">Plant needs a Bed, water needs Water. Each costs 1 ⚡.</div></div>`:"";
app.innerHTML=`<div class="bar"><span>Day ${S.day}</span><span>⚡ ${S.act}/6</span><span>✨ ${S.stars}</span></div>
<div class="card"><div class="ref">${c.n} · ${c.r}</div><p style="margin:6px 0">${c.w}</p><div class="need">${nd}</div></div>
<div class="card"><h3>Gather (1 ⚡)</h3><div class="row">${c.raws.map(k=>`<button class="chip" ${S.act<1?'disabled':''} onclick="gather('${k}')">${IC[k]} ${k}</button>`).join("")}</div></div>${pl}
<div class="card"><h3>Bench (1 ⚡)</h3><div class="row">${inv.map(k=>`<button class="chip" onclick="pick('${k}')">${IC[k]} ${k} ×${S.inv[k]}</button>`).join("")||'<span class="mute">Empty. Go gather.</span>'}</div>
<div class="slots">${[0,1,2].map(i=>`<div class="slot" onclick="S.slots.splice(${i},1);draw()">${S.slots[i]?IC[S.slots[i]]:""}</div>`).join("")}</div>
<div class="row"><button class="btn" ${S.act<1||S.slots.length<2?'disabled':''} onclick="craft()">🔨 Combine</button><button class="btn" onclick="S.slots=[];draw()">Clear</button></div><div class="log">${S.log}</div></div>
<div class="row"><button class="btn" style="flex:1" ${can()?'':'disabled'} onclick="deliver()">✅ Offer it in faith</button><button class="btn" onclick="rest()">🌙 End day</button></div>
<div class="card"><h3>Recipe notes</h3>${notes}</div>`}
init();draw();
</script><!-- crafting-day-feedback:start --><script>/* Clear day boundaries without discarding inventory or planting progress. */
(()=>{
 const originalDraw=draw,originalRest=rest;let wasExhausted=false,newDayMessage='';
 const style=document.createElement('style');style.textContent=`.craft-day-message{background:#dfcff2;color:#172b38;border:3px solid #172b38;border-radius:8px;padding:16px;margin:14px 0;box-shadow:4px 4px #172b38;font:700 16px/1.5 system-ui}.craft-day-message h2{font:900 25px/1.2 system-ui;margin:0 0 8px}.craft-day-message p{margin:0 0 12px}.craft-day-message button{min-height:48px;border:3px solid #172b38;border-radius:5px;background:#ffb45c;color:#172b38;padding:12px 18px;font:900 17px system-ui;cursor:pointer}.craft-day-message button:focus-visible{outline:4px solid #2885ce;outline-offset:4px}`;document.head.append(style);
 draw=function(){
  originalDraw();if(typeof S==='undefined'||!S)return;
  const exhausted=S.act<=0&&!S.rev&&!S.fin;
  if(exhausted||newDayMessage){
   const panel=document.createElement('section');panel.className='craft-day-message';panel.id='craftDayMessage';panel.setAttribute('role','status');panel.setAttribute('aria-live','polite');
   const title=document.createElement('h2');title.textContent=exhausted?'Day '+S.day+' is over!':'A new day begins!';
   const description=document.createElement('p');description.textContent=exhausted?'You have used all six actions. Rest to get six new actions. Your materials and crafting progress are safe.':newDayMessage;
   panel.append(title,description);
   if(exhausted){const next=document.createElement('button');next.type='button';next.id='craftStartDay';next.textContent='Start new day →';next.setAttribute('aria-label','Start new day, day '+(S.day+1));next.onclick=()=>rest();panel.append(next);}
   document.getElementById('app').prepend(panel);
   if(exhausted&&!wasExhausted){const next=panel.querySelector('button');next.focus({preventScroll:true});panel.scrollIntoView({block:'nearest',behavior:'instant'});}
  }
  document.querySelectorAll('button[onclick="rest()" ]').forEach(button=>{button.hidden=exhausted;button.textContent='Rest until tomorrow';});
  wasExhausted=exhausted;newDayMessage='';
 };
 rest=function(){newDayMessage='Day '+(S.day+1)+' has started. You have six fresh actions. Keep gathering and crafting!';wasExhausted=false;originalRest();};
 if(typeof S!=='undefined'&&S)draw();
})();
</script><!-- crafting-day-feedback:end --><script>document.querySelector('#craftRestart').onclick=()=>location.reload();document.body.dataset.craftingReady='true';</script></body></html>
