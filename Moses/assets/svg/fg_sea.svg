<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Walls of water on each side -->
  <g>
    <!-- left wall -->
    <path d="M0 0 L0 600 L160 540 L160 80 Z" fill="#173f70" stroke="#0A0812" stroke-width="3"/>
    <path d="M0 0 L0 600 L160 540 L160 80 Z" fill="url(#wallGrad1)"/>
    <defs>
      <linearGradient id="wallGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0a1430" stop-opacity=".7"/>
        <stop offset="100%" stop-color="#173f70" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="wallGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#0a1430" stop-opacity=".7"/>
        <stop offset="100%" stop-color="#173f70" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- water detail strokes (left) -->
    <g stroke="#88d0ff" stroke-width="2" fill="none" opacity=".6">
      <path d="M30 60 Q60 90 30 120 Q60 150 30 180"/>
      <path d="M70 100 Q100 130 70 160 Q100 190 70 220"/>
      <path d="M110 200 Q140 230 110 260 Q140 290 110 320"/>
      <path d="M40 350 Q70 380 40 410 Q70 440 40 470"/>
    </g>
    <!-- right wall -->
    <path d="M800 0 L800 600 L640 540 L640 80 Z" fill="#173f70" stroke="#0A0812" stroke-width="3"/>
    <path d="M800 0 L800 600 L640 540 L640 80 Z" fill="url(#wallGrad2)"/>
    <g stroke="#88d0ff" stroke-width="2" fill="none" opacity=".6">
      <path d="M770 60 Q740 90 770 120 Q740 150 770 180"/>
      <path d="M730 100 Q700 130 730 160 Q700 190 730 220"/>
      <path d="M690 200 Q660 230 690 260 Q660 290 690 320"/>
      <path d="M760 350 Q730 380 760 410 Q730 440 760 470"/>
    </g>
  </g>
  <!-- sand path centre (raised above seabed) -->
  <path d="M340 100 Q360 200 350 300 Q340 400 360 500 L440 500 Q460 400 450 300 Q440 200 460 100 Z" fill="#c8a060" stroke="#0A0812" stroke-width="3"/>
  <!-- footprints on path -->
  <g fill="#7a5028" opacity=".7">
    <ellipse cx="400" cy="180" rx="10" ry="6"/>
    <ellipse cx="380" cy="220" rx="10" ry="6"/>
    <ellipse cx="420" cy="260" rx="10" ry="6"/>
    <ellipse cx="385" cy="300" rx="10" ry="6"/>
    <ellipse cx="415" cy="340" rx="10" ry="6"/>
    <ellipse cx="395" cy="380" rx="10" ry="6"/>
    <ellipse cx="405" cy="420" rx="10" ry="6"/>
    <ellipse cx="395" cy="460" rx="10" ry="6"/>
  </g>
  <!-- small walking figures (people) -->
  <g fill="#7a5028" stroke="#0A0812" stroke-width="1">
    <circle cx="380" cy="210" r="5"/>
    <rect x="377" y="215" width="6" height="14"/>
    <circle cx="420" cy="280" r="5"/>
    <rect x="417" y="285" width="6" height="14"/>
    <circle cx="395" cy="360" r="5"/>
    <rect x="392" y="365" width="6" height="14"/>
  </g>
</svg>