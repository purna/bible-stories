<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Moses on Nebo foreground figure -->
  <g transform="translate(360,260)">
    <!-- cloak -->
    <path d="M-20 220 Q40 80 100 220 Z" fill="#5a3818" stroke="#0A0812" stroke-width="3"/>
    <!-- hood -->
    <path d="M0 60 Q40 20 80 60 Q70 80 40 80 Q10 80 0 60 Z" fill="#3a2010" stroke="#0A0812" stroke-width="3"/>
    <!-- face -->
    <ellipse cx="40" cy="100" rx="22" ry="28" fill="#d4a070" stroke="#0A0812" stroke-width="3"/>
    <!-- beard -->
    <path d="M22 118 Q40 160 58 118 L52 130 Q40 138 28 130 Z" fill="#eee8dc" stroke="#0A0812" stroke-width="2"/>
    <!-- eyes -->
    <circle cx="32" cy="98" r="2.5" fill="#0A0812"/>
    <circle cx="48" cy="98" r="2.5" fill="#0A0812"/>
    <!-- staff -->
    <rect x="-10" y="80" width="6" height="180" fill="#3a2010" stroke="#0A0812" stroke-width="2"/>
    <circle cx="-7" cy="80" r="6" fill="#5a3818" stroke="#0A0812" stroke-width="2"/>
  </g>
  <!-- distant land of promise -->
  <g transform="translate(0,0)" opacity=".85">
    <!-- a green valley between two hills -->
    <path d="M0 540 L200 460 L300 500 L500 440 L800 520 L800 600 L0 600 Z" fill="#3a5028" stroke="#0A0812" stroke-width="2"/>
    <!-- river -->
    <path d="M100 540 Q200 530 300 545 Q400 555 500 540 Q600 530 700 545 L700 560 Q600 555 500 565 Q400 575 300 565 Q200 555 100 565 Z" fill="#88d0ff" opacity=".7"/>
    <!-- town silhouette -->
    <g fill="#c8a060" stroke="#0A0812" stroke-width="2">
      <rect x="350" y="490" width="14" height="20"/>
      <rect x="370" y="494" width="12" height="16"/>
      <rect x="390" y="488" width="16" height="22"/>
      <rect x="412" y="494" width="12" height="16"/>
      <rect x="430" y="490" width="14" height="20"/>
    </g>
  </g>
  <!-- Joshua silhouette behind Moses -->
  <g transform="translate(490,300)" opacity=".7">
    <circle cx="20" cy="10" r="10" fill="#a06838" stroke="#0A0812" stroke-width="2"/>
    <path d="M5 22 Q20 30 35 22 L30 80 L10 80 Z" fill="#7a5028" stroke="#0A0812" stroke-width="2"/>
  </g>
</svg>