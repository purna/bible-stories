<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Golden calf idol -->
  <g transform="translate(320,200)">
    <!-- base/pedestal -->
    <rect x="0" y="280" width="160" height="40" fill="#3a2818" stroke="#0A0812" stroke-width="3"/>
    <rect x="20" y="320" width="120" height="20" fill="#5a3818" stroke="#0A0812" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="80" cy="220" rx="60" ry="80" fill="#FFD84D" stroke="#0A0812" stroke-width="4"/>
    <!-- face -->
    <ellipse cx="80" cy="120" rx="40" ry="50" fill="#FFD84D" stroke="#0A0812" stroke-width="4"/>
    <!-- horns -->
    <path d="M50 90 Q30 50 50 30" stroke="#FFD84D" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M110 90 Q130 50 110 30" stroke="#FFD84D" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="68" cy="120" rx="6" ry="8" fill="#0A0812"/>
    <ellipse cx="92" cy="120" rx="6" ry="8" fill="#0A0812"/>
    <!-- nostrils -->
    <ellipse cx="74" cy="148" rx="2" ry="3" fill="#0A0812"/>
    <ellipse cx="86" cy="148" rx="2" ry="3" fill="#0A0812"/>
    <!-- mouth -->
    <path d="M65 168 Q80 175 95 168" stroke="#0A0812" stroke-width="3" fill="none"/>
    <!-- belly ring -->
    <circle cx="80" cy="240" r="22" stroke="#FFA040" stroke-width="6" fill="none"/>
  </g>
  <!-- broken tablets on ground -->
  <g transform="translate(180,500) rotate(-15)">
    <rect x="0" y="0" width="80" height="100" rx="6" fill="#a08858" stroke="#0A0812" stroke-width="3"/>
    <path d="M40 0 L42 100" stroke="#0A0812" stroke-width="2"/>
  </g>
  <g transform="translate(540,510) rotate(12)">
    <rect x="0" y="0" width="80" height="100" rx="6" fill="#a08858" stroke="#0A0812" stroke-width="3"/>
  </g>
</svg>