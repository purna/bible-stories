  </g>
  <!-- Nile water -->
  <rect x="0" y="420" width="800" height="180" fill="#1a3850" data-depth="0.4"/>
  <path d="M0 440 Q200 430 400 445 T800 440 L800 460 L0 460 Z" fill="#2a4868" opacity=".6" data-depth="0.4"/>
  <path d="M0 470 Q200 460 400 475 T800 470 L800 490 L0 490 Z" fill="#3a5878" opacity=".5" data-depth="0.4"/>
