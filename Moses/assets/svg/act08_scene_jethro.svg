    <line x1="135" y1="430" x2="135" y2="370"/>
    <line x1="150" y1="430" x2="150" y2="385"/>
    <line x1="660" y1="430" x2="660" y2="375"/>
    <line x1="675" y1="430" x2="675" y2="385"/>
    <line x1="690" y1="430" x2="690" y2="370"/>
  </g>
