      <stop offset="0%" stop-color="#0e1a22"/>
      <stop offset="60%" stop-color="#1a2838"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="basketSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#basketSky)" data-depth="0"/>
  <circle cx="640" cy="120" r="60" fill="url(#basketSun)" data-depth="0.2"/>
  <ellipse cx="640" cy="120" rx="22" ry="22" fill="#FFD84D" opacity=".7" data-depth="0.2"/>
  <!-- distant palace silhouette -->
  <g data-depth="0.3" opacity=".6">
    <path d="M40 380 L80 380 L80 340 L120 340 L120 380 L160 380 L160 320 L100 290 L40 320 Z" fill="#3a2818" stroke="#0A0812" stroke-width="3"/>
