<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- burning bush centerpiece -->
  <g transform="translate(330,300)">
    <!-- bush trunk -->
    <path d="M40 180 Q60 120 30 60 Q35 30 70 20 Q100 10 120 30 Q140 50 130 80 Q120 110 110 130 Q120 160 100 180 Z"
          fill="#3a2010" stroke="#0A0812" stroke-width="3"/>
    <!-- branches -->
    <path d="M70 60 L40 30 L20 10" stroke="#3a2010" stroke-width="6" fill="none"/>
    <path d="M110 50 L150 30 L170 0" stroke="#3a2010" stroke-width="6" fill="none"/>
    <path d="M85 100 L120 90 L150 80" stroke="#3a2010" stroke-width="5" fill="none"/>
    <!-- flames (animated-feel) -->
    <g>
      <path d="M10 0 Q25 -30 35 -50 Q45 -30 55 0 Q40 10 30 0 Q25 5 10 0 Z" fill="#FF6020" stroke="#FFD84D" stroke-width="2"/>
      <path d="M50 -20 Q70 -60 80 -90 Q95 -60 105 -20 Q90 -10 75 -20 Q65 -10 50 -20 Z" fill="#FFB04A" stroke="#FFD84D" stroke-width="2"/>
      <path d="M100 -10 Q90 -40 100 -70 Q115 -50 130 -10 Q115 0 105 -10 Z" fill="#FFD84D" stroke="#FFE89A" stroke-width="2"/>
      <path d="M150 -10 Q160 -40 170 -60 Q180 -40 180 -10 Q165 -5 155 -10 Z" fill="#FF6020" stroke="#FFD84D" stroke-width="2"/>
    </g>
    <!-- inner glow -->
    <ellipse cx="80" cy="40" rx="100" ry="60" fill="#FFB04A" opacity=".25"/>
  </g>
  <!-- a staff leaning against a rock -->
  <g transform="translate(180,440) rotate(-12)">
    <rect x="0" y="0" width="10" height="160" fill="#5a3818" stroke="#0A0812" stroke-width="2"/>
    <circle cx="5" cy="0" r="8" fill="#7a4a1a" stroke="#0A0812" stroke-width="2"/>
  </g>
  <!-- nearby rock -->
  <g transform="translate(140,470)">
    <path d="M0 80 L30 30 L100 20 L130 70 L110 90 L20 90 Z" fill="#5a3818" stroke="#0A0812" stroke-width="3"/>
  </g>
</svg>