<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Tent cluster foreground -->
  <g transform="translate(120,340)">
    <!-- tent 1 -->
    <g>
      <path d="M0 100 L40 20 L80 100 Z" fill="#c89a60" stroke="#0A0812" stroke-width="3"/>
      <path d="M40 20 L40 100" stroke="#7a5028" stroke-width="2"/>
    </g>
    <!-- tent 2 -->
    <g transform="translate(100,30)">
      <path d="M0 100 L40 20 L80 100 Z" fill="#a07840" stroke="#0A0812" stroke-width="3"/>
    </g>
    <!-- tent 3 -->
    <g transform="translate(220,10)">
      <path d="M0 100 L40 20 L80 100 Z" fill="#c89a60" stroke="#0A0812" stroke-width="3"/>
    </g>
    <!-- tent 4 -->
    <g transform="translate(340,40)">
      <path d="M0 100 L40 20 L80 100 Z" fill="#a07840" stroke="#0A0812" stroke-width="3"/>
    </g>
    <!-- tent 5 -->
    <g transform="translate(450,5)">
      <path d="M0 100 L40 20 L80 100 Z" fill="#c89a60" stroke="#0A0812" stroke-width="3"/>
    </g>
  </g>
  <!-- a man carrying matzah on his shoulder -->
  <g transform="translate(180,440)">
    <!-- head -->
    <circle cx="20" cy="10" r="10" fill="#d4a070" stroke="#0A0812" stroke-width="2"/>
    <!-- body -->
    <path d="M5 22 Q20 30 35 22 L30 80 L10 80 Z" fill="#a06838" stroke="#0A0812" stroke-width="2"/>
    <!-- staff -->
    <rect x="32" y="20" width="4" height="80" fill="#5a3818" stroke="#0A0812" stroke-width="2"/>
  </g>
</svg>