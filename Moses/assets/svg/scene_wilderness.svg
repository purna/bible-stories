<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" data-parallax="true">
  <defs>
    <linearGradient id="wildSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="60%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wildSky)" data-depth="0"/>
  <!-- sun -->
  <circle cx="200" cy="120" r="30" fill="#d4a050" opacity=".5" data-depth="0.1"/>
  <circle cx="200" cy="120" r="18" fill="#d4a050" opacity=".9" data-depth="0.1"/>
  <!-- far mountains -->
  <path d="M0 340 L100 280 L220 320 L360 240 L520 300 L660 260 L800 320 L800 600 L0 600 Z" fill="#2a1d10" stroke="#0A0812" stroke-width="3" data-depth="0.3"/>
  <!-- middle ridges -->
  <path d="M0 420 L120 380 L260 410 L400 360 L540 400 L680 370 L800 410 L800 600 L0 600 Z" fill="#4a3018" stroke="#0A0812" stroke-width="3" data-depth="0.5"/>
  <!-- foreground rocks -->
  <g fill="#5a3818" stroke="#0A0812" stroke-width="2" data-depth="0.7">
    <ellipse cx="120" cy="520" rx="60" ry="22"/>
    <ellipse cx="380" cy="540" rx="80" ry="24"/>
    <ellipse cx="640" cy="530" rx="70" ry="20"/>
  </g>
  <!-- ground -->
  <rect x="0" y="510" width="800" height="90" fill="#3a2818" data-depth="0.8"/>
  <!-- tracks -->
  <g stroke="#1a0e08" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity=".6" data-depth="0.9">
    <path d="M0 570 Q400 550 800 560"/>
  </g>
</svg>