<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Manna flakes falling -->
  <g fill="#fff3cf" stroke="#0A0812" stroke-width="1">
    <circle cx="120" cy="80"  r="6"/>
    <circle cx="200" cy="140" r="7"/>
    <circle cx="320" cy="60"  r="5"/>
    <circle cx="420" cy="100" r="6"/>
    <circle cx="540" cy="140" r="7"/>
    <circle cx="660" cy="80"  r="6"/>
    <circle cx="80"  cy="200" r="5"/>
    <circle cx="240" cy="240" r="6"/>
    <circle cx="380" cy="200" r="7"/>
    <circle cx="500" cy="260" r="5"/>
    <circle cx="620" cy="200" r="6"/>
    <circle cx="720" cy="260" r="5"/>
  </g>
  <!-- a basket of manna -->
  <g transform="translate(330,360)">
    <path d="M0 80 L0 130 Q0 150 70 150 Q140 150 140 130 L140 80 Z" fill="#a06a30" stroke="#0A0812" stroke-width="3"/>
    <path d="M10 100 H130 M10 120 H130" stroke="#7a4a1a" stroke-width="2"/>
    <!-- pile of manna -->
    <path d="M5 80 Q70 30 135 80 Z" fill="#fff3cf" stroke="#0A0812" stroke-width="2"/>
  </g>
  <!-- a quail silhouette in flight -->
  <g transform="translate(540,160)" stroke="#0A0812" stroke-width="2" fill="#a06838">
    <ellipse cx="20" cy="20" rx="18" ry="10"/>
    <path d="M0 18 Q-8 10 -16 18 L0 24 Z"/>
    <path d="M38 14 L48 8 L48 22 Z"/>
  </g>
  <!-- water flowing from a rock -->
  <g transform="translate(580,400)">
    <path d="M0 80 L40 0 L80 80 Z" fill="#7a5028" stroke="#0A0812" stroke-width="3"/>
    <path d="M40 0 L40 80" stroke="#88d0ff" stroke-width="6"/>
    <path d="M30 80 Q40 100 50 80" stroke="#88d0ff" stroke-width="4" fill="none"/>
  </g>
</svg>