<title>Scene Designer — Elisha</title>
<!--
  SCENE DIRECTOR NOTES — Elisha (1 Kings 19; 2 Kings 2–7)
  9 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Mantle
     Elijah finds Elisha ploughing with twelve yoke of oxen; Elisha slaughters his oxen and follows, leaving the plough behind. Stage: a wide field at dawn, twelve oxen, a ploughman pausing mid-furrow; the old prophet's mantle cast over him; golden stubble and long shadows.

  2. The Jordan
     Elijah strikes the water with his mantle and the two cross on dry ground; Elisha inherits a double portion. Stage: the Jordan in flood, the river parting, two figures walking on the riverbed; churned water walls; early light.

  3. The Widow’s Oil
     A widow of the sons of the prophets pours her little oil into borrowed jars until the oil fills every vessel and saves her sons from slavery. Stage: a poor cottage interior, jars lined up row on row, the oil streaming from one small flask; warm interior light, the widow's astonished hands.

  4. The Shunammite Room
     A great woman of Shunhem builds a chamber for Elisha with a bed, table, stool and lampstand. Stage: a rooftop guest chamber, whitewashed walls, a simple bed and lamp, the woman looking up as the prophet arrives; noon light through a lattice.

  5. The Child
     The Shunammite's son collapses in the field; she carries him to the room and lays him on Elisha's bed, and the prophet restores him. Stage: a field at midday, a child limp in his mother's arms, then the room with the boy breathing again; urgency, then quiet light.

  6. Naaman
     Naaman, commander of Aram, comes with horses and chariots to be healed of leprosy; Elisha sends him to wash seven times in the Jordan. Stage: a riverbank with a retinue of chariots and horsemen, the proud commander wading to his waist, seven immersions; water gleaming, pride yielding.

  7. The Floating Axe
     A borrowed axe head sinks in the Jordan; Elisha cuts a stick, throws it in, and the iron swims. Stage: a river bend at dawn, an axe glinting on the bed, a stick tossed from the bank, the iron rising; cool water, a small miracle.

  8. The Unseen Army
     The king of Aram surrounds Dothan; Elisha prays and the servant sees a mountain full of horses and chariots of fire. Stage: a dawn plain, a city under siege, a servant's eyes opening to an invisible army blazing on the hills; firelight on the clouds.

  9. A Blind Feast
     Elisha strikes the Aramean raiders with blindness, leads them into Samaria, and opens their eyes at a feast before sending them home. Stage: a great hall at night, lanterns, blindfolded warriors led to a table, then seeing in amazement; warm feast light, an astonishing mercy.
  -->
