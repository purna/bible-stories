<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Daniel</title>
<!--
  SCENE DIRECTOR NOTES — Daniel (Daniel 1–12)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. Exile and the Table
     Daniel and his friends, carried to Babylon, refuse the king's food and ask for ten days of vegetables and water. Stage: a Babylonian court cafeteria in torchlight, trays of rich food beside a humble plate of pulses; four resolute youths; jewelled walls, shadowed arcades.

  2. The Great Statue
     Nebuchadnezzar dreams of a colossal statue — gold head, silver chest, bronze belly, iron legs, feet of clay — shattered by a stone that becomes a mountain. Stage: the dream image towering in a night sky over Babylon, metals graded top to bottom, a stone striking the feet; cold moonlight and a blast of light as it falls.

  3. The Furnace
     Shadrach, Meshach and Abednego are bound and cast into the blazing furnace, where a fourth figure like a son of the gods walks with them. Stage: a roaring furnace mouth on a Babylonian plain, soldiers flinging bound youths into white heat; inside, four figures unharmed; furnace orange, king and court watching from shaded terraces.

  4. The Proud King
     Nebuchadnezzar is driven from human society, eating grass like an ox until his reason returns. Stage: a royal garden gone wild, the king grown long-haired and wild-eyed among stalks and dew; gold and madness fading to humble green; a shaft of light as his sanity is restored.

  5. Writing on the Wall
     At Belshazzar's feast a hand writes on the plaster: mene, mene, tekel, upharsin — and Daniel reads the doom. Stage: a thousand-guest banquet hall, gold vessels looted from Jerusalem, candlelight and a ghostly disembodied hand tracing glowing letters on the wall; terror among the revellers.

  6. The Lions' Den
     Daniel is thrown into the lions' den for praying to his God; the lions are shut with him and an angel shuts their mouths. Stage: a stone pit under a pale dawn, lions pacing around an unharmed figure in prayer; the king hurrying at first light; cold stone, warm hope.

  7. Four Beasts
     Daniel sees the sea churned by four beasts — lion, bear, leopard, and a fourth with iron teeth and ten horns — before the Ancient of Days takes his throne. Stage: a stormy apocalyptic sea, beasts rising from foam, thrones of fire set in a court of millions; terrifying grandeur in ash and gold.

  8. The Ram and Goat
     The ram with two horns and the swift goat with one horn clash; the goat's horn breaks into four, and a little horn grows proud. Stage: a riverside plain at dusk, a two-horned ram charging, a goat hurtling from the west with a great horn; the horn splintering into four shards; purple and dusk light.

  9. Seventy Weeks
     The angel Gabriel explains seventy weeks decreed for the people and the holy city, until the Anointed One is cut off. Stage: an angel standing on a riverbank at twilight, scroll and measuring line in hand, the distant city on its hill; patient gold light, a sense of long promise.

  10. Final Vision
     Daniel sees the end: the Ancient of Days, the Son of Man given everlasting dominion, and the book of destiny. Stage: a river of fire and a heavenly court, a figure like a son of man approaching on the clouds; sealed scrolls opening; blinding white and deep ultramarine.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
