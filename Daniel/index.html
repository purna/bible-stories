<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Book of Daniel - An interactive comic book experience. Read offline with our PWA service worker!">
    <meta name="theme-color" content="#e94560">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Daniel — Interactive Comic</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="story-runtime.css">
    <link rel="stylesheet" href="loading-screen.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="daniel-comic.css">
    <link rel="stylesheet" href="info-modal.css">
</head>

<body>
    <div id="startScreen">
        <div class="comic-cover">
            <div class="issue">SPECIAL EDITION #1</div>
            <h1>DANIEL!</h1>
            <div class="subtitle">& the Lion's Den</div>
            <div class="bigicon">🦁</div>
            <p>An interactive comic book experience! Navigate using arrows, swipes, or scroll.</p>
            <button id="startBtn">LAUNCH COMIC</button>
        </div>
    </div>

    <div id="app">
        <div id="bgGradient"></div>
        <canvas id="particles"></canvas>
        <div id="halftoneOverlay"></div>

        <div id="hud">
            <select id="chapterSelect"></select>
            <div id="dots"></div>
            <div id="meterBar" class="hidden">
                <div id="meterFill"></div>
                <div id="meterLabel">SET APART</div>
            </div>
        </div>

        <div id="stageWrap">
            <div id="stage"></div>
            <div id="visionOverlay"></div>
            <div id="fragmentCounter" class="hidden" role="status" aria-live="polite">
                <span id="fragCount">0 / 0</span>
                <span id="visionTimer">60s</span>
                <span id="visionClarity">Clear</span>
            </div>
        </div>

        <div id="choices"></div>
        <div id="delayNote"></div>

        <div id="navHints">
            <span>◀ Use Left/Right Arrow keys or swipe ▶</span>
            <span>· ↓ Scroll down at line end to drop into next chapter ·</span>
        </div>
        <button id="audioToggle" type="button" title="Turn audio off" aria-label="Turn audio off"></button>
        <button id="nextBtn">Next Chapter ↴</button>
        <button id="nextLineBtn">Next →</button>
    </div>

    <div id="portal"></div>

    <footer class="tools-footer" aria-label="Story creation tools">
        <span>Create assets</span>
        <a href="tools/texture-forge.html">Texture Forge</a>
        <a href="tools/character_head_generator.html">Character Generator</a>
    </footer>

    <script src="asset-download-manager.js"></script>
    <script src="story-runtime.js"></script>
    <script src="loading-screen.js"></script>
    <script src="audio-manager.js"></script>
    <script src="info-modal.js"></script>
    <script src="vendor/three.r128.min.js"></script>
    <script src="daniel-scenes-helpers.js"></script>
    <script src="assets/scenes/act2_statue_dream.js"></script>
    <script src="assets/scenes/act4_hand_writing.js"></script>
    <script src="assets/scenes/act2_throne_room.js"></script>
    <script src="assets/scenes/act1_babylon_city.js"></script>
    <script src="assets/scenes/act3_furnace_lit.js"></script>
    <script src="assets/scenes/act4_babylon_falls.js"></script>
    <script src="assets/scenes/act5_lions_den_open.js"></script>
    <script src="assets/scenes/act3_golden_statue.js"></script>
    <script src="assets/scenes/act1_babylon_court.js"></script>
    <script src="assets/scenes/act5_persian_court.js"></script>
    <script src="assets/scenes/act2_daniel_prays.js"></script>
    <script src="assets/scenes/act2_nebuchadnezzar_bows.js"></script>
    <script src="assets/scenes/act5_daniel_praying_window.js"></script>
    <script src="stateManager.js" defer></script>
    <script src="decisionLog.js" defer></script>
    <script src="visionEngine.js" defer></script>
    <script src="parallax.js" defer></script>
    <script src="vfx.js" defer></script>
    <script src="daniel-comic.js" defer></script>
    <script>
        window.addEventListener('load', async () => {
            try {
                await screen.orientation?.lock?.('landscape');
            } catch {
                // Orientation locking may be unavailable outside an installed PWA or fullscreen mode.
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const registerStoryWorker = () => navigator.serviceWorker.register('sw.js');
                if (window.__storyAssetsReady) registerStoryWorker();
                else window.addEventListener('story:assetsready', registerStoryWorker, { once: true });
            });
        }
    </script>
</body>

</html>
