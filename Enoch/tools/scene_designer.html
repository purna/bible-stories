  SCENE DIRECTOR NOTES — Enoch (Genesis 5:21–24)
  7 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. A Family Record
     The generations from Adam are recorded, and Jared fathers Enoch, who walks in a line of long-lived fathers and sons. Stage: a family register in a tent at dusk, names spoken aloud, a child held up; lamplight on a written scroll, the long line of ancestors behind.

  2. The First Walk
     Enoch begins a daily walk — a habit of quiet steps that makes room for the presence of God. Stage: a dawn road through early fields, a lone figure walking, the city behind; cool morning light, birds lifting.

  3. A Son Named Methuselah
     Enoch fathers Methuselah and a home is prepared for the child. Stage: a small house at sunrise, a newborn in swaddling cloth, the father at the door; a lamp lit in the window, a warm quiet room.

  4. Years of Faithfulness
     Three hundred years of small, repeated acts — teaching, tending, giving — with no fanfare. Stage: the changing seasons of a single street: sowing, harvest, rain, repair; the same figure walking the road; light shifting from spring gold to autumn amber.

  5. A Warning
     Enoch prophesies: the Lord comes with ten thousands of his holy ones to judge all. Stage: a crowded market square at midday, a lone voice rising, the crowd turning; the sky darkening at the edges; a still point of dread.

  6. Walking with God
     The record repeats: Enoch walked with God — a companionship of daily faithfulness. Stage: a road at dusk, two figures walking side by side, one visible, one as light; the last light of day on a quiet path.

  7. Taken
     Enoch is not, for God takes him — no grave, no death, only the road that ends in light. Stage: a hilltop road at sunrise, the figure fading into a shining mist; the city below stirring awake; a doorway of light at the horizon.
