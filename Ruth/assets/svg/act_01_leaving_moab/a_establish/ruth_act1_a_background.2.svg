<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky Dawn/Dusk Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4854" />
      <stop offset="35%" stop-color="#4A6A75" />
      <stop offset="65%" stop-color="#9C7759" />
      <stop offset="88%" stop-color="#D4A56A" />
      <stop offset="100%" stop-color="#E8C89B" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="1" />
      <stop offset="30%" stop-color="#F2C880" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#D4A56A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D4A56A" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain Parallax Gradients -->
    <linearGradient id="farMountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556E75" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8A7A68" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="midMountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40585E" />
      <stop offset="100%" stop-color="#6E4A35" />
    </linearGradient>

    <linearGradient id="nearMesaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543A2A" />
      <stop offset="100%" stop-color="#8B5E3C" />
    </linearGradient>

    <!-- Atmospheric Dust Haze -->
    <linearGradient id="dustHaze" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8C89B" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#D4A56A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4A6A75" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Sun Disc and Atmospheric Halo -->
  <g id="sun-assembly">
    <circle cx="380" cy="260" r="160" fill="url(#sunGlow)" />
    <circle cx="380" cy="260" r="52" fill="#FFF3D6" />
  </g>

  <!-- Distant Clouds & Light Haze -->
  <g id="clouds" opacity="0.4">
    <path d="M 100,220 Q 250,200 450,230 Q 700,260 950,220 Q 1200,190 1500,230 Q 1750,260 1920,240 L 1920,320 L 0,320 Z" fill="#E8C89B" opacity="0.3" />
    <path d="M 0,160 Q 300,180 600,150 Q 1000,120 1400,160 Q 1700,180 1920,150 L 1920,210 L 0,210 Z" fill="#C29D75" opacity="0.2" />
  </g>

  <!-- Far Mountain Range (Layer 1) -->
  <g id="far-mountains">
    <path d="M -50,560 
             L 120,490 L 260,520 L 410,440 L 580,490 L 720,420 
             L 890,470 L 1050,390 L 1220,450 L 1380,380 L 1560,430 
             L 1740,360 L 1970,440 L 1970,750 L -50,750 Z" fill="url(#farMountainGrad)" />
  </g>

  <!-- Mid Mountain Range / Mesas (Layer 2) -->
  <g id="mid-mountains">
    <path d="M -20,620 
             L 180,540 L 320,570 L 480,480 L 620,530 
             L 810,460 L 980,510 L 1140,430 L 1310,490 
             L 1490,420 L 1680,470 L 1850,410 L 1940,450 
             L 1940,820 L -20,820 Z" fill="url(#midMountainGrad)" />
  </g>

  <!-- Near Mesa Ridge & Moabite Village Silhouette (Layer 3) -->
  <g id="near-mesa-and-architecture">
    <!-- Mesa Body -->
    <path d="M -10,690 
             Q 250,650 500,670 
             L 750,610 L 920,630 L 1100,560 L 1400,580 L 1650,520 L 1930,550 
             L 1930,880 L -10,880 Z" fill="url(#nearMesaGrad)" />

    <!-- Distant Moabite Village / Ruins Silhouette on the Right Mesa Ridge -->
    <g id="moab-village-silhouette" fill="#3D291E" opacity="0.95">
      <!-- Outer Gate Archway & Towers -->
      <rect x="1520" y="475" width="22" height="48" rx="2" />
      <rect x="1562" y="470" width="28" height="53" rx="2" />
      <path d="M 1542,490 Q 1552,480 1562,490 L 1562,523 L 1542,523 Z" /> <!-- Arch -->
      
      <!-- Terraced Dwellings -->
      <rect x="1590" y="485" width="45" height="38" />
      <rect x="1600" y="468" width="25" height="20" />
      <rect x="1635" y="492" width="35" height="30" />
      <rect x="1670" y="480" width="40" height="42" />
      <rect x="1685" y="462" width="20" height="20" />
      <circle cx="1695" cy="460" r="8" /> <!-- Small dome -->

      <rect x="1710" y="498" width="50" height="25" />
      <rect x="1760" y="505" width="40" height="20" />

      <!-- Watchtower Windows -->
      <rect x="1570" y="480" width="4" height="8" fill="#D4A56A" opacity="0.6" />
      <rect x="1578" y="480" width="4" height="8" fill="#D4A56A" opacity="0.6" />
      <rect x="1692" y="472" width="5" height="7" fill="#D4A56A" opacity="0.5" />
    </g>
  </g>

  <!-- Atmospheric Dust Layer across Horizon -->
  <rect x="0" y="480" width="1920" height="400" fill="url(#dustHaze)" />
</svg>