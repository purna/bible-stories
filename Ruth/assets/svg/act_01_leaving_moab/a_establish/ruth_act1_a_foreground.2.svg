<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Fabric Weave Pattern for Travel Sack -->
    <pattern id="fabricWeave" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#7A5438" />
      <path d="M 0,3 L 12,3 M 0,9 L 12,9" stroke="#5C3D26" stroke-width="2" />
      <path d="M 3,0 L 3,12 M 9,0 L 9,12" stroke="#966B4A" stroke-width="2" />
    </pattern>

    <!-- Wood Oak Grain Gradient -->
    <linearGradient id="woodOakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B" />
      <stop offset="30%" stop-color="#5C3A1A" />
      <stop offset="70%" stop-color="#6E441F" />
      <stop offset="100%" stop-color="#3D240F" />
    </linearGradient>

    <!-- Stone Threshold Gradient -->
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2A1F" />
      <stop offset="50%" stop-color="#241912" />
      <stop offset="100%" stop-color="#120C08" />
    </linearGradient>

    <!-- Thistle Bloom Gradient -->
    <radialGradient id="thistleBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BA789B" />
      <stop offset="70%" stop-color="#7A4262" />
      <stop offset="100%" stop-color="#4A263B" />
    </radialGradient>
  </defs>

  <!-- Left Foreground: Desert Thistle & Sagebrush (grass key) -->
  <g id="fg-desert-thistle">
    <!-- Main Thorny Stems -->
    <path d="M 80,1080 Q 120,920 90,780 Q 70,680 140,560" stroke="#3A5243" stroke-width="12" fill="none" stroke-linecap="round" />
    <path d="M 120,1080 Q 180,950 210,820 Q 230,730 190,640" stroke="#2B3D32" stroke-width="9" fill="none" stroke-linecap="round" />
    <path d="M 40,1080 Q 60,960 30,860" stroke="#233329" stroke-width="8" fill="none" stroke-linecap="round" />

    <!-- Sharp Prickly Leaves -->
    <path d="M 105,850 Q 160,820 180,840 Q 140,870 100,860 Z" fill="#486653" />
    <path d="M 95,760 Q 30,730 15,750 Q 60,780 90,770 Z" fill="#385242" />
    <path d="M 115,680 Q 175,640 195,660 Q 150,695 110,690 Z" fill="#486653" />
    <path d="M 175,780 Q 240,750 255,770 Q 210,800 170,790 Z" fill="#2B3D32" />

    <!-- Thorns on Stem -->
    <path d="M 102,820 L 118,812 L 104,828 Z" fill="#1A261F" />
    <path d="M 94,740 L 80,732 L 92,748 Z" fill="#1A261F" />
    <path d="M 125,620 L 140,612 L 126,628 Z" fill="#1A261F" />

    <!-- Thistle Flowers / Bloom Heads -->
    <!-- Bloom 1 -->
    <g transform="translate(140, 560)">
      <path d="M -20,10 C -25,-10 0,-30 0,-30 C 0,-30 25,-10 20,10 Z" fill="#3D5444" />
      <path d="M -18,-20 C -25,-40 -10,-60 0,-65 C 10,-60 25,-40 18,-20 Z" fill="url(#thistleBloom)" />
    </g>

    <!-- Bloom 2 -->
    <g transform="translate(190, 640) scale(0.8)">
      <path d="M -20,10 C -25,-10 0,-30 0,-30 C 0,-30 25,-10 20,10 Z" fill="#3D5444" />
      <path d="M -18,-20 C -25,-40 -10,-60 0,-65 C 10,-60 25,-40 18,-20 Z" fill="url(#thistleBloom)" />
    </g>
  </g>

  <!-- Bottom Left: Woven Travel Sack resting on Rock Threshold (fabric_weave key) -->
  <g id="fg-travel-sack" transform="translate(220, 820)">
    <!-- Sack Body -->
    <path d="M 20,80 
             C 0,30 40,-10 110,0 
             C 180,10 210,50 200,110 
             C 190,170 130,210 60,190 
             C 10,175 0,130 20,80 Z" fill="url(#fabricWeave)" />
    
    <!-- Sack Shadow & Volume Overlay -->
    <path d="M 20,80 C 0,30 40,-10 110,0 C 180,10 210,50 200,110 Z" fill="#2E1B0E" opacity="0.35" />

    <!-- Leather Tied Straps & Buckle -->
    <path d="M 45,25 C 70,60 100,110 130,165" stroke="#3D2010" stroke-width="10" fill="none" stroke-linecap="round" />
    <path d="M 110,15 C 120,55 135,100 150,145" stroke="#3D2010" stroke-width="8" fill="none" stroke-linecap="round" />
    <rect x="80" y="75" width="18" height="22" rx="3" fill="#D4A359" stroke="#593E1B" stroke-width="3" />
  </g>

  <!-- Bottom Right: Wooden Walking Staff Leaning & Sandaled Foot Frame (wood_oak & stone keys) -->
  <g id="fg-walking-staff-and-threshold">
    <!-- Leaning Wooden Staff (wood_oak) -->
    <g id="walking-staff">
      <!-- Shadow of Staff -->
      <line x1="1620" y1="1080" x2="1490" y2="580" stroke="#0E0906" stroke-width="22" opacity="0.6" stroke-linecap="round" />
      <!-- Staff Body -->
      <line x1="1600" y1="1080" x2="1470" y2="580" stroke="url(#woodOakGrad)" stroke-width="18" stroke-linecap="round" />
      <!-- Carved Head Curve -->
      <path d="M 1470,580 Q 1455,540 1480,520 Q 1505,510 1500,535" stroke="url(#woodOakGrad)" stroke-width="16" fill="none" stroke-linecap="round" />
      <!-- Leather Grip Wrap -->
      <rect x="1485" y="640" width="16" height="45" rx="2" fill="#3D2413" transform="rotate(15, 1485, 640)" />
      <line x1="1480" y1="650" x2="1498" y2="655" stroke="#7A5230" stroke-width="2" />
      <line x1="1478" y1="662" x2="1496" y2="667" stroke="#7A5230" stroke-width="2" />
      <line x1="1476" y1="674" x2="1494" y2="679" stroke="#7A5230" stroke-width="2" />
    </g>

    <!-- Sandaled Foot Step at Threshold Edge -->
    <g id="sandaled-foot-threshold" transform="translate(1380, 930)">
      <!-- Foot Silhouette -->
      <path d="M 40,70 C 20,65 15,45 30,30 C 50,15 90,20 120,35 C 140,45 135,75 100,80 Z" fill="#A87A5B" />
      <!-- Leather Sandal Straps -->
      <path d="M 30,35 L 70,75 M 60,25 L 100,70 M 90,28 L 120,60" stroke="#3D2010" stroke-width="5" />
      <!-- Sandal Sole -->
      <path d="M 15,75 Q 70,88 135,80 Q 140,90 125,95 Q 60,100 10,85 Z" fill="#24140A" />
    </g>
  </g>

  <!-- Dark Bottom Vignette Threshold Framing (stone key) -->
  <g id="fg-vignette-frame">
    <path d="M -10,960 
             Q 350,910 800,950 
             Q 1350,990 1930,920 
             L 1930,1090 L -10,1090 Z" fill="url(#stoneGrad)" />
    <path d="M -10,960 Q 350,910 800,950 Q 1350,990 1930,920" stroke="#543D2E" stroke-width="4" fill="none" opacity="0.5" />
  </g>
</svg>