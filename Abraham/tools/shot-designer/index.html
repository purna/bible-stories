<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Abraham</title>
<!--
  SCENE DIRECTOR NOTES — Abraham (Genesis 12–22)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Call
     Abram stands at the edge of Haran as a divine voice summons him toward an unseen land. Stage: a crowded Chaldean crossroads at dawn, clay houses and caravan tracks; Abram, Sarai and their goods mid-departure; long shadows, dust in the air, the road opening empty toward the horizon.

  2. Egypt and Return
     Famine drives Abram into Egypt, where fear leads him to present Sarai as his sister — and Pharaoh's household pays the price until the truth surfaces. Stage: Nile-side palace gates, Egyptian banners and linen, gold light; Abram returning across the wilderness with restitution, contrite and poorer.

  3. Lot Chooses
     Abram and Lot part ways as their herdsmen quarrel; Lot lifts his eyes to the well-watered Jordan plain and takes it. Stage: a wide hilltop overlooking the green Jordan valley and the distant soot of Sodom; Abram generous and calm, Lot eager; midday glare on the plain, shade on the heights.

  4. Rescue of Lot
     Four eastern kings overrun Sodom and take Lot captive; Abram arms his trained servants and pursues by night, routing the invaders and refusing any spoil. Stage: torchlit desert march, dust and silhouettes, a swift dawn battle north of Damascus; Abram refusing the king of Sodom's offer on a moonlit plain.

  5. Covenant Stars
     God promises Abram descendants as numberless as the stars and seals the covenant in fire. Stage: Abram alone outside his tent at midnight, wrapped in a cloak, staring into a sky crowded with stars; a smoking fire pot and blazing torch passing between cut animals; deep indigo, ember orange.

  6. Hagar in Wilderness
     Sarai's Egyptian maid Hagar flees into the desert of Shur, where an angel of the Lord meets her at a spring and promises a son, Ishmael. Stage: a lone palm and hot spring in bleached sand; Hagar seated, startled, water jar at her feet; white heat, trembling mirage light.

  7. The Visitors
     Three men appear by the oaks of Mamre; Abram runs to offer water, bread, curds and a dressed calf, and hears the promise of a son. Stage: a great tent door in noon light, Abram hastening with a bowl, Sarah listening from inside; three figures under a scorched oak; hospitality rendered in clay and linen.

  8. Sodom and Gomorrah
     Abram bargains for the cities and Lot escapes as fire and brimstone fall; Lot's wife looks back and becomes a pillar of salt. Stage: a smoking plain at first light, zoar in a valley below, a faint salt-white silhouette on the ridge; Abram on a height watching the smoke rise like a furnace.

  9. Isaac Is Born
     In old age Sarah bears Isaac — laughter — and the household feasts at his weaning. Stage: a shaded tent interior with woven hangings, a sleeping infant, Sarah's astonished joy; warm lamp light, the sound of celebration carried outside.

  10. Moriah
     God tests Abraham: take Isaac to Moriah and offer him as a burnt offering; at the last moment a ram is caught in the thicket. Stage: a bare stone mountain at dawn, wood stacked on Isaac's back, the altar of unhewn stone, the angel's hand staying the knife; a ram in a nearby thorn bush, cold gold light.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
