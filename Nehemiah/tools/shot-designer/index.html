<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Nehemiah</title>
<!--
  SCENE DIRECTOR NOTES — Nehemiah (Nehemiah 1–13)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. Bad News
     Hanani comes from Judah and tells Nehemiah that the wall of Jerusalem is broken and its people are in trouble. Stage: a palace court at Susa in winter, a cupbearer hearing a report, a map of a ruined city; a man turning to prayer, his face in the light.

  2. Before the King
     Nehemiah asks the king for letters and timber, and the king grants what he asks, and he goes to the governors beyond the river. Stage: a royal throne room at noon, a cupbearer standing, a king with his sceptre, a scroll of letters; the favour of a monarch, a journey beginning.

  3. Night Inspection
     Nehemiah rises by night with a few men and inspects the broken walls and gates, telling no one. Stage: a ruined city at midnight, a torch in the rubble, a man on foot by the wall; a broken gate, a pool, a valley of darkness; the plan being made in silence.

  4. Rise and Build
     The people build, each family by its own gate, from the sheep gate to the tower of the ovens. Stage: a city of builders at dawn, a wall rising stone by stone, each family by its section; the sound of hammers, a woman, a goldsmith, a priest, all building.

  5. Sword and Trowel
     The builders work with one hand and hold a sword in the other, and the work is done with the sound of the trumpet. Stage: a wall under construction at noon, a man with a trowel in one hand and a sword in the other, a trumpet on the wall; the work going on under arms.

  6. The Outcry
     The people cry out against the Jewish nobles who charge interest, and Nehemiah charges them to give back the fields and the interest. Stage: a courtyard at midday, a crowd of the poor, a governor listening, a money lender's ledger; the debt being cancelled, a people set free.

  7. Plots and Rumours
     Sanballat and Geshem send messages to lure Nehemiah to the plain of Ono, and he answers: I am doing a great work. Stage: a wall at dusk, a servant with a letter, a governor refusing to come down; a false prophet shut into a room, a wall growing in the light.

  8. The Wall Completed
     The wall is finished in fifty-two days, and the enemies are afraid, knowing the work was done with the help of God. Stage: a finished wall at sunrise, a city gate closed, a man on the wall looking out; the sound of a trumpet, the fear of the neighbours.

  9. The Book Read
     Ezra reads the law from dawn to midday, and the people weep and then feast, for the day is holy. Stage: a great square at noon, a wooden pulpit, a scroll of the law, the people listening, their hands lifted; the word being read, a city learning its own story.

  10. Reform
     Nehemiah reforms the city: the Sabbath is kept, the tithes are brought in, and the people are counted. Stage: a city gate at the close of the day, a guard at the gate on the Sabbath, a storehouse for the tithes, a register of the people; the work of a city being made holy.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
