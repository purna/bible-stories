<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Fit the Pieces — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_shared/modal.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    :root{--ink:#3a2410;--paper:#fffaf0;--accent:#ffd84d;--good:#2e7d32;--bad:#c62828}
    html,body{width:100%;height:100%;overflow:hidden}
    body{font-family:'Comic Neue',Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center}
    .wrap{width:960px;height:540px;padding:14px;display:flex;flex:none;flex-direction:column;overflow:hidden;transform:scale(var(--game-scale,1));transform-origin:center}
    h1{font-size:1.6rem;text-align:center;margin:2px 0;color:var(--ink)}
    .sub{text-align:center;font-size:.95rem;opacity:.85;margin-bottom:10px}
    .scene{flex:1;display:flex;gap:28px;justify-content:center;align-items:center;padding-bottom:12px}
    .board-wrap,.tray-wrap{text-align:center}.label{font-size:.9rem;font-weight:800;margin-bottom:7px}
    .outline{width:404px;height:404px;background:#e8efe5;border:4px solid var(--ink);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;box-shadow:0 5px 0 #b9cbb4}
    .slot{position:relative;border:3px dashed #789178;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .2s,border-color .2s}
    .slot::after{content:attr(data-number);position:absolute;top:3px;left:5px;font-size:.62rem;font-weight:900;color:#789178}
    .slot .guide{width:40px;height:40px;opacity:.2;pointer-events:none}.slot .guide svg,.slot>svg{width:100%;height:100%}
    .slot.filled{border-style:solid;border-color:var(--good);background:#e8f5e9}.slot.filled::after{color:var(--good)}.slot.filled>svg{width:46px;height:46px}
    .tray{width:326px;max-height:404px;overflow-y:auto;background:#fff;border:3px solid #c9c3b7;border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(4,66px);gap:10px;justify-content:center;align-content:start}
    .piece{width:66px;height:66px;border-radius:12px;background:var(--accent);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;transition:transform .14s,filter .14s,opacity .14s;box-shadow:0 3px 0 #9d7613}
    .piece svg{width:42px;height:42px}.piece.claimed,.piece.picked,.piece.sortable-chosen{opacity:.78;transform:scale(1.1);filter:brightness(1.08);cursor:grabbing}.piece.placed{opacity:.22;pointer-events:none;box-shadow:none}
    .piece.released,.slot.drop-pop{animation:releasePop .28s ease-out}
    @keyframes releasePop{50%{transform:scale(1.1)}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Fit the Pieces
      <svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="4" cy="4" r="2" fill="#3a2410"/>
        <rect x="10" y="10" width="18" height="12" rx="6" fill="#ccae81"/>
        <path d="M10 20l7 7 7-7" stroke="#3a2410" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </h1>
    <div class="sub">Drag all 16 yellow pieces onto the squares showing the same pale picture.</div>
    <div class="scene">
      <div class="board-wrap"><div class="label">MATCHING GRID</div><div class="outline" id="outline"></div></div>
      <div class="tray-wrap"><div class="label">PIECES TO PLACE</div><div class="tray" id="tray"></div></div>
    </div>
  </div>
  <div class="modal-overlay" id="modal" role="dialog" aria-live="assertive">
    <div class="modal-card" id="modalCard">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-text" id="modalText"></div>
      <button type="button" class="modal-btn" id="modalBtn">Play again</button>
    </div>
  </div>
  <script src="_shared/timer.js"></script>
  <script>
    window.GAME_CONFIG = { timerSeconds: 150, timer: true };
    function fitGameToViewport(){document.documentElement.style.setProperty('--game-scale',Math.min(innerWidth/960,innerHeight/540))}addEventListener('resize',fitGameToViewport);fitGameToViewport();
    const pieces=[
      ['leaf','<svg viewBox="0 0 48 48"><path d="M8 38C8 18 21 7 40 8c-1 20-13 32-32 30Z" fill="#72b84e" stroke="#183b22" stroke-width="3"/><path d="M11 35 34 13" stroke="#183b22" stroke-width="3"/></svg>'],
      ['wheat','<svg viewBox="0 0 48 48"><path d="M24 43V8" stroke="#76521e" stroke-width="3"/><g fill="#e3af32" stroke="#76521e" stroke-width="2"><ellipse cx="18" cy="15" rx="5" ry="8"/><ellipse cx="30" cy="21" rx="5" ry="8"/><ellipse cx="18" cy="29" rx="5" ry="8"/></g></svg>'],
      ['goat','<svg viewBox="0 0 48 48"><path d="M12 16 6 8m30 8 6-8" stroke="#5b3624" stroke-width="3"/><path d="M9 23c0-12 30-12 30 0v10c0 12-30 12-30 0Z" fill="#d8c39e" stroke="#3a2410" stroke-width="3"/><circle cx="18" cy="27" r="2"/><circle cx="30" cy="27" r="2"/><path d="M20 35h8" stroke="#3a2410" stroke-width="3"/></svg>'],
      ['fish','<svg viewBox="0 0 48 48"><path d="M7 24c8-13 24-13 32 0-8 13-24 13-32 0Zm32 0 7-8v16Z" fill="#45a5df" stroke="#173b59" stroke-width="3"/><circle cx="18" cy="21" r="2" fill="#173b59"/></svg>'],
      ['star','<svg viewBox="0 0 48 48"><path d="m24 4 6 13 14 2-10 10 2 14-12-7-12 7 2-14L4 19l14-2Z" fill="#ffb627" stroke="#744500" stroke-width="3"/></svg>'],
      ['bird','<svg viewBox="0 0 48 48"><path d="M5 29c9-17 17-13 20-5 5-10 12-11 18-3-7-1-11 3-14 10-10 9-19 6-24-2Z" fill="#9b6b43" stroke="#3a2410" stroke-width="3"/><circle cx="33" cy="22" r="2"/></svg>'],
      ['tree','<svg viewBox="0 0 48 48"><path d="M21 28h7v16h-7Z" fill="#7b4b25"/><path d="M24 4C9 4 7 20 14 27c-2 9 22 9 20 0 10-8 3-23-10-23Z" fill="#4f9d52" stroke="#1d4c2b" stroke-width="3"/></svg>'],
      ['water','<svg viewBox="0 0 48 48"><path d="M24 4C17 15 11 23 11 31a13 13 0 0 0 26 0c0-8-6-16-13-27Z" fill="#48b8e8" stroke="#174b68" stroke-width="3"/></svg>'],
      ['sun','<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="10" fill="#ffd43b" stroke="#765000" stroke-width="3"/><g stroke="#e89b00" stroke-width="3" stroke-linecap="round"><path d="M24 3v7m0 28v7M3 24h7m28 0h7M9 9l5 5m20 20 5 5M39 9l-5 5M14 34l-5 5"/></g></svg>'],
      ['moon','<svg viewBox="0 0 48 48"><path d="M30 6c-11 2-18 12-15 23s16 16 25 10c-9 3-18-2-21-11s2-19 11-22Z" fill="#f0e2a8" stroke="#3a2410" stroke-width="3"/></svg>'],
      ['cross','<svg viewBox="0 0 48 48"><rect x="20" y="6" width="8" height="36" rx="2" fill="#c9a877" stroke="#3a2410" stroke-width="3"/><rect x="8" y="16" width="32" height="8" rx="2" fill="#c9a877" stroke="#3a2410" stroke-width="3"/></svg>'],
      ['dove','<svg viewBox="0 0 48 48"><path d="M6 26c10-14 20-10 24-2 6-8 12-8 16-2-8 0-11 4-13 11-9 10-20 7-27-1Z" fill="#f7f7f7" stroke="#3a2410" stroke-width="3"/><circle cx="30" cy="20" r="2" fill="#3a2410"/></svg>'],
      ['lamp','<svg viewBox="0 0 48 48"><path d="M10 30c0-9 8-16 14-16s14 7 14 16c0 5-6 8-14 8s-14-3-14-8Z" fill="#e3af32" stroke="#3a2410" stroke-width="3"/><path d="M20 38h8v4h-8Z" fill="#3a2410"/><path d="M34 22c4-2 8 0 8 4" stroke="#3a2410" stroke-width="3" stroke-linecap="round" fill="none"/></svg>'],
      ['crown','<svg viewBox="0 0 48 48"><path d="M8 34 6 16l10 8 8-12 8 12 10-8-2 18Z" fill="#ffd84d" stroke="#3a2410" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="12" r="2" fill="#3a2410"/><circle cx="8" cy="16" r="2" fill="#3a2410"/><circle cx="40" cy="16" r="2" fill="#3a2410"/></svg>'],
      ['anchor','<svg viewBox="0 0 48 48"><circle cx="24" cy="8" r="4" fill="none" stroke="#3a2410" stroke-width="3"/><path d="M24 12v26M10 24h28M12 32c2 6 8 10 12 10s10-4 12-10" stroke="#3a2410" stroke-width="3" stroke-linecap="round" fill="none"/></svg>'],
      ['scroll','<svg viewBox="0 0 48 48"><rect x="10" y="14" width="28" height="20" fill="#f3e6c4" stroke="#3a2410" stroke-width="3"/><path d="M10 14c-4 0-4 6 0 6M38 34c4 0 4-6 0-6" stroke="#3a2410" stroke-width="3" fill="none"/></svg>']
    ];
    const outline=document.getElementById('outline'),trayEl=document.getElementById('tray');
    const modal=document.getElementById('modal'),modalCard=document.getElementById('modalCard'),modalIcon=document.getElementById('modalIcon'),modalTitle=document.getElementById('modalTitle'),modalText=document.getElementById('modalText'),modalBtn=document.getElementById('modalBtn');
    const CHECK_SVG='<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 16.5l5.5 5.5L24 11" stroke="#1b5e20" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const HOURGLASS_SVG='<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 4h14l-1 3c-1 3-4 5-6 7 2 2 5 4 6 7l1 3H9l1-3c1-3 4-5 6-7-2-2-5-4-6-7Z" fill="#fff" stroke="#1b5e20" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 4v24" stroke="#1b5e20" stroke-width="2" stroke-dasharray="2 2"/></svg>';
    let placed=0;
    const gridPieces=[...pieces];
    for(let i=gridPieces.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[gridPieces[i],gridPieces[j]]=[gridPieces[j],gridPieces[i]]}
    if(gridPieces.every((piece,i)=>piece[0]===pieces[i][0]))gridPieces.push(gridPieces.shift());
    gridPieces.forEach(([name,svg],i)=>{const slot=document.createElement('div');slot.className='slot';slot.dataset.place=name;slot.dataset.number=i+1;slot.innerHTML=`<span class="guide">${svg}</span>`;outline.appendChild(slot)});
    pieces.forEach(([name,svg])=>{const piece=document.createElement('div');piece.className='piece';piece.dataset.name=name;piece.setAttribute('aria-label',name);piece.innerHTML=svg;trayEl.appendChild(piece)});
    document.addEventListener('pointerdown',e=>{const el=e.target.closest('.piece,.modal-btn');if(el)el.classList.add('picked')});
    document.addEventListener('pointerup',e=>{const el=e.target.closest('.piece,.modal-btn');if(!el)return;el.classList.remove('picked');el.classList.remove('released');void el.offsetWidth;el.classList.add('released')});
    const tray=new Sortable(trayEl,{group:{name:'pieces',pull:'clone',put:false},draggable:'.piece',sort:false,animation:150,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',forceFallback:true,fallbackOnBody:true,fallbackTolerance:3});
    const slotSortables=[];
    document.querySelectorAll('.slot').forEach(slot=>{
      const s=new Sortable(slot,{group:'pieces',draggable:'.piece',sort:false,animation:150,forceFallback:true,fallbackOnBody:true,fallbackTolerance:3,onAdd(evt){const clone=evt.item,source=trayEl.querySelector(`.piece[data-name="${clone.dataset.name}"]`);if(modal.classList.contains('active')||slot.classList.contains('filled')||clone.dataset.name!==slot.dataset.place){slot.style.outline='4px solid var(--bad)';setTimeout(()=>slot.style.outline='',500);clone.remove();return}slot.innerHTML=clone.querySelector('svg').outerHTML;slot.classList.add('filled');slot.classList.remove('drop-pop');void slot.offsetWidth;slot.classList.add('drop-pop');source.classList.add('placed');clone.remove();placed++;if(placed===pieces.length)setTimeout(()=>finish(true),400)}});
      slotSortables.push(s);
    });
    function showModal(kind,title,lines,btnLabel){
      modalCard.classList.remove('success','timeout');
      if(kind==='success')modalCard.classList.add('success');
      if(kind==='timeout')modalCard.classList.add('timeout');
      modalIcon.innerHTML = kind==='success' ? CHECK_SVG : HOURGLASS_SVG;
      modalTitle.textContent = title;
      modalText.innerHTML = lines.map(l => /[“”"]/.test(l) ? `<div class="modal-verse">${l}</div>` : `<div>${l}</div>`).join('');
      modalBtn.textContent = btnLabel || 'Play again';
      modal.classList.add('active');
      modalBtn.onclick = () => location.reload();
    }
    function finish(success){
      tray.option('disabled',true);
      slotSortables.forEach(s=>s.option('disabled',true));
      if(success){
        showModal('success','All sixteen pieces fit!',['"The Lord is my rock, my fortress and my deliverer." — 2 Samuel 22:2'],'Play again');
        window.dispatchEvent(new CustomEvent('game-complete'));
        if(window.parent!==window)window.parent.postMessage({type:'game-complete',game:'fit_pieces'},'*');
      } else {
        showModal('timeout','Time’s up!',['"Be still before the Lord and wait patiently." — Psalm 37:7'],'Try again');
        window.dispatchEvent(new CustomEvent('game-over'));
      }
    }
    addEventListener('game-timeout',()=>{if(modal.classList.contains('active'))return;finish(false);});
  </script>
</body>
</html>
