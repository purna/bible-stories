  <title>Story Games</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }

    const GAME_PLAN_DESCRIPTIONS = {"Abraham":[{"chapter":"The Call","objective":"Follow the road markers out of Haran."},{"chapter":"Egypt and Return","objective":"Choose honest repairs after a fearful mistake."},{"chapter":"Lot Chooses","objective":"Survey the land and give Lot first choice."},{"chapter":"Rescue of Lot","objective":"Plan a fast night rescue without taking spoil."},{"chapter":"Covenant Stars","objective":"Trace the promised constellation."},{"chapter":"Hagar in the Wilderness","objective":"Find water and listen before acting."},{"chapter":"The Visitors","objective":"Prepare hospitality before the guests depart."},{"chapter":"Sodom and Gomorrah","objective":"Guide Lot’s household away without looking back."},{"chapter":"Isaac Is Born","objective":"Assemble a celebration tent."},{"chapter":"Moriah","objective":"Climb, gather wood, and respond to the provided ram."}],"Adam":[{"chapter":"Formed from Dust","objective":"Gather the garden’s elements in creation order."},{"chapter":"The Garden","objective":"Tend the garden by planting seeds and pulling weeds before they spread."},{"chapter":"Together","objective":"Build a shared shelter and tend one plot together."},{"chapter":"The Boundary","objective":"Navigate abundance while leaving one tree untouched."},{"chapter":"The Choice","objective":"Spot the serpent’s half-truths in a dialogue puzzle."},{"chapter":"Hiding","objective":"Follow footprints and admit what happened."},{"chapter":"East of Eden","objective":"Pack seeds and begin cultivation outside the garden."},{"chapter":"Cain and Abel","objective":"Prepare offerings with care, then cool Cain’s anger."},{"chapter":"The Field","objective":"Witness consequence and mark a refuge path."},{"chapter":"A New Line","objective":"Plant a family tree from Seth onward."}],"Babel":[{"chapter":"One Language","objective":"Coordinate a village task with shared symbols."},{"chapter":"The Plain","objective":"Choose a safe settlement site."},{"chapter":"Bake the Brick ses."},{"chapter":"The Flocks","objective":"Sort speckled and spotted animals fairly."},{"chapter":"Leaving Haran","objective":"Pack the camp before Laban catches up."},{"chapter":"The Night Wrestling","objective":"Hold on through the night and receive a new name."},{"chapter":"Meeting Esau","objective":"Arrange gifts, then step forward unarmed."},{"chapter":"Joseph’s Coats","objective":"Recognise favouritism forming in the household."}],"Jeremiah":[{"chapter":"The Call","objective":"Touch the right words to the young prophet’s mouth."},{"chapter":"The Almond Branch","objective":"Spot signs that God is watching over the word."},{"chapter":"At the Temple Gate","objective":"Separate ritual confidence from justice."},{"chapter":"The Scroll","objective":"Dictate to Baruch and rebuild the burned scroll."},{"chapter":"The Potter","objective":"Reshape the clay while it remains workable."},{"chapter":"The Yoke","objective":"Carry the warning despite Hananiah’s easy promise."},{"chapter":"The Cistern","objective":"Coordinate Ebed-melech’s rope rescue."},{"chapter":"Buy the Field","objective":"Complete a land purchase while siege closes in."},{"chapter":"The Fall of Jerusalem","objective":"Guide survivors through the breached city."},{"chapter":"Lament and Hope","objective":"Pair grief lines with stubborn hope."}],"Job":[{"chapter":"A Blameless Life","objective":"Tend Job’s household and practice generous justice."},{"chapter":"The Accuser","objective":"Observe the heavenly challenge without controlling it."},{"chapter":"Loss upon Loss","objective":"Receive each messenger and sit with the silence."},{"chapter":"Seven Days","objective":"Keep vigil without offering explanations."},{"chapter":"Job Speaks","objective":"Build an honest lament from grief and protest."},{"chapter":"The Friends","objective":"Identify when counsel becomes accusation."},{"chapter":"Elihu","objective":"Listen, test claims, and resist easy scoring."},{"chapter":"Out of the Whirlwind","objective":"Explore objective":"Hide the scouts and mark the scarlet cord."},{"chapter":"Crossing Jordan","objective":"Carry twelve memorial stones from the riverbed."},{"chapter":"Jericho","objective":"March the pattern, sound the trumpets, protect Rahab."},{"chapter":"Achan’s Hidden Goods","objective":"Trace the community’s loss to the buried objects."},{"chapter":"Ai","objective":"Set the ambush without repeating earlier presumption."},{"chapter":"The Gibeonites","objective":"Inspect the worn supplies and face a rushed oath."},{"chapter":"The Long Campaign","objective":"Resolve territory challenges without spectacle."},{"chapter":"Allot the Land","objective":"Distribute inheritance among tribes."},{"chapter":"Choose This Day","objective":"Place household stones beside the covenant witness."}],"Moses":[{"chapter":"The Child in the River","objective":"Guide the basket through reeds while Miriam keeps watch."},{"chapter":"The Burning Bush","objective":"Herd sheep, approach the fire, and answer the call."},{"chapter":"Before the Throne","objective":"Match signs and warnings to each audience."},{"chapter":"Passover Night","objective":"Prepare the meal and mark the doorway before departure."},{"chapter":"Through the Sea","objective":"Keep the people moving along the opened path."},{"chapter":"Bread in the Wilderness","objective":"Gather only enough manna for the day."},{"chapter":"Sinai","objective":"Arrange the camp and carry the covenant words."},{"chapter":"The Golden Calf","objective":"Confront the idol and intercede for the people."},{"chapter":"Forty Years","objective":"Navigate a provision-and-trust journey map."},{"chapter":"Mount Nebo","objective":"Appoint Joshua and identify the land from afar."}],"Nehemiah":[{"chapter":"Bad News","objective":"Map Jerusalem’s broken gates while Nehemiah prays."},{"chapter":"Before the King","objective":"Choose a clear request and realistic resources."},{"chapter":"Night Inspection","objective":"Survey ruined walls without alerting opponents."},{"chapter":"Rise and Build","objective":"Assign families to adjacent wall sections."},{"chapter":"Sword and Trowel","objective":"Balance guarding with construction."},{"chapter":"The Outcry","objective":"Cancel exploitative debts and restore fields."},{"chapter":"Plots and Rumours","objective":"Recognise distractions designed to stop the work."},{"chapter":"The Wall Completed","objective":"Close the final gap and set gatekeepers."},{"chapter":"The Book Read","objective":"Rebuild the platform and help the people understand."},{"chapter":"Reform","objective":"Inspect storerooms and restore shared commitments."}],"Noah":[{"chapter":"The Warning","objective":"Accept the Ark blueprint."},{"chapter":"The Blueprint","objective":"Measure the hull to the given proportions."},{"chapter":"The Long Build","objective":"Gather timber, fit planks, and seal with pitch."},{"chapter":"The Gathering","objective":"Pair animals and stock each pen."},{"chapter":"The Door Shuts","objective":"Finish the final checks and surrender control."},{"chapter":"Forty Days","objective":"Feed, calm, and clean animal pens during the storm."},{"chapter":"The Long Wait","objective":"Send raven and doves at the right intervals."},{"chapter":"Dry Ground","objective":"Release animals habitat by habitat."},{"chapter":"The Covenant","objective":"Build the altar and reveal the rainbow."},{"chapter":"The Vineyard","objective":"Witness Noah’s failure and choose how the sons respond."}],"Ruth":[{"chapter":"Leaving Moab","objective":"Pack lightly and choose whether to accompany Naomi."},{"chapter":"Your People","objective":"Follow the road to Bethlehem together."},{"chapter":"Gleaning","objective":"Collect only grain left for gleaners."},{"chapter":"Boaz Notices","objective":"Deliver water and protection instructions to the workers."},{"chapter":"At the Threshing Floor","objective":"Follow Naomi’s plan with restraint and clarity."},{"chapter":"At the Gate","objective":"Arrange witnesses and present the redemption choice."},{"chapter":"Redeemed","objective":"Transfer the sandal and join the households."},{"chapter":"Obed","objective":"Build the family line toward David."}],"Samuel":[{"chapter":"The Boy at Shiloh","objective":"Complete temple tasks beside Eli."},{"chapter":"The Voice at Night","objective":"Listen three times and answer correctly."},{"chapter":"A Hard Message","objective":"Tell Eli the whole message without embellishment."},{"chapter":"The Ark Captured","objective":"Track the cost of treating the Ark like a charm."},{"chapter":"Ebenezer","objective":"Raise a memorial stone after deliverance."},{"chapter":"A King Demanded","objective":"Hear the elders and explain the tradeoffs."},{"chapter":"Saul Chosen","objective":"Find Saul among the baggage."},{"chapter":"Saul’s First Victory","objective":"Rally the people and refuse revenge."},{"chapter":"The Rejected King","objective":"Compare obedience with impressive sacrifice."},{"chapter":"David Anointed","objective":"Look past height and choose the shepherd son."}]};
    function esc(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    async function init() {
      const container = document.getElementById('content');
      try {
        const manifest = await fetch('manifest.json').then(r => r.json());
        const gamesList = Array.isArray(manifest.games) ? manifest.games : [];
        const byStory = {};
        for (const g of gamesList) {
          const file = g.file;
          if (!file || !g.story || !g.act) continue;
          const parts = file.split('/');
          const actFile = parts[parts.length - 1];
          const actMatch = actFile.match(/act(\d+)\.html$/);
          const act = actMatch ? parseInt(actMatch[1], 10) : g.act;
          byStory[g.story] = byStory[g.story] || [];
          byStory[g.story].push({ act, file, chapter: g.chapter || '', objective: g.objective || '' });
        }
        const stories = Object.keys(byStory).sort();
        container.innerHTML = '';
        for (const story of stories) {
          const acts = byStory[story].filter(x => x.act !== null).sort((a, b) => a.act - b.act);
          if (!acts.length) continue;
          const canonPath = story + '/story-canon.json';
          let canonChapters = [];
          try {
            const canon = await fetch(canonPath).then(r => r.json());
            const chapters = Array.isArray(canon.chapters) ? canon.chapters : [];
            canonChapters = chapters.map((ch, idx) => ({
              act: idx + 1,
              chapter: ch.chapter || ('Act ' + (idx + 1))
            }));
          } catch {
            canonChapters = acts.map((a, idx) => ({ act: a.act, chapter: 'Act ' + a.act }));
          }
          const chapterByAct = Object.fromEntries(canonChapters.map(c => [String(c.act), c.chapter]));
          const planChapters = (GAME_PLAN_DESCRIPTIONS[story] || []).reduce((acc, ch) => {
            acc[String(ch.chapter)] = ch.objective;
            return acc;
          }, {});
          const section = document.createElement('div');
          section.className = 'story';
          const title = document.createElement('h2');
          title.textContent = story;
          section.appendChild(title);
          const games = document.createElement('div');
          games.className = 'games';
          for (const a of acts) {
            const item = document.createElement('div');
            item.className = 'game-item';
            const link = document.createElement('a');
            link.href = a.file;
            const chapterName = chapterByAct[String(a.act)] || a.chapter || ('Act ' + a.act);
            link.textContent = 'Act ' + a.act + ' — ' + esc(chapterName);
            item.appendChild(link);
            const note = planChapters[chapterName];
            const objective = a.objective;
            const parts = [];
            if (note) parts.push('Note: ' + note);
            if (objective) parts.push('Objective: ' + objective);
            if (parts.length) {
              const descEl = document.createElement('div');
              descEl.className = 'game-desc';
              descEl.textContent = parts.join(' | ');
              item.appendChild(descEl);
            }
            games.appendChild(item);
          }
          section.appendChild(games);
          container.appendChild(section);
        }
        if (!container.children.length) {
          container.innerHTML = '<p>No story games found.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p class=\"error\">Failed to load games index.</p>';
        console.error(err);
      }
    }
    init();
  </script>
