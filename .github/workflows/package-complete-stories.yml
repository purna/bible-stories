# Packages every complete story in assets/journey/stories.json.
#
# A story is complete when:
#   - it is listed in assets/journey/stories.json
#   - its folder contains index.html
#   - its local assets can be resolved from precache-manifest.json or by
#     crawling the story's HTML/CSS/JS references
#
# The generated ZIPs and dist/manifest.json are committed back to main so
# MediaMesh can fetch them from /dist/<story-id>.zip on GitHub Pages.
name: Package complete stories

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "package-stories"
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate complete story packages
        run: node scripts/package-stories.mjs --check

      - name: Build story packages
        run: node scripts/package-stories.mjs

      - name: Commit dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No package changes to commit."
            exit 0
          fi
          git commit -m "chore: rebuild story packages"
          git pull --rebase origin main
          git push origin HEAD:main
