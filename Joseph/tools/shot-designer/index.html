<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Joseph</title>
<!--
  SCENE DIRECTOR NOTES — Joseph (Genesis 37–47)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Coloured Robe
     Jacob loves Joseph best, makes him a coat of many colours, and the brothers hate him for his dreams. Stage: a sunlit field of wheat at noon, a boy in a long bright coat among his brothers, a sheaf bowing in the dream; gold stubble, a cold wind of envy.

  2. Dreams and the Pit
     The brothers throw Joseph into an empty pit, then sell him to Ishmaelites for twenty shekels of silver. Stage: a dry pit in the wilderness at dusk, a boy at the bottom looking up, the brothers eating bread at the top; a caravan arriving, the sun going down like a wound.

  3. Potiphar's House
     Joseph is bought by Potiphar, and the Lord prospers all he touches, until the wife's false witness sends him to prison. Stage: an Egyptian villa at midday, a trusted steward at a table, a burning accusation, a torn garment; marble, shade, and a door closing.

  4. The Prison
     In prison Joseph tends the king's cupbearer and baker, and interprets their dreams — one restored, one hanged. Stage: a stone prison cell at dawn, two men in a dungeon, a cup and a basket of birds on a table; a dream's hope and a dream's doom.

  5. Pharaoh's Dreams
     Pharaoh dreams of seven fat cows and seven lean, seven full ears and seven thin; Joseph is called from the dungeon to interpret. Stage: a throne room by the Nile at dawn, a king in gold, a summoned prisoner, seven fat and seven gaunt cattle in the dream's smoke; a single meaning, a nation listening.

  6. Storehouses
     Joseph is made governor, and Egypt gathers the grain of seven plenty into storehouses, city by city. Stage: a Nile landscape in high summer, fields of wheat, great storehouses with sealed doors, scribes and ox-carts; a nation's patience, measured in grain.

  7. The Brothers Arrive
     The brothers come to buy grain in Egypt, bow before Joseph, and do not know him. Stage: a grain hall at midday, a governor in Egyptian robes, ten shepherds bowing low, a search for truth in a false bottom; a cup, a silver, a recognition withheld.

  8. Benjamin's Cup
     Joseph plants his silver cup in Benjamin's sack, and offers to keep the thief as his slave. Stage: a grain hall at dawn, a steward with a cup, the brothers returning in fear, a cup found in the youngest's sack; a test of love for the father's son.

  9. Revealed
     Joseph can no longer contain himself, and the brothers see his face, and he says: I am Joseph your brother. Stage: a great hall at midday, all the court standing back, a man weeping on his brothers' necks, the world turning over; light on the floor, and a long embrace.

  10. Goshen
     Jacob and all his household settle in Goshen, the best of the land, and Joseph provides for them all. Stage: a green delta at dawn, a family arriving with flocks, the governor's chariot waiting, a father and son falling into each other's arms; the best of the land, in the years of famine.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
