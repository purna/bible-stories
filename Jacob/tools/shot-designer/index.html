<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shot Designer — Jacob</title>
<!--
  SCENE DIRECTOR NOTES — Jacob (Genesis 25–37)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Birthright
     Esau comes in exhausted from the field and sells his birthright for a single bowl of lentil stew. Stage: a camp kitchen at midday, a hunter gasping at the door, a pot of red stew steaming, two brothers bargaining; a bright, ordinary moment with a heavy price.

  2. The Stolen Blessing
     Rebekah dresses Jacob in Esau's clothes and goatskins; the blind Isaac feels the hands and blesses the wrong son. Stage: a tent at night, an old blind patriarch reaching out, a trembling younger son, the smell of the field in the garments; a lamp's last light, the blessing spoken.

  3. Bethel
     Jacob flees and sleeps with a stone for a pillow, dreaming of a ladder to heaven with angels ascending and descending. Stage: a night under the open sky, a lone figure on the ground, a great stair of light touching the sky; stars, and the Lord standing above it.

  4. Rachel at the Well
     At Haran Jacob rolls the stone from the well and waters Laban's flock for Rachel, and kisses her and weeps. Stage: a well in a highland pasture at noon, a great stone rolled aside, a shepherdess watering her sheep; a sudden meeting, water and tears.

  5. Laban's Bargain
     Laban deceives Jacob with Leah's veiled marriage, and Jacob serves seven more years for Rachel; the wages change like the weather. Stage: a wedding tent at night with a veil and a sister's face, a contract of years, a flock passing between the brothers-in-law; a lamp, a bargain, a long game.

  6. The Flocks
     Jacob breeds the flocks with peeled branches in the watering troughs, and the speckled and spotted increase. Stage: a river crossing with troughs, striped rods standing in the water, a great flock of goats, some dark, some speckled; morning light on a patient man's wealth.

  7. Leaving Haran
     Jacob flees Laban by night; Rachel hides the teraphim in a saddle and sits on them; the two camps meet on the hill of Gilead. Stage: a night crossing of a river, a caravan of tents and children, a woman hiding an idol; dawn overtaking a pursuit on a stony hill.

  8. The Night Wrestling
     Jacob wrestles a man by the Jabbok until daybreak, and his hip is touched; he is named Israel, for he strove with God. Stage: a riverbank in the dark before dawn, two figures locked, a hip given way, a name changed at sunrise; the first red light on the water.

  9. Meeting Esau
     Jacob sends gifts ahead and bows seven times; Esau runs to meet him, and they weep. Stage: a plain at dawn, a long line of gifts, a brother running with four hundred men; fear turning to a kiss; the sun climbing over a tent camp.

  10. Joseph's Coats
     Joseph is seventeen and his father loves him; the coat of many colours and the dreams of sheaves and stars set the brothers against him. Stage: a sunlit field of wheat, a boy in a long coat among his brothers, a sheaf bowing in a dream; gold stubble, a cold wind of envy.
  -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lets the js/ ES modules import three; js/three.js prefers the UMD
         global when present so only one three.js instance is ever created. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <aside id="side">
            <div class="hd"><b>Shots</b><button id="add" class="pr">+ Add shot</button></div>
            <div class="scn">
                <label for="scn">Scene</label>
                <select id="scn"></select>
                <button id="scnload" class="pr" disabled>Load</button>
                <small id="scne"></small>
            </div>
            <div id="shots"></div>
            <div class="exp"><button id="xo" class="pr">Import / Export…</button></div>
        </aside>
        <main id="vp">
            <div id="frm"><span id="pl"></span></div>
            <div id="fc">
                <div id="fg">
                    <div class="g">
                        <b>Move</b><button data-k="mL">◀</button><button data-k="mU">▲</button><button
                            data-k="mD">▼</button><button data-k="mR">▶</button>
                    </div>
                    <div class="g">
                        <b>Rotate</b><button data-k="rL">◀</button><button data-k="rU">▲</button><button
                            data-k="rD">▼</button><button data-k="rR">▶</button>
                    </div>
                    <div class="g"><b>Zoom</b><button data-k="zI">＋</button><button data-k="zO">－</button></div>
                </div>
                <button id="al" class="pr" hidden>Align frame to this view</button>
            </div>
        </main>
        <footer id="tl">
            <div class="tr">
                <button id="stp" title="Stop and return to edit view">⏹</button><button id="pp"
                    class="pr">▶</button><button id="pc">Play shot</button><button id="pa">Play all</button><span
                    id="tcd">0:00.0</span><span>/ <span id="tt"></span></span><label><input type="checkbox" id="lp"
                        checked /> Loop</label><label><input type="checkbox" id="shp" /> Show path</label>
            </div>
            <div id="tk">
                <div id="rl"></div>
                <div id="bl"></div>
                <div id="ph"></div>
            </div>
        </footer>
    </div>
    <div id="xm" hidden>
        <div class="mb">
            <div class="hd" style="padding: 0 0 8px"><b>Import / Export</b><button id="xc">✕ Close</button></div>
            <h4>Export scene</h4>
            <div class="xl">
                <button data-x="sj"><b>Scene 3D JSON</b><small>3D scene only (three.js format)</small></button><button
                    data-x="sJ"><b>3D JS file</b><small>initScene1(group) function, Pixel3D style</small></button>
                <button data-x="tj"><b>Scene + timeline JSON</b><small>3D scene, shots, transitions,
                        curves</small></button><button data-x="tJ"><b>Scene + timeline JS</b><small>Same data as a .js
                        file</small></button>
            </div>
            <h4>Render</h4>
            <div class="xl">
                <button data-x="png"><b>Stills (PNG .zip)</b><small>Frames at the current viewport
                        size</small></button>
                <button data-x="mp4"><b>Video (MP4)</b><small>H.264 via WebCodecs +
                        mp4-muxer</small></button>
                <label class="f">Stills rate<select id="sf">
                        <option value="1">Every 1 second</option>
                        <option value="12">12 per second</option>
                    </select></label><label class="f">Video fps<select id="vf">
                        <option>24</option>
                        <option selected>30</option>
                    </select></label>
            </div>
            <h4>Timeline only</h4>
            <div class="ed"><button id="ex">Timeline JSON</button>
                <button id="es">Each shot (separate files)</button>
            </div>
            <h4>Import</h4>
            <div class="ed">
                <button id="ld">Load JSON…</button><button id="ld2">Load 3D JS…</button><button id="pj">Paste
                    JSON</button>
            </div>
            <div id="xp"></div>
            <input type="file" id="fi" accept=".json" multiple hidden /><input type="file" id="fj" accept=".js" multiple
                hidden />
        </div>
    </div>
    <div id="jm" hidden>
        <textarea id="jt"></textarea>
        <div class="ed"><button id="jl" class="pr">Load this JSON</button><button id="jx">Close</button></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

    <!-- three.js also arrives as a UMD global for js/three.js to reuse. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
